<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#FBF3E8">
<title>GrammarPath — Learn English grammar, step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#7A5B49; --navy2:#8D6C57;
  --teal:#E08862; --teal2:#EBA383; --teal-bg:#FCF0E8; --teal-line:#F5DECD;
  --ink:#5D4A3E; --body:#77655A; --muted:#A79484; --faint:#B8A695;
  --line:#F1E5D7; --bg:#FCF5EC; --paper:#FFFEFB;
  --amber-bg:#FFF5E1; --amber-line:#F3E0BC; --amber:#A0763A;
  --good:#7BA26E; --good-bg:#F2F8EC; --good-line:#DBE8CF;
  --bad:#D98A6C; --bad-bg:#FCF0E9; --bad-line:#F3D8C7;
  --serif:'Lora',Georgia,serif; --sans:'IBM Plex Sans',-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:16px; --shadow:0 1px 3px rgba(122,91,73,.05),0 8px 22px rgba(122,91,73,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:only light}
html{scroll-behavior:smooth;background:var(--bg)}
body{font:400 15.5px/1.6 var(--sans);color:var(--body);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--teal);text-decoration:none}
:focus-visible{outline:2.5px solid var(--teal2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 26px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 16px var(--serif)}
.brand-name{font:600 16px var(--sans)}
.nav{display:flex;align-items:center;gap:4px}
.nav button{padding:7px 13px;border-radius:8px;font:500 13.5px var(--sans);color:var(--body)}
.nav button:hover{background:var(--bg)}
.nav button.active{color:var(--teal);font-weight:600;background:var(--teal-bg)}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:999px;padding:5px 13px;color:var(--amber);font:600 13px var(--sans);white-space:nowrap}
.xp-pill{display:flex;align-items:center;gap:6px;background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:999px;padding:5px 13px;color:var(--teal);font:600 13px var(--sans);white-space:nowrap}
.hamburger{display:none;font-size:20px;color:var(--navy);padding:4px 8px}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:34px 26px 80px}
.view{animation:fadeup .28s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font:600 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
h1.display{font:600 36px/1.15 var(--serif);color:var(--navy);margin:0 0 10px}
h2.section{font:600 22px var(--serif);color:var(--navy);margin:0 0 14px}
.lede{font:400 16px/1.65 var(--sans);color:var(--body);max-width:640px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;margin-bottom:44px}
.hero-pattern{font:500 15px var(--mono);color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:8px;display:inline-block;padding:8px 14px;margin:18px 0 22px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:11px 20px;font:600 14.5px var(--sans);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#D3754E}
.btn-ghost{border:1.5px solid var(--line);color:var(--navy);background:var(--paper)}
.btn-ghost:hover{border-color:var(--teal-line);background:var(--teal-bg)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy2)}
.hero-board{position:relative;background:#8A6A55;border-radius:14px;padding:26px;color:#F3E7DA;box-shadow:var(--shadow)}
.hero-board .hb-title{font:600 13px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#C9A98E;margin-bottom:14px}
.hb-sent{font:500 19px/1.7 var(--serif)}
.hb-sent b{color:#F2B27E;font-weight:600;border-bottom:2px solid rgba(242,178,126,.55)}
.hb-timeline{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}
.tl{position:relative;height:44px}
.tl-line{position:absolute;left:0;right:0;top:20px;height:2px;background:rgba(255,255,255,.28)}
.tl-dot{position:absolute;top:14px;width:14px;height:14px;border-radius:50%;background:#F2B27E}
.tl-span{position:absolute;top:17px;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(242,178,126,.25),#F2B27E)}
.tl-lab{position:absolute;top:34px;font:500 11px var(--sans);color:#CBAD93;transform:translateX(-50%)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:44px}
.level-card{padding:24px;display:flex;flex-direction:column;gap:12px;transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;text-align:left}
.level-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(15,61,92,.10),0 14px 30px rgba(15,61,92,.10)}
.level-tag{align-self:flex-start;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:4px 9px}
.lt-basic{background:#F1EEE4;color:#75705F}.lt-int{background:#F5EFEA;color:#7D7068}.lt-adv{background:#FCEFE3;color:#C97F45}
.level-card h3{font:600 21px var(--serif);color:var(--navy)}
.level-card p{font-size:13.5px;color:var(--muted);flex:1}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .5s ease}
.prog-num{font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.home-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.continue-card{padding:22px 24px;display:flex;align-items:center;gap:18px}
.cc-icon{width:46px;height:46px;border-radius:11px;background:var(--teal-bg);border:1px solid var(--teal-line);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:44px}
.stat{padding:16px 20px;text-align:center}
.stat .n{font:600 26px var(--serif);color:var(--navy)}
.stat .l{font:500 12px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ---------- level page ---------- */
.unit{margin-bottom:26px}
.unit-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.unit-h .u-eyebrow{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lesson-row{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .12s ease}
.lesson-row:last-child{border-bottom:none}
.lesson-row:hover{background:var(--teal-bg)}
.lr-check{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px}
.lr-done{background:var(--teal);color:#fff}
.lr-todo{border:2px solid #DCC9B6}
.lr-title{font:600 15px var(--sans);color:var(--navy)}
.lr-sub{font:400 12.5px var(--sans);color:var(--muted)}
.zh-term{display:inline-block;font:500 12px var(--sans);color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:99px;padding:1.5px 9px;margin-left:8px;vertical-align:2px;white-space:nowrap}
/* ---- Island home hero ---- */
.island-hero{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#FCE9D8}
.isl{display:block;width:100%;height:auto}
.island-story{max-width:680px;margin:30px auto 34px;text-align:center}
.island-story .story-zh{font:400 17px/2.05 var(--sans);color:var(--ink);margin:14px 0 22px}
.story-zh .sl{display:block;opacity:0;animation:fadeUp 1.1s ease forwards}
.story-zh .sl:nth-child(1){animation-delay:.4s}
.story-zh .sl:nth-child(2){animation-delay:2.4s}
.story-zh .sl:nth-child(3){animation-delay:4.6s}
.story-zh .sl:nth-child(4){animation-delay:7s}
.island-story .eyebrow{display:block;animation:fadeUp .8s ease both}
.island-story .hero-cta{display:flex;gap:12px;animation:fadeUp .9s ease .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.isl-sun{transform-box:fill-box;transform-origin:center;animation:sunPulse 5s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.isl-cloud{animation:cloudDrift 14s ease-in-out infinite alternate}
.isl-cloud.c2{animation-duration:19s;animation-delay:-6s}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(46px)}}
.isl-boat{transform:translate(-100px,188px);animation:sailIn 11s ease-in-out .4s forwards}
@keyframes sailIn{to{transform:translate(452px,188px)}}
.isl-rock{transform-box:fill-box;transform-origin:50% 80%;animation:boatRock 3.6s ease-in-out infinite}
@keyframes boatRock{0%,100%{transform:rotate(1.6deg) translateY(0)}50%{transform:rotate(-1.8deg) translateY(3px)}}
.isl-wave{animation:waveMove 7s linear infinite}
.isl-wave.w2{animation-duration:10s;animation-direction:reverse}
@keyframes waveMove{from{translate:0 0}to{translate:120px 0}}
.isl-cat{transform-box:fill-box;transform-origin:center bottom;animation:cat-bounce 3.2s ease-in-out infinite}
.isl-meow{opacity:0;animation:meowPop .7s ease 11.8s forwards}
@keyframes meowPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
.story-zh .sl{animation:none;opacity:1}
  .isl-sun,.isl-cloud,.isl-boat,.isl-rock,.isl-wave,.isl-cat,.island-story .story-zh,.island-story .eyebrow,.island-story .hero-cta{animation:none}
  .isl-boat{transform:translate(452px,188px)}
  .isl-meow{opacity:1;animation:none}
}
/* ---- My Cat Island ---- */
.isl-board{background:linear-gradient(180deg,#FBEED3,#F5E2BD);border:1.5px solid #EFDDBC;border-radius:24px;padding:22px 24px 26px;margin:20px 0}
.isl-sec{margin-bottom:18px}
.isl-sec:last-child{margin-bottom:0}
.isl-sec-h{font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#9A8158;margin:0 0 10px;display:flex;justify-content:space-between}
.cat-grid{display:flex;flex-wrap:wrap;gap:10px}
.cat-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1.5px solid #F0E2CB;border-radius:16px;padding:10px 6px 7px;width:92px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.ct-img{width:58px;height:58px;object-fit:contain}
.cat-tile.locked .ct-img{filter:brightness(0);opacity:.15}
.ct-breed{font:600 9.5px/1.2 var(--sans);color:var(--navy);text-align:center;min-height:23px;display:flex;align-items:center;justify-content:center}
.cat-tile.locked .ct-breed{color:#C8B594;letter-spacing:.1em}
.cat-tile:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(122,91,73,.12)}
.cat-tile .ct-n{font:600 10.5px var(--sans);color:var(--muted)}

.cat-tile.locked{background:#FAF3E6;border-style:dashed}
.cat-tile .mystery{position:absolute;top:28px;left:0;right:0;text-align:center;font:700 18px var(--sans);color:#FFFDF6;text-shadow:0 0 4px rgba(120,100,70,.4);z-index:1}
.cat-tile.love::after{content:"♥";position:absolute;top:3px;right:7px;color:#E58A9C;font-size:13px;animation:heartFloat 2.6s ease-in-out infinite}
@keyframes heartFloat{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-4px);opacity:1}}
.isl-stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.isl-chip{font:600 13px var(--sans);color:var(--navy);background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:7px 15px}
.unlock-card{display:flex;align-items:center;gap:14px;background:#FFF7E8;border:1.5px solid #F0DDB4;border-radius:16px;padding:12px 18px;margin:16px auto 4px;max-width:400px;text-align:left;font:400 13.5px var(--sans);color:var(--body);animation:fadeUp .7s ease both}
.unlock-card img{width:62px;height:62px;object-fit:contain}
.unlock-card b{color:var(--navy)}
.lsb-cat{display:flex;align-items:center;gap:10px;background:#FFFBF2;border:1.5px solid #F0E2CB;border-radius:14px;padding:10px 12px;margin:12px 18px 18px}
.lsb-cat img{width:46px;height:46px;object-fit:contain;flex-shrink:0}
.lsb-cat img.sil{filter:brightness(0);opacity:.12}
.lsb-cat .lc-t{font:600 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#B99B5E}
.lsb-cat .lc-n{font:600 11.5px/1.35 var(--sans);color:var(--navy)}
/* ---- Listening Fix-it Game ---- */
@keyframes rgPop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
@keyframes rgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes rgFlash{0%,100%{background:var(--bad-bg);border-color:var(--bad-line)}45%{background:#F3C3B0;border-color:var(--bad)}}
.rg-view{max-width:760px}
.rg-hero{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.rg-hero svg{width:46px;height:46px;flex-shrink:0}
.rg-playbox{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.rg-playbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;border:none;background:var(--teal);color:#fff;font:700 14px var(--sans);cursor:pointer;transition:transform .12s ease}
.rg-playbtn:hover{transform:translateY(-1px)}
.rg-article{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 24px}
.rg-article .rd-p{font-size:16px;line-height:2.15}
.rg-blank{display:inline-block;border-bottom:2px dashed var(--bad);color:var(--ink);background:var(--bad-bg);border-radius:5px;padding:1px 5px;cursor:pointer;transition:background .12s ease}
.rg-blank:hover{background:#F3D3C2}
.rg-blank.fixed{border-bottom:none;background:none;color:var(--good);font-weight:700;cursor:default;padding:1px 3px}
.rg-blank.shake{animation:rgShake .42s ease}
.rg-blank.fixed.pop{animation:rgPop .32s ease}
.rg-bank{background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:16px;padding:16px 18px;margin-top:16px}
.rg-bank-h{font:700 13px var(--sans);color:var(--navy);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.rg-bank-h span{font:400 12px var(--sans);color:var(--muted)}
.rg-chips{display:flex;flex-wrap:wrap;gap:9px}
.rg-chip{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--sans);color:var(--ink);background:var(--paper);border:1.5px solid var(--bad-line);border-radius:99px;padding:8px 16px;cursor:pointer;transition:all .12s ease}
.rg-chip:hover{border-color:var(--bad);transform:translateY(-1px)}
.rg-chip.sel{background:var(--bad);border-color:var(--bad);color:#fff;transform:translateY(-2px)}
.rg-chip.used{opacity:.28;pointer-events:none}
.rg-chip.flash{animation:rgFlash .42s ease}
.rg-let{font:700 11px var(--mono);opacity:.6}
.rg-status{text-align:center;font:600 14px var(--sans);color:var(--muted);padding:12px;margin-top:8px}
.rg-status b{color:var(--navy);font-size:16px}
.rg-status.done{color:var(--good);font:700 16px var(--sans)}
@media (max-width:640px){
  .rg-article{padding:16px 15px}
  .rg-article .rd-p{font-size:15px;line-height:2}
}
/* ---- Unit reads (題組閱讀) ---- */
.ur-entry{display:block;width:100%;text-align:left;font:600 13.5px var(--sans);color:#3C7D72;background:#E4F1EE;border:1.5px dashed #A8CFC7;border-radius:12px;padding:11px 16px;margin-top:8px;cursor:pointer;transition:all .13s ease}
.ur-entry:hover{background:#D7EAE4;border-style:solid;transform:translateY(-1px)}
.ur-gram{font:600 12px var(--sans);color:#3C7D72;background:#E4F1EE;border:1px solid #C6E2DC;border-radius:9px;padding:7px 12px;margin:2px 0 12px;display:inline-block}
.ur-chat{display:flex;flex-direction:column;gap:9px;padding:6px 2px}
.ur-msg{display:flex;flex-direction:column;max-width:82%}
.ur-msg.left{align-self:flex-start}
.ur-msg.right{align-self:flex-end;align-items:flex-end}
.ur-sp{font:700 11px var(--sans);color:var(--muted);margin:0 6px 2px}
.ur-bubble{font:400 14.5px/1.65 var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px}
.ur-msg.right .ur-bubble{background:#E4F1EE;border-color:#C6E2DC;border-bottom-right-radius:4px}
.ur-msg.left .ur-bubble{border-bottom-left-radius:4px}
.ur-menu{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0}
.ur-menu-head{font:700 15px var(--serif);color:#fff;background:var(--teal);padding:9px 14px;text-align:center;letter-spacing:.03em}
.ur-menu-row{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px dashed var(--line);font:400 14px/1.55 var(--sans);color:var(--ink)}
.ur-menu-row:nth-child(even){background:var(--bg)}
.ur-menu-name b{font-weight:700;color:var(--navy)}
.ur-menu-note{display:block;font-size:12px;color:var(--muted)}
.ur-menu-price{font:700 14px var(--mono);color:#B0603F;white-space:nowrap}
.ur-menu-foot{font:italic 400 12.5px/1.6 var(--sans);color:var(--muted);background:#FFF7E8;padding:9px 14px}
/* ---- Listening exam (會考聽力) ---- */
.lx-view{max-width:720px}
.lx-part{display:inline-block;font:700 11px var(--sans);letter-spacing:.05em;color:#fff;background:var(--teal);border-radius:99px;padding:3px 12px;margin-bottom:4px}
.lx-prog{font:600 12px var(--mono);color:var(--muted);margin-left:8px}
.lx-playbox{display:flex;align-items:center;gap:14px;background:var(--paper);border:1.5px solid var(--teal-line);border-radius:16px;padding:16px 18px;margin:12px 0}
.lx-playbtn{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:99px;border:none;background:var(--teal);color:#fff;font:700 16px var(--sans);white-space:nowrap;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;flex-shrink:0}
.lx-playbtn:hover{transform:scale(1.07);box-shadow:0 4px 14px rgba(90,140,140,.35)}
.lx-hint{font:400 13px/1.6 var(--sans);color:var(--muted)}
.lx-script{font:400 13px/1.7 var(--sans);color:var(--body);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:9px 13px;margin-top:10px}
.lx-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 4px}
.lx-pic{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:20px 10px 16px;cursor:pointer;transition:all .12s ease}
.lx-pic:hover{border-color:var(--teal-line);background:var(--teal-bg);transform:translateY(-2px)}
.lx-pic.picked{border-color:var(--teal);background:var(--teal-bg)}
.lx-pic.right{border-color:var(--good);background:#EDF4EA}
.lx-pic.wrong{border-color:var(--bad);background:#FBEDE8}
.lx-pic .lx-emoji{font-size:42px;line-height:1.5;text-align:center}
.lx-pic .lx-let{font:700 14px var(--mono);color:var(--muted);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:3px 14px}

/* ---- ABC handwriting ---- */
@font-face{font-family:'Andika';src:url('fonts/VarelaRound-Regular.ttf') format('truetype');font-display:swap}
.andika{font-family:'Andika','Comic Sans MS',var(--sans)}
.abc-actions{margin:14px 0 4px}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:16px 0}
.abc-cell{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 8px 12px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.abc-cell:hover{transform:translateY(-2px);border-color:var(--teal-line);box-shadow:var(--shadow)}
.abc-cell-l{font-family:'Andika','Comic Sans MS',var(--sans);font-size:34px;font-weight:700;color:var(--navy);line-height:1}
.abc-cell-k{font:500 12px var(--sans);color:var(--muted)}
.abc-view .abc-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:6px 0 2px}
.abc-view .abc-head h1{font-family:'Andika','Comic Sans MS',var(--serif)}
.abc-kwbig{font:500 16px var(--sans);color:var(--body)}
.abc-kwbig b{color:var(--teal)}
.abc-stage{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0}
.abc-slot{flex:1 1 260px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.abc-lab{font:700 12px var(--sans);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.abc-hold{min-height:180px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.abc-canvas{width:100%;height:auto;max-height:280px}
.abc-canvas .gl{stroke:#E8DCC8;stroke-width:1.5}

.abc-canvas .gl.b{stroke:#C9B79E;stroke-width:2}
.abc-canvas .abc-ghost{fill:#ECE3D3}
.abc-canvas .abc-ink{fill:none;stroke:var(--navy);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.abc-canvas .abc-pen{fill:var(--teal);stroke:#fff;stroke-width:2;opacity:0}
.abc-canvas .abc-onum{opacity:0;transition:opacity .2s ease}
.abc-canvas .abc-arrow{fill:var(--teal)}
.abc-canvas .abc-numbg{fill:var(--teal)}
.abc-canvas .abc-numtx{fill:#fff;font:700 13px var(--sans)}
.abc-headinfo{display:flex;flex-direction:column;gap:4px}
.abc-phon{font:600 13px var(--mono);color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:2px 10px;align-self:flex-start}
.abc-phon b{font-weight:700}
.abc-hint{font:500 13px var(--sans);color:var(--muted);background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:10px;padding:8px 12px;margin:4px 0 10px}
.abc-slot-ctrls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.abc-slot-ctrls .btn{padding:7px 12px;font-size:13px}
.abc-altform{font:500 12.5px var(--sans);color:var(--body);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:6px 11px;margin-top:8px;text-align:center;line-height:1.5}
.abc-altform b{color:var(--navy)}
.abc-altglyph{display:inline-block;margin:0 5px}
.abc-ctrls{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.rd-card-lv{font:500 11px var(--sans);color:var(--faint);margin-top:5px}
.rd-note{font:400 12.5px/1.7 var(--sans);color:var(--muted);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
.rd-hero{display:flex;gap:14px;align-items:flex-start;margin:6px 0 4px}

.rd-lv-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
.rd-lv-tab{font:700 14px var(--sans);color:var(--body);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 18px;cursor:pointer;transition:all .12s ease;line-height:1.25}
.rd-lv-tab span{display:block;font:500 11px var(--sans);color:var(--muted)}
.rd-lv-tab:hover{border-color:var(--teal-line);background:var(--teal-bg)}

.rd-article{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 24px}

.rd-tools{display:flex;gap:9px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.rd-gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px 16px;background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:12px;padding:12px 14px;margin-top:12px}
.rd-gl{font:400 13px var(--sans);color:var(--body)}

.rd-opt:hover{border-color:var(--teal-line);background:var(--teal-bg)}
.rd-let{font:700 11px var(--mono);color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:5px;width:18px;height:18px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.rd-opt.picked{border-color:var(--teal);background:var(--teal-bg)}

.rd-why.no{background:#FBEDE8;color:#8C4B33;border:1px solid #F2D2C3}
.rd-cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}

.rd-score{font:700 17px var(--sans);color:var(--navy);background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:12px;padding:9px 18px}

/* ---- Resources ---- */
.res-hero{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.res-hero svg{animation:none}
.res-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}

.res-tab span{color:var(--muted);font-size:12px;margin-left:2px}
.res-tab:hover{border-color:var(--teal-line);background:var(--teal-bg)}
.res-tab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.res-tab.active span{color:#FCE9DC}
.res-nowarn{font:500 13px var(--sans);color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:8px 12px}

/* phonics word chips */
.ph-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ph-row:last-child{border-bottom:none}
.ph-sym-row{display:flex;align-items:center;gap:6px;min-width:130px}
.ph-sym{font:700 16px var(--mono);color:var(--teal);background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:8px;padding:3px 10px;white-space:nowrap}
.ph-play{display:flex;gap:4px}
.ph-words{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.ph-word{font:500 15px var(--sans);color:var(--navy);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;transition:all .1s ease}
.ph-word:hover{background:var(--teal);color:#fff;border-color:var(--teal);transform:translateY(-1px)}

.pos-badge.middle{background:#FBEEDC;color:#9A6B27;border:1px solid #F0DDBE}
.pos-badge.back{background:#FBE6DE;color:#B0603F;border:1px solid #F2D2C3}
.ph-legend{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;margin:6px 0 12px}
.ph-legend-h{font:700 12px var(--sans);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}

.ph-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.ph-filter-chip{font:600 13px var(--sans);color:var(--body);background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;transition:all .12s ease}
.ph-filter-chip:hover{border-color:var(--teal-line);background:var(--teal-bg)}
.ph-filter-chip.active{background:var(--teal);border-color:var(--teal);color:#fff}

.ph-filter-chip.active.middle{background:#9A6B27;border-color:#9A6B27}
.ph-filter-chip.active.back{background:#B0603F;border-color:#B0603F}
.ph-row.open{background:var(--teal-bg);border-radius:12px;padding-left:10px;padding-right:10px}
.ph-sym-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;padding:0;cursor:pointer}

/* phrasal / idiom cards */
.res-grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.flip{background:transparent;min-height:240px;cursor:pointer;perspective:1200px;-webkit-perspective:1200px}
.flip-inner{position:relative;width:100%;height:100%;min-height:240px;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);padding:16px;box-shadow:var(--shadow)}

.flip-word{font:700 20px var(--sans);color:var(--navy)}

.flip-back-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--line);font:700 15px var(--sans);color:var(--navy)}

.res-ex-zh{font:400 12.5px/1.5 var(--sans);color:var(--muted)}

.ws-extra ul{margin:5px 0 0 18px;padding:0}
.ws-extra li{font:400 12px/1.6 var(--sans);color:#5C4E40;margin-bottom:2px}
.ws-sec{margin-bottom:15px}
.ws-sec-h{font:700 14.5px var(--sans);color:#2E2620;border-bottom:1.5px solid #D8CCBC;padding-bottom:4px;margin-bottom:4px}
.ws-let{display:inline-grid;place-items:center;width:20px;height:20px;background:#2E2620;color:#fff;border-radius:5px;font:700 12px var(--sans);margin-right:4px;vertical-align:1px}
.ws-sec-zh{color:var(--teal);font-weight:600;font-size:13px}
.ws-instr{font:italic 500 11.5px var(--sans);color:#6E6155;margin-bottom:8px}
.ws-item{display:flex;gap:8px;margin-bottom:8px;break-inside:avoid}
.ws-n{font:700 12.5px var(--sans);color:#2E2620;min-width:22px;text-align:right}

.ws-opts{display:block;margin-top:3px;color:#4A4038}

.ws-line{display:block;border-bottom:1px solid #B9AC9B;height:20px;margin-top:4px}
.ws-foot{font:italic 400 10.5px var(--sans);color:#9A8C7C;border-top:1px solid var(--line);margin-top:18px;padding-top:8px}
.ws-keypage h3{font:700 13.5px var(--sans);color:#2E2620;margin:0 0 6px;border-bottom:1.5px solid #D8CCBC;padding-bottom:3px}
.ws-key-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-top:16px}
.ws-key-wide{grid-column:1 / -1}
.ws-key-list{margin:0 0 0 22px;padding:0;font:400 12.5px/1.7 var(--sans);color:#3A3229}

.ws-grades{margin-top:18px;border:1.5px solid #2E2620;border-radius:8px;padding:10px 14px}

/* ---- Cheatsheet ---- */
.cs-level{font:600 24px var(--serif);color:var(--navy);margin:30px 0 6px}
.cs-unit{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:18px 0 8px}
.cs-table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font:400 13.5px var(--sans);color:var(--body)}
.cs-table td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
.cs-n{font:600 12px var(--mono);color:var(--muted);white-space:nowrap;width:38px}
.cs-zh{color:var(--teal);font-size:12px}
.cs-form{font:500 12.5px var(--mono);color:var(--navy);width:30%}
.cs-ex b{color:var(--teal)}
@media print{
  .topbar,.no-print,#toast{display:none !important}
  body{background:#fff}
  .view{max-width:none;padding:0}
  .cs-table{font-size:11.5px}
  .cs-level{margin-top:14px}
}
/* ---- Listening ---- */
.listen-row{display:flex;align-items:center;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.btn-listen{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--teal);background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:99px;padding:7px 15px;cursor:pointer;transition:background .12s ease,transform .12s ease}
.btn-listen:hover{background:#FBE4D3;transform:translateY(-1px)}
.btn-listen:active{transform:translateY(0)}
.listen-note{font:400 12.5px var(--sans);color:var(--muted)}
.listen-big{display:flex;justify-content:center;margin:6px 0 20px}
.listen-big .btn-listen{font-size:15px;padding:12px 26px}
/* ---- Cat theme (Basic level) ---- */
.cat-hero{display:flex;align-items:center;gap:18px;background:#FFF9F0;border:1.5px solid #F3E3C8;border-radius:18px;padding:18px 22px;margin:18px 0 26px}
.cat-hero svg{flex-shrink:0}
.cat-bubble{position:relative;background:#fff;border:1.5px solid #F3E3C8;border-radius:14px;padding:12px 16px;font:500 14.5px var(--sans);color:var(--navy);line-height:1.55}
.cat-bubble:before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:#fff;border-left:1.5px solid #F3E3C8;border-bottom:1.5px solid #F3E3C8;transform:rotate(45deg)}
.cat-bubble .cb-name{display:block;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#C08A3E;margin-bottom:3px}
.cat-mini{display:inline-block;vertical-align:middle;margin-left:6px}
.tipbox.cat-tip{background:#FFF9F0;border-color:#F3E3C8}
.tipbox.cat-tip b{color:#8A6117}
@keyframes cat-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cat-hero svg{animation:cat-bounce 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.cat-hero svg{animation:none}}
.zh-term-lg{display:inline-block;font:500 15px var(--sans);color:var(--teal);background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:99px;padding:3px 13px;margin-left:12px;vertical-align:6px;white-space:nowrap}
.lr-go{margin-left:auto;color:var(--faint);font-size:16px}

/* ---------- lesson page ---------- */
.lesson-shell{display:grid;grid-template-columns:250px 1fr;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.lsb{border-right:1px solid var(--line);background:var(--bg);padding:22px 0}
.lsb-h{padding:0 22px 12px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lsb-item{display:flex;align-items:center;gap:10px;padding:10px 22px;font:400 13.5px var(--sans);color:var(--body);width:100%;text-align:left}
.lsb-item:hover{background:#F6EEE3}
.lsb-item.current{background:var(--paper);border-left:3px solid var(--teal);padding-left:19px;font-weight:600;color:var(--navy)}
.lsb-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:10px}
.lsb-dot.done{background:var(--teal);color:#fff}
.lsb-dot.open{border:2px solid var(--teal)}
.lsb-dot.todo{border:2px solid #DCC9B6}
.lsb-prog{margin:20px 22px 0;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.lmain{padding:34px 44px 44px;max-width:760px;min-width:0}
.formbox{background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:10px;padding:18px 22px;margin:0 0 28px}
.formbox .fb-l{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
.formbox .fb-p{font:500 18px/1.5 var(--mono);color:var(--navy)}
.formbox .fb-ex{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.formbox .fb-ex b{color:var(--teal);font-weight:600}
.use{margin-bottom:24px;padding-left:16px;border-left:3px solid var(--teal-line)}
.use h3{font:600 16.5px var(--sans);color:var(--navy);margin-bottom:4px}
.use .u-desc{font-size:14.5px;color:var(--body);margin-bottom:10px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:400 15px/1.55 var(--serif);color:var(--ink)}
.ex b{color:var(--teal);font-weight:600}
.ex .ex-note{display:block;font:400 12.5px var(--sans);color:var(--muted);margin-top:3px}
.timeline-card{background:#8A6A55;border-radius:10px;padding:20px 24px 16px;margin:0 0 28px;color:#F3E7DA}
.timeline-card .tc-l{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#E3C8AC;margin-bottom:16px}
.mistakes{margin:6px 0 28px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mk .no,.mk .yes{border-radius:8px;padding:10px 14px;font:400 14.5px/1.5 var(--serif)}
.mk .no{background:var(--bad-bg);border:1px solid var(--bad-line);color:#8F4630;text-decoration:line-through;text-decoration-color:rgba(186,95,72,.45);text-decoration-thickness:1.5px}
.mk .yes{background:var(--good-bg);border:1px solid var(--good-line);color:#4C6B45}
.mk-why{grid-column:1/-1;font:400 12.5px var(--sans);color:var(--muted);padding:0 4px}
.tipbox{display:flex;gap:12px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;padding:14px 18px;margin-bottom:30px;font-size:14px;color:#6B4E1A}
.lesson-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:22px;flex-wrap:wrap}
.crumb{font:500 13px var(--sans);color:var(--muted);margin-bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted)}
.crumb a:hover{color:var(--teal)}
.practice-sticky{display:none}

/* ---------- games hub ---------- */
.games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.game-card{padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.game-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(15,61,92,.10),0 14px 30px rgba(15,61,92,.10)}
.gc-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:21px}
.game-card h3{font:600 17px var(--sans);color:var(--navy)}
.game-card p{font-size:13px;color:var(--muted);flex:1}
.gc-best{font:600 12px var(--sans);color:var(--teal)}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 26px}
.chip{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);font:500 13px var(--sans);color:var(--body);background:var(--paper)}
.chip.active{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);font-weight:600}

/* ---------- quiz / play surface ---------- */
.play{max-width:680px;margin:0 auto}
.play-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.play-head .ph-title{font:600 15px var(--sans);color:var(--navy)}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qdot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.qdot.cur{background:var(--navy);transform:scale(1.25)}
.qdot.ok{background:var(--teal2)}
.qdot.bad{background:var(--bad)}
.qcard{padding:30px 34px;position:relative}
.qtype{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
.qprompt{font:500 21px/1.5 var(--serif);color:var(--navy);margin-bottom:22px}
.qprompt .blank{display:inline-block;min-width:86px;border-bottom:2.5px solid var(--teal2);margin:0 3px;text-align:center;color:var(--teal);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font:400 15.5px var(--sans);color:var(--ink);background:var(--paper);text-align:left;transition:border-color .12s ease,background .12s ease}
.opt:hover:not(:disabled){border-color:var(--teal2);background:var(--teal-bg)}
.opt .key{width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted);flex-shrink:0}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:.92}
.fill-row{display:flex;gap:10px}
.fill-input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font:500 16px var(--sans);color:var(--navy);background:var(--paper)}
.fill-input:focus{outline:none;border-color:var(--teal2);box-shadow:0 0 0 3px rgba(42,165,160,.15)}
.fill-input.ok{border-color:var(--good);background:var(--good-bg)}
.fill-input.bad{border-color:var(--bad);background:var(--bad-bg)}
.hint{font:400 13px var(--sans);color:var(--muted);margin-top:10px}
.bank,.built{display:flex;flex-wrap:wrap;gap:9px;min-height:52px}
.built{border:1.5px dashed var(--teal-line);background:var(--teal-bg);border-radius:10px;padding:10px;margin-bottom:14px}
.word{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 13px;font:500 15px var(--sans);color:var(--navy);box-shadow:0 1px 2px rgba(15,61,92,.06);transition:transform .1s ease}
.word:hover{transform:translateY(-1px);border-color:var(--teal2)}
.word:disabled{opacity:.28;cursor:default;transform:none}
.built .word{background:var(--paper);border-color:var(--teal-line)}
.spot-sent{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.spot-w{border-radius:7px;padding:6px 10px;font:500 17px var(--serif);color:var(--ink);border:1.5px solid transparent}
.spot-w:hover{background:var(--teal-bg);border-color:var(--teal-line)}
.spot-w.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.spot-w.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback{margin-top:20px;border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.55;display:flex;gap:11px;animation:fadeup .22s ease}
.feedback.good{background:var(--good-bg);border:1px solid var(--good-line);color:#4C6B45}
.feedback.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:#8F4630}
.play-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.timer-wrap{display:flex;align-items:center;gap:10px}
.timer-bar{width:130px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px}
.timer-fill.low{background:linear-gradient(90deg,#D97742,#B3402F)}
.timer-num{font:600 15px var(--mono);color:var(--navy);min-width:34px}
.combo{font:600 13px var(--sans);color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:999px;padding:4px 12px}

/* ---------- results ---------- */
.results{max-width:560px;margin:0 auto;text-align:center;padding:44px 34px}
.res-ring{width:132px;height:132px;margin:0 auto 20px;position:relative}
.res-ring svg{transform:rotate(-90deg)}
.res-ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:600 30px var(--serif);color:var(--navy)}
.res-stats{display:flex;justify-content:center;gap:26px;margin:18px 0 26px}
.res-stats div{text-align:center}
.res-stats .n{font:600 22px var(--serif);color:var(--navy)}
.res-stats .l{font:500 11.5px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res-cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;border-radius:10px;padding:12px 22px;font:600 14px var(--sans);box-shadow:0 8px 26px rgba(15,61,92,.35);z-index:99;opacity:0;transition:transform .3s ease,opacity .3s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero,.home-grid{grid-template-columns:1fr}
  .levels,.games-grid{grid-template-columns:1fr 1fr}
  .lesson-shell{grid-template-columns:1fr}
  .lsb{display:none}
  .lmain{padding:26px 22px 90px}
  .practice-sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));gap:12px;align-items:center;box-shadow:0 -6px 20px rgba(15,61,92,.08)}
  .practice-sticky .ps-txt{flex:1;font:500 13px var(--sans);color:var(--muted)}
  .nav{display:none}
  .hamburger{display:block}
  .nav.open{display:flex;position:absolute;top:56px;right:14px;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:170px}
  .topbar{position:relative}
  .topbar.stuck{position:sticky}
}
@media (max-width:560px){
  .wrap{padding:22px 16px 90px}
  .levels,.games-grid,.stat-strip{grid-template-columns:1fr}
  h1.display{font-size:29px}
  .qcard{padding:22px 18px}
  .qprompt{font-size:18px}
  .mk{grid-template-columns:1fr}
  .xp-pill{display:none}
}

uses:[
 {t:"Describing people and things", d:"Use be to say who or what someone is, or what something is like.", ex:[
   {s:"My brother <b>is</b> a nurse.", n:"is + job"},
   {s:"The soup <b>is</b> delicious.", n:"is + adjective"},
   {s:"We <b>are</b> classmates.", n:"are + noun"}]},
 {t:"Saying where people are", d:"Be also tells us location — no other verb is needed.", ex:[
   {s:"Dad <b>is</b> in the kitchen.", n:""},
   {s:"The keys <b>are</b> on the table.", n:""},
   {s:"I <b>am</b> at the bus stop.", n:""}]},
 {t:"Negatives and questions", d:"Make negatives with not. Make questions by moving be before the subject.", ex:[
   {s:"He <b>is not</b> (isn't) ready.", n:"be + not"},
   {s:"<b>Are</b> you hungry?", n:"be moves to the front"},
   {s:"<b>Is</b> the museum open today?", n:""}]}
],
mistakes:[
 {no:"She is teacher.", yes:"She is a teacher.", why:"Singular jobs need a or an."},
 {no:"They is my friends.", yes:"They are my friends.", why:"They, we and you always take are."},
 {no:"I be happy.", yes:"I am happy.", why:"Be changes form: am, is, are."}
],
tip:"Match the verb to the subject: I → am · he / she / it → is · we / you / they → are.",
q:[
 {t:"mcq", q:"My sister ___ a doctor.", opts:["am","is","are","be"], a:1, why:"My sister = she, so we use is."},
 {t:"mcq", q:"The children ___ in the garden.", opts:["is","am","are","be"], a:2, why:"The children = they, so we use are."},
 {t:"fill", q:"I ___ very tired today.", ans:["am","'m"], hint:"I + ?", why:"I always takes am."},
 {t:"fill", q:"___ you ready to go?", ans:["are"], hint:"Question with you", why:"Questions put are before you."},
 {t:"order", words:["The","keys","are","on","the","table"], sent:"The keys are on the table", why:"Subject + are + place."},
 {t:"spot", sent:"He are my best friend .", wrong:1, fix:"is", why:"He takes is, not are."},
 {t:"mcq", q:"Which sentence is correct?", opts:["Is they at school?","Are they at school?","Am they at school?","Be they at school?"], a:1, why:"They takes are; questions start with the verb."},
 {t:"spot", sent:"My parents is very kind .", wrong:2, fix:"are", why:"My parents = they → are."}
]},

{
id:"pronouns", zh:"人稱代名詞", unit:"u1", n:"1.2", title:"Subject & Object Pronouns", sub:"I, you, he, she — and me, him, her: who does the action, and who receives it.",
form:{p:"subject pronoun + verb + object pronoun", ex:["<b>She</b> likes <b>him</b>.","<b>They</b> helped <b>us</b>.","<b>I</b> found <b>it</b>."]},
uses:[
 {t:"Subject pronouns — before the verb", d:"I, you, he, she, it, we, they do the action.", ex:[
   {s:"<b>He</b> plays basketball every day.", n:"he = the doer"},
   {s:"<b>We</b> live in Tainan.", n:""},
   {s:"<b>It</b> is raining again.", n:"it for things and weather"}]},
 {t:"Object pronouns — after the verb or a preposition", d:"Me, you, him, her, it, us, them receive the action.", ex:[
   {s:"Mom called <b>me</b> last night.", n:"after the verb"},
   {s:"I sat next to <b>her</b>.", n:"after a preposition"},
   {s:"The teacher praised <b>them</b>.", n:""}]},
 {t:"Replacing nouns to avoid repeating", d:"Once we know who or what, a pronoun keeps the sentence light.", ex:[
   {s:"Ben is my cousin. <b>He</b> is twelve.", n:"Ben → he"},
   {s:"I bought a cake and ate <b>it</b>.", n:"the cake → it"},
   {s:"Anna and I are busy — don't wait for <b>us</b>.", n:"Anna and I → us"}]}
],
mistakes:[
 {no:"Me and Tom went home.", yes:"Tom and I went home.", why:"Subjects use I — and name yourself last."},
 {no:"I saw she at the mall.", yes:"I saw her at the mall.", why:"After the verb, use the object form her."},
 {no:"Between you and I, the test was hard.", yes:"Between you and me, the test was hard.", why:"After a preposition, use me."}
],
tip:"Before the verb → subject form (I, he, she). After the verb or a preposition → object form (me, him, her).",
q:[
 {t:"mcq", q:"___ is my best friend.", opts:["Him","Us","She","Them"], a:2, why:"Before the verb we need a subject pronoun."},
 {t:"mcq", q:"The teacher asked ___ a question.", opts:["I","he","she","me"], a:3, why:"After the verb, use the object form me."},
 {t:"fill", q:"Lisa is kind. Everyone likes ___ .", ans:["her"], hint:"object form of she", why:"After likes → her."},
 {t:"fill", q:"My parents are away, so ___ am home alone.", ans:["I"], hint:"the subject of am", why:"The subject of am is always I."},
 {t:"order", words:["We","visited","them","last","weekend"], sent:"We visited them last weekend", why:"Subject we + verb + object them."},
 {t:"spot", sent:"Him is the new student in our class .", wrong:0, fix:"He", why:"The subject position needs He."},
 {t:"mcq", q:"Anna and ___ are in the same class.", opts:["me","I","her","us"], a:1, why:"Part of the subject → I."},
 {t:"spot", sent:"I made a sandwich and ate him .", wrong:6, fix:"it", why:"A sandwich is a thing → it."}
]},

{
id:"present-simple", zh:"現在簡單式", unit:"u1", n:"1.3", title:"Present Simple", sub:"Habits, routines, facts and things that are generally true.",
tl:{labels:[[8,"past"],[50,"now"],[92,"future"]], dots:[14,32,50,68,86], now:50, cap:"Repeated actions across time — every day, every week, always."},
form:{p:"subject + verb(+s)  ·  he / she / it adds -s", ex:["I <b>work</b> at night.","She <b>works</b> at night.","He <b>doesn't work</b> on Sundays."]},
uses:[
 {t:"Habits and routines", d:"Things you do regularly — often with every day, usually, on Mondays.", ex:[
   {s:"I <b>drink</b> tea every morning.", n:""},
   {s:"She <b>takes</b> the MRT to work.", n:"she → verb + s"},
   {s:"We <b>visit</b> my grandparents on weekends.", n:""}]},
 {t:"Facts and general truths", d:"Use it for things that are always or generally true.", ex:[
   {s:"Water <b>boils</b> at 100°C.", n:""},
   {s:"The store <b>opens</b> at nine.", n:"schedules count as facts"},
   {s:"Cats <b>sleep</b> most of the day.", n:""}]},
 {t:"Negatives and questions with do / does", d:"Use do or does as a helper — and the main verb goes back to its base form.", ex:[
   {s:"I <b>don't eat</b> breakfast.", n:""},
   {s:"She <b>doesn't like</b> coffee.", n:"doesn't + like, not likes"},
   {s:"<b>Does</b> he <b>play</b> the piano?", n:""}]}
],
mistakes:[
 {no:"He play basketball on Fridays.", yes:"He plays basketball on Fridays.", why:"He / she / it needs verb + s."},
 {no:"She doesn't likes tea.", yes:"She doesn't like tea.", why:"After doesn't, use the base verb."},
 {no:"Do she work here?", yes:"Does she work here?", why:"She takes does in questions."}
],
tip:"The -s moves, it never doubles: she works → she doesn't work → does she work?",
q:[
 {t:"mcq", q:"My father ___ in a bank.", opts:["work","works","working","is work"], a:1, why:"My father = he → verb + s."},
 {t:"mcq", q:"___ your sister like spicy food?", opts:["Do","Is","Does","Are"], a:2, why:"Your sister = she → does."},
 {t:"fill", q:"Water ___ at 100 degrees Celsius. (boil)", ans:["boils"], hint:"Fact about water (it)", why:"Water = it → boils."},
 {t:"fill", q:"He ___ eat meat. (negative)", ans:["doesn't","does not"], hint:"he + negative helper", why:"He → doesn't + base verb."},
 {t:"order", words:["She","usually","walks","to","school"], sent:"She usually walks to school", why:"Frequency adverbs go before the main verb."},
 {t:"spot", sent:"My brother watch TV every night .", wrong:2, fix:"watches", why:"My brother = he → watches."},
 {t:"spot", sent:"Does she plays tennis on Saturdays ?", wrong:2, fix:"play", why:"After does, the verb returns to its base form."},
 {t:"mcq", q:"Which sentence is correct?", opts:["I doesn't know the answer.","He don't know the answer.","They doesn't know the answer.","She doesn't know the answer."], a:3, why:"She + doesn't + base verb is the correct pattern."}
]},

{
id:"present-continuous", zh:"現在進行式", unit:"u1", n:"1.4", title:"Present Continuous", sub:"Be + V-ing — actions happening right now, or temporarily around now.",
tl:{labels:[[8,"past"],[50,"now"],[92,"future"]], dots:[44,50,56], now:50, cap:"An action in progress at this moment — it has started and hasn't finished."},
form:{p:"subject + am / is / are + V-ing", ex:["I <b>am studying</b> right now.","She <b>is cooking</b> dinner.","They <b>aren't listening</b>."]},
uses:[
 {t:"Happening right now", d:"The action is in progress as you speak.", ex:[
   {s:"Shh — the baby <b>is sleeping</b>.", n:"at this moment"},
   {s:"Look! It <b>is raining</b>.", n:""},
   {s:"I <b>am waiting</b> for the bus.", n:""}]},
 {t:"Temporary situations around now", d:"Not necessarily this second — but not forever either.", ex:[
   {s:"She <b>is staying</b> with her aunt this month.", n:"temporary"},
   {s:"We <b>are learning</b> the guitar this semester.", n:""},
   {s:"He <b>is working</b> in Taichung these days.", n:""}]},
 {t:"Questions and negatives", d:"Move be before the subject for questions; add not for negatives.", ex:[
   {s:"<b>Are</b> you <b>listening</b> to me?", n:""},
   {s:"I<b>'m not joking</b> — it's true.", n:""},
   {s:"What <b>is</b> she <b>doing</b>?", n:""}]}
],
mistakes:[
 {no:"I am study English now.", yes:"I am studying English now.", why:"After be, the verb needs -ing."},
 {no:"She cooking dinner.", yes:"She is cooking dinner.", why:"Don't drop be — am / is / are is required."},
 {no:"I am knowing the answer.", yes:"I know the answer.", why:"State verbs like know, like, want don't take -ing."}
],
tip:"Two parts, always: be (am / is / are) + V-ing. If one part is missing, the sentence is broken.",
q:[
 {t:"mcq", q:"Look! The dog ___ in the river.", opts:["swims","is swimming","swim","swimming"], a:1, why:"Happening right now → is + V-ing."},
 {t:"fill", q:"Please be quiet. I ___ (try) to study.", ans:["am trying","'m trying"], hint:"am + V-ing", why:"Right now → am trying."},
 {t:"mcq", q:"She ___ TV at the moment.", opts:["watch","watches","is watching","watching"], a:2, why:"At the moment → present continuous."},
 {t:"spot", sent:"They is playing badminton in the gym .", wrong:1, fix:"are", why:"They → are."},
 {t:"order", words:["My","mom","is","making","dumplings","now"], sent:"My mom is making dumplings now", why:"Subject + is + V-ing."},
 {t:"fill", q:"What are you ___ (do) right now?", ans:["doing"], hint:"V-ing", why:"Questions still need the -ing form."},
 {t:"mcq", q:"Which is correct?", opts:["I am wanting bubble tea.","I want bubble tea.","I wanting bubble tea.","I am want bubble tea."], a:1, why:"Want is a state verb — no -ing."},
 {t:"spot", sent:"He is watch a movie with his sister .", wrong:2, fix:"watching", why:"After be, the verb takes -ing."}
]},

{
id:"adverbs-frequency", zh:"頻率副詞", unit:"u1", n:"1.5", title:"Adverbs of Frequency", sub:"Always, usually, often, sometimes, rarely, never — saying how often.",
form:{p:"subject + adverb + verb   ·   subject + be + adverb", ex:["I <b>always</b> walk to work.","She is <b>never</b> late.","We <b>sometimes</b> eat out."]},
uses:[
 {t:"The frequency scale", d:"These adverbs sit on a scale from 100% down to 0%.", ex:[
   {s:"<b>always</b> (100%) → <b>usually</b> → <b>often</b> → <b>sometimes</b> → <b>rarely</b> → <b>never</b> (0%)", n:"learn them as a ladder"},
   {s:"He <b>usually</b> gets up at six.", n:"about 80–90% of the time"},
   {s:"They <b>rarely</b> eat fast food.", n:"almost never"}]},
 {t:"Position: before the main verb", d:"With normal verbs, the adverb goes just before the verb.", ex:[
   {s:"I <b>often</b> forget my umbrella.", n:""},
   {s:"She <b>never</b> drinks coffee after noon.", n:""}]},
 {t:"Position: after be", d:"With am / is / are, the adverb comes after the verb instead.", ex:[
   {s:"He is <b>always</b> cheerful.", n:"be + adverb"},
   {s:"The trains are <b>usually</b> on time.", n:""},
   {s:"I am <b>never</b> bored in this class.", n:""}]}
],
mistakes:[
 {no:"She always is happy.", yes:"She is always happy.", why:"With be, the adverb comes after the verb."},
 {no:"I go never to the gym.", yes:"I never go to the gym.", why:"With other verbs, the adverb goes before."},
 {no:"He doesn't never help.", yes:"He never helps.", why:"Never is already negative — no double negatives."}
],
tip:"Remember: BEfore ordinary verbs, but AFTER be. Two positions, one rule each.",
q:[
 {t:"mcq", q:"She ___ late for class. (always)", opts:["always is","is always","always be","be always"], a:1, why:"Adverbs of frequency follow the verb be."},
 {t:"mcq", q:"Which is the strongest?", opts:["sometimes","often","usually","always"], a:3, why:"Always means 100% of the time."},
 {t:"order", words:["I","usually","have","toast","for","breakfast"], sent:"I usually have toast for breakfast", why:"Adverb before the main verb have."},
 {t:"order", words:["They","are","never","at","home","on","Sundays"], sent:"They are never at home on Sundays", why:"Adverb after are."},
 {t:"spot", sent:"He drinks always tea in the morning .", wrong:2, fix:"always drinks", why:"The adverb goes before the verb: always drinks."},
 {t:"fill", q:"The opposite of always is ___.", ans:["never"], hint:"0% of the time", why:"Never = 0%."},
 {t:"mcq", q:"We ___ eat out — maybe once a month.", opts:["always","never","rarely","usually"], a:2, why:"Once a month is rare, so rarely fits."},
 {t:"spot", sent:"I am late usually on Mondays .", wrong:3, fix:"usually late", why:"After be: am usually late."}
]},

{
id:"plural-nouns", zh:"單數與複數名詞", unit:"u2", n:"2.1", title:"Singular & Plural Nouns", sub:"Adding -s, -es and -ies — plus the irregulars everyone must memorize.",
form:{p:"noun + s / es / ies   ·   irregular: man → men", ex:["one book → two <b>books</b>","one box → two <b>boxes</b>","one city → two <b>cities</b>"]},
uses:[
 {t:"The regular rules", d:"Most nouns just add -s. The spelling changes depend on the ending.", ex:[
   {s:"cat → <b>cats</b> · table → <b>tables</b>", n:"most nouns: + s"},
   {s:"bus → <b>buses</b> · watch → <b>watches</b> · dish → <b>dishes</b>", n:"-s, -ch, -sh, -x: + es"},
   {s:"baby → <b>babies</b> · country → <b>countries</b>", n:"consonant + y: y → ies"}]},
 {t:"Common irregular plurals", d:"A small set of very common nouns change completely.", ex:[
   {s:"man → <b>men</b> · woman → <b>women</b> · child → <b>children</b>", n:""},
   {s:"foot → <b>feet</b> · tooth → <b>teeth</b> · person → <b>people</b>", n:""},
   {s:"sheep → <b>sheep</b> · fish → <b>fish</b>", n:"some never change"}]},
 {t:"Agreement with verbs", d:"Plural subjects take plural verbs — no -s on the verb.", ex:[
   {s:"The <b>children play</b> outside.", n:"plural noun + base verb"},
   {s:"My <b>feet hurt</b> after the hike.", n:""}]}
],
mistakes:[
 {no:"I have two childs.", yes:"I have two children.", why:"Child has an irregular plural."},
 {no:"She bought three tomatos.", yes:"She bought three tomatoes.", why:"Most -o nouns add -es: tomatoes, potatoes."},
 {no:"There are many peoples here.", yes:"There are many people here.", why:"People is already plural."}
],
tip:"If a noun ends in a hissing sound (s, sh, ch, x), you can't just add -s — say buses aloud and you'll hear why it needs -es.",
q:[
 {t:"mcq", q:"What is the plural of city?", opts:["citys","cityes","cities","city"], a:2, why:"Consonant + y → change y to ies."},
 {t:"mcq", q:"What is the plural of child?", opts:["childs","children","childes","childrens"], a:1, why:"Child → children is irregular."},
 {t:"fill", q:"One box, two ___.", ans:["boxes"], hint:"-x ending", why:"Nouns ending in -x add -es."},
 {t:"fill", q:"One tooth, two ___.", ans:["teeth"], hint:"Irregular, like foot → feet", why:"Tooth → teeth."},
 {t:"spot", sent:"There are three womans in the office .", wrong:3, fix:"women", why:"Woman → women is irregular."},
 {t:"mcq", q:"Which plural is wrong?", opts:["watches","buses","sheeps","dishes"], a:2, why:"Sheep stays the same: one sheep, two sheep."},
 {t:"order", words:["The","children","are","playing","in","the","park"], sent:"The children are playing in the park", why:"Children is plural, so it takes are."},
 {t:"spot", sent:"My foots hurt after the long walk .", wrong:1, fix:"feet", why:"Foot → feet."}
]},

{
id:"this-that", zh:"指示代名詞", unit:"u2", n:"2.2", title:"This, That, These & Those", sub:"Pointing words — near or far, one or many.",
form:{p:"this / that + singular   ·   these / those + plural", ex:["<b>This</b> phone is mine.","<b>That</b> mountain is Yushan.","<b>Those</b> shoes look new."]},
uses:[
 {t:"Near you: this and these", d:"Things close to you — one takes this, many take these.", ex:[
   {s:"<b>This</b> seat is free — sit here.", n:"near + singular"},
   {s:"<b>These</b> cookies are still warm.", n:"near + plural"},
   {s:"I love <b>this</b> song!", n:""}]},
 {t:"Far from you: that and those", d:"Things farther away — one takes that, many take those.", ex:[
   {s:"<b>That</b> building across the street is a library.", n:"far + singular"},
   {s:"<b>Those</b> birds on the wire are sparrows.", n:"far + plural"},
   {s:"Can you see <b>that</b> star?", n:""}]},
 {t:"Phones, time and ideas", d:"We also point at moments and things we just mentioned.", ex:[
   {s:"Hello? Who is <b>this</b>?", n:"on the phone"},
   {s:"<b>That</b> was a great movie!", n:"pointing back at something finished"},
   {s:"Rainy Mondays — I hate <b>that</b>.", n:"that = the whole idea"}]}
],
mistakes:[
 {no:"This shoes are too small.", yes:"These shoes are too small.", why:"Plural shoes → these."},
 {no:"I want that apples over there.", yes:"I want those apples over there.", why:"Plural + far → those."},
 {no:"These is my desk.", yes:"This is my desk.", why:"One desk → this + is."}
],
tip:"Near = this / these · Far = that / those. One = this / that · Many = these / those.",
q:[
 {t:"mcq", q:"___ books here are mine.", opts:["This","That","These","Those"], a:2, why:"Near + plural → these."},
 {t:"mcq", q:"Look at ___ clouds far away.", opts:["this","these","that","those"], a:3, why:"Far + plural → those."},
 {t:"fill", q:"___ is my classroom — come in!", ans:["this"], hint:"near, one", why:"Near + singular → this."},
 {t:"spot", sent:"Those bag over there is heavy .", wrong:0, fix:"That", why:"One bag → that."},
 {t:"order", words:["These","dumplings","are","delicious"], sent:"These dumplings are delicious", why:"Near + plural → these + are."},
 {t:"mcq", q:"On the phone: \u201cHi, ___ is Kevin.\u201d", opts:["these","this","those","that"], a:1, why:"On the phone, introduce yourself with this."},
 {t:"fill", q:"I didn't like ___ movie we saw last week.", ans:["that"], hint:"far in time", why:"Finished and far away in time → that."},
 {t:"spot", sent:"This apples taste sweet .", wrong:0, fix:"These", why:"Plural apples → these."}
]},

{
id:"articles", zh:"冠詞 a / an / the", unit:"u2", n:"2.3", title:"Articles: A, An, The", sub:"Choosing between a, an, the — or nothing at all.",
form:{p:"a / an + new or general (singular)   ·   the + specific or known", ex:["I saw <b>a</b> dog. <b>The</b> dog was friendly.","She is <b>an</b> engineer.","I love <b>—</b> music. (no article)"]},
uses:[
 {t:"A and an: something new or general", d:"Use a before consonant sounds and an before vowel sounds — it's about the sound, not the letter.", ex:[
   {s:"She wants <b>a</b> bicycle.", n:"any bicycle, not a specific one"},
   {s:"He ate <b>an</b> apple and <b>a</b> banana.", n:""},
   {s:"It took <b>an</b> hour.", n:"hour starts with a vowel sound"}]},
 {t:"The: something both people know", d:"Use the when the listener knows exactly which one you mean — or when there is only one.", ex:[
   {s:"Please close <b>the</b> door.", n:"we both know which door"},
   {s:"I saw a movie. <b>The</b> movie was long.", n:"second mention"},
   {s:"<b>The</b> sun rises in <b>the</b> east.", n:"only one exists"}]},
 {t:"No article: plurals and ideas in general", d:"Drop the article for plural or uncountable nouns used generally, and for most names.", ex:[
   {s:"<b>—</b> Dogs are loyal.", n:"dogs in general"},
   {s:"I don't drink <b>—</b> coffee.", n:"uncountable, general"},
   {s:"She lives in <b>—</b> Taipei.", n:"cities take no article"}]}
],
mistakes:[
 {no:"He is engineer.", yes:"He is an engineer.", why:"Singular jobs need a or an."},
 {no:"I waited for a hour.", yes:"I waited for an hour.", why:"Hour begins with a vowel sound."},
 {no:"The life is beautiful.", yes:"Life is beautiful.", why:"Abstract ideas in general take no article."}
],
tip:"Listen, don't look: a university (yoo-), an hour (ow-). The sound after the article decides a or an.",
q:[
 {t:"mcq", q:"She is ___ honest person.", opts:["a","an","the","—"], a:1, why:"Honest starts with a vowel sound (the h is silent)."},
 {t:"mcq", q:"I bought a shirt and a hat. ___ shirt was expensive.", opts:["A","An","The","—"], a:2, why:"Second mention → the."},
 {t:"fill", q:"It's ___ university with a long history.", ans:["a"], hint:"Listen to the first sound of university", why:"University starts with a 'yoo' consonant sound → a."},
 {t:"mcq", q:"___ moon looks beautiful tonight.", opts:["A","An","The","—"], a:2, why:"There is only one moon → the."},
 {t:"spot", sent:"My uncle is doctor in Kaohsiung .", wrong:3, fix:"a doctor", why:"Singular job nouns need a."},
 {t:"mcq", q:"Which sentence is correct?", opts:["I love the music.","I love music.","I love a music.","I love an music."], a:1, why:"Music in general is uncountable — no article."},
 {t:"order", words:["The","dog","in","the","garden","is","mine"], sent:"The dog in the garden is mine", why:"Specific dog, specific garden → the."},
 {t:"spot", sent:"We waited for a hour at the station .", wrong:3, fix:"an hour", why:"Hour begins with a vowel sound."}
]},

{
id:"much-many", zh:"可數與不可數 much / many", unit:"u2", n:"2.4", title:"Much, Many & A Lot Of", sub:"Counting things you can count — and measuring things you can't.",
form:{p:"many + countable   ·   much + uncountable   ·   a lot of + both", ex:["How <b>many</b> eggs?","How <b>much</b> water?","<b>A lot of</b> people came."]},
uses:[
 {t:"Many with countable plurals", d:"If you can count them one by one, use many.", ex:[
   {s:"How <b>many</b> students are in your class?", n:""},
   {s:"There aren't <b>many</b> buses at night.", n:""},
   {s:"She has <b>many</b> hobbies.", n:""}]},
 {t:"Much with uncountables", d:"Water, time, money, rice — no counting, so use much.", ex:[
   {s:"How <b>much</b> time do we have?", n:""},
   {s:"There isn't <b>much</b> milk left.", n:"much loves questions and negatives"},
   {s:"He doesn't drink <b>much</b> coffee.", n:""}]},
 {t:"A lot of works anywhere", d:"Countable or uncountable, positive or negative — always safe.", ex:[
   {s:"We ate <b>a lot of</b> noodles.", n:""},
   {s:"There is <b>a lot of</b> homework today.", n:""},
   {s:"<b>A lot of</b> tourists visit Jiufen.", n:"most natural in positive sentences"}]}
],
mistakes:[
 {no:"How much books do you have?", yes:"How many books do you have?", why:"Books are countable → many."},
 {no:"There are much people here.", yes:"There are a lot of people here.", why:"People is countable; much doesn't fit."},
 {no:"I have many homeworks.", yes:"I have a lot of homework.", why:"Homework is uncountable — no s, no many."}
],
tip:"Can you count it one by one? Yes → many. No → much. Positive sentence or not sure? A lot of is always safe.",
q:[
 {t:"mcq", q:"How ___ sugar do you want?", opts:["many","much","a lot","lots"], a:1, why:"Sugar is uncountable → much."},
 {t:"mcq", q:"There aren't ___ chairs in the room.", opts:["much","many","a lot","some"], a:1, why:"Chairs are countable → many."},
 {t:"fill", q:"We don't have ___ time — hurry!", ans:["much"], hint:"time = uncountable", why:"Uncountable + negative → much."},
 {t:"spot", sent:"She drinks much water every day .", wrong:2, fix:"a lot of", why:"In positive sentences, a lot of sounds natural."},
 {t:"order", words:["How","many","brothers","do","you","have"], sent:"How many brothers do you have", why:"Countable brothers → how many."},
 {t:"mcq", q:"Which is correct?", opts:["much apples","many rice","a lot of friends","many money"], a:2, why:"A lot of works with countables like friends."},
 {t:"fill", q:"How ___ people are coming to the party?", ans:["many"], hint:"people = countable", why:"People are countable → many."},
 {t:"spot", sent:"I don't have many money with me .", wrong:3, fix:"much", why:"Money is uncountable → much."}
]},

{
id:"there-is-are", zh:"There be 句型", unit:"u2", n:"2.5", title:"There Is / There Are", sub:"Saying that something exists — the natural way to describe places.",
form:{p:"There is + singular   ·   There are + plural", ex:["<b>There is</b> a café nearby.","<b>There are</b> two banks on this street.","<b>Is there</b> a problem?"]},
uses:[
 {t:"Introducing things that exist", d:"Use there is / there are to mention something for the first time.", ex:[
   {s:"<b>There is</b> a park near my house.", n:"singular → is"},
   {s:"<b>There are</b> thirty students in the class.", n:"plural → are"},
   {s:"<b>There is</b> some milk in the fridge.", n:"uncountable → is"}]},
 {t:"Negatives with no / any", d:"Make negatives with isn't / aren't, usually followed by any.", ex:[
   {s:"<b>There isn't</b> any sugar left.", n:""},
   {s:"<b>There aren't</b> any seats on this train.", n:""},
   {s:"<b>There's no</b> reason to worry.", n:"there's no = there isn't any"}]},
 {t:"Questions and short answers", d:"Move is / are before there to ask questions.", ex:[
   {s:"<b>Is there</b> a pharmacy near here? — Yes, <b>there is</b>.", n:""},
   {s:"<b>Are there</b> any questions? — No, <b>there aren't</b>.", n:""}]}
],
mistakes:[
 {no:"There is many restaurants here.", yes:"There are many restaurants here.", why:"Plural noun → there are."},
 {no:"There are a lot of traffic.", yes:"There is a lot of traffic.", why:"Traffic is uncountable → there is."},
 {no:"Have a park near my home.", yes:"There is a park near my home.", why:"English uses there is, not have, for existence."}
],
tip:"Look at the noun after the verb — it decides everything. A / one thing → is; two or more → are; stuff you can't count → is.",
q:[
 {t:"mcq", q:"___ a good bakery on this street.", opts:["There are","There is","It is","Is"], a:1, why:"A bakery is singular → there is."},
 {t:"mcq", q:"___ any eggs in the fridge?", opts:["Is there","There is","Are there","There are"], a:2, why:"Eggs is plural, question form → are there."},
 {t:"fill", q:"There ___ a lot of people at the night market.", ans:["are"], hint:"People is plural", why:"People is plural → are."},
 {t:"fill", q:"There ___ some water in the bottle.", ans:["is"], hint:"Water is uncountable", why:"Uncountable nouns take is."},
 {t:"order", words:["There","are","two","cats","under","the","bed"], sent:"There are two cats under the bed", why:"Plural noun → there are."},
 {t:"spot", sent:"There is five chairs in the room .", wrong:1, fix:"are", why:"Five chairs is plural → there are."},
 {t:"mcq", q:"Which sentence is correct?", opts:["There isn't any buses today.","There aren't any buses today.","There not any buses today.","There isn't no buses today."], a:1, why:"Buses is plural → aren't any."},
 {t:"spot", sent:"Is there any restaurants open now ?", wrong:0, fix:"Are", why:"Restaurants is plural → are there."}
]},

{
id:"wh-questions", zh:"疑問詞問句", unit:"u7", n:"3.1", title:"Wh- Questions", sub:"Who, what, when, where, why, how — asking for real information.",
form:{p:"Wh-word + do / does / did (or be) + subject + verb", ex:["<b>Where</b> do you live?","<b>What</b> is that?","<b>Why</b> did she leave?"]},
uses:[
 {t:"What each word asks about", d:"Each wh-word hunts for a different kind of answer.", ex:[
   {s:"<b>Who</b> is your teacher?", n:"person"},
   {s:"<b>Where</b> is the restroom?", n:"place"},
   {s:"<b>When</b> does the movie start?", n:"time"}]},
 {t:"Building with do / does / did", d:"For most verbs, a helper comes after the wh-word.", ex:[
   {s:"<b>What</b> do you eat for breakfast?", n:""},
   {s:"<b>Why</b> does he look tired?", n:"does for he / she / it"},
   {s:"<b>Where</b> did they go last summer?", n:"did → verb goes back to base form"}]},
 {t:"How, alone or with a friend", d:"How pairs with adjectives for size, age, price and more.", ex:[
   {s:"<b>How</b> do you go to school?", n:"method"},
   {s:"<b>How old</b> is your grandma?", n:""},
   {s:"<b>How much</b> does it cost?", n:"price"}]}
],
mistakes:[
 {no:"Where you live?", yes:"Where do you live?", why:"Wh-questions need do / does / did (or be)."},
 {no:"What does she likes?", yes:"What does she like?", why:"After does, the verb goes back to base form."},
 {no:"Why you are sad?", yes:"Why are you sad?", why:"Be moves before the subject."}
],
tip:"Question order is fixed: Wh-word → helper (do / does / did / be) → subject → verb.",
q:[
 {t:"mcq", q:"___ is your birthday? — In May.", opts:["Who","When","Where","Why"], a:1, why:"The answer is a time → when."},
 {t:"mcq", q:"___ did you call? — My cousin.", opts:["What","Where","Who","How"], a:2, why:"The answer is a person → who."},
 {t:"fill", q:"___ does this bag cost? — Five hundred dollars.", ans:["How much"], hint:"asking a price", why:"Price → how much."},
 {t:"spot", sent:"Where does she lives now ?", wrong:3, fix:"live", why:"After does → base form."},
 {t:"order", words:["When","does","the","train","leave"], sent:"When does the train leave", why:"Wh-word + does + subject + base verb."},
 {t:"mcq", q:"Which question is correct?", opts:["Why you did cry?","Why did you cry?","Why did you cried?","Why you cried?"], a:1, why:"Wh-word + did + subject + base verb."},
 {t:"fill", q:"___ do you spell your name?", ans:["how"], hint:"asking about the way", why:"Method → how."},
 {t:"spot", sent:"What time does he goes to bed ?", wrong:4, fix:"go", why:"Does already carries the -s — the verb stays base."}
]},

{
id:"imperatives", zh:"祈使句", unit:"u7", n:"3.2", title:"Imperatives", sub:"Sit down. Don't worry. Let's go! — commands, instructions and invitations.",
form:{p:"Base verb …   ·   Don't + base verb   ·   Let's + base verb", ex:["<b>Open</b> your book.","<b>Don't run</b> in the hallway.","<b>Let's take</b> a break."]},
uses:[
 {t:"Commands and instructions", d:"Start with the verb — no subject needed. You is understood.", ex:[
   {s:"<b>Turn</b> left at the corner.", n:"directions"},
   {s:"<b>Mix</b> the eggs and sugar.", n:"recipes"},
   {s:"<b>Be</b> quiet, please.", n:"be works too"}]},
 {t:"Negatives with don't", d:"Don't + base verb tells someone what NOT to do.", ex:[
   {s:"<b>Don't touch</b> the wet paint.", n:""},
   {s:"<b>Don't be</b> late tomorrow.", n:""},
   {s:"<b>Don't forget</b> your umbrella.", n:""}]},
 {t:"Let's for suggestions, please for politeness", d:"Let's includes yourself; please softens any command.", ex:[
   {s:"<b>Let's order</b> pizza tonight.", n:"= you and me together"},
   {s:"<b>Please wait</b> here a moment.", n:""},
   {s:"<b>Let's not argue</b> about it.", n:"negative of let's"}]}
],
mistakes:[
 {no:"You open the window.", yes:"Open the window.", why:"Imperatives drop the subject you."},
 {no:"Don't to be afraid.", yes:"Don't be afraid.", why:"After don't, use the base verb — no to."},
 {no:"Let's goes home.", yes:"Let's go home.", why:"Let's + base form."}
],
tip:"Start with the verb. Negative? Just put Don't in front. Including yourself? Start with Let's.",
q:[
 {t:"mcq", q:"___ your homework before dinner.", opts:["Does","Do","Doing","To do"], a:1, why:"Imperative → base verb do."},
 {t:"mcq", q:"___ noisy — the baby is sleeping!", opts:["Don't","Not","Don't be","Be not"], a:2, why:"Negative with an adjective → don't be."},
 {t:"fill", q:"Please ___ (turn) off your phone during the movie.", ans:["turn"], hint:"base verb", why:"Imperatives use the base form."},
 {t:"spot", sent:"Let's watching a movie tonight .", wrong:1, fix:"watch", why:"Let's + base verb."},
 {t:"order", words:["Don't","eat","in","the","library"], sent:"Don't eat in the library", why:"Don't + base verb + place."},
 {t:"mcq", q:"Which is a polite request?", opts:["Give me water.","You give me water.","Please give me some water.","Giving me water."], a:2, why:"Please + imperative is polite."},
 {t:"fill", q:"___ worry — everything will be fine.", ans:["don't"], hint:"negative imperative", why:"Don't + base verb worry."},
 {t:"spot", sent:"Turns off the light when you leave .", wrong:0, fix:"Turn", why:"Imperatives never take -s."}
]},

{
id:"conjunctions", zh:"連接詞 and / but / so / because", unit:"u7", n:"3.3", title:"And, But, So & Because", sub:"Four little words that join ideas — adding, contrasting, resulting and explaining.",
form:{p:"idea 1 + and / but / so / because + idea 2", ex:["I was tired, <b>so</b> I slept.","She sings <b>and</b> dances.","He stayed home <b>because</b> he was sick."]},
uses:[
 {t:"And adds, but contrasts", d:"And joins similar ideas; but signals a surprise or opposite.", ex:[
   {s:"I like tea <b>and</b> coffee.", n:"plus"},
   {s:"The room is small <b>but</b> cozy.", n:"opposite"},
   {s:"She studied hard, <b>but</b> she failed.", n:"surprising result"}]},
 {t:"So gives the result", d:"Cause first, then so, then what happened because of it.", ex:[
   {s:"It was raining, <b>so</b> we took a taxi.", n:"cause → so → result"},
   {s:"I forgot my wallet, <b>so</b> I couldn't pay.", n:""},
   {s:"The test is tomorrow, <b>so</b> let's review tonight.", n:""}]},
 {t:"Because gives the reason", d:"Because answers why — it introduces the cause.", ex:[
   {s:"We stayed inside <b>because</b> it was too hot.", n:"result ← because ← reason"},
   {s:"<b>Because</b> he practiced daily, he improved fast.", n:"because can start the sentence"},
   {s:"I'm happy <b>because</b> you're here.", n:""}]}
],
mistakes:[
 {no:"I was hungry so because I ate.", yes:"I was hungry, so I ate.", why:"Pick one connector, not two."},
 {no:"Because I was tired.", yes:"I went to bed early because I was tired.", why:"Because needs a main sentence — it can't stand alone."},
 {no:"He was sick, but he went to the doctor.", yes:"He was sick, so he went to the doctor.", why:"Seeing the doctor is the result of being sick → so."}
],
tip:"and = plus · but = opposite · so = result · because = reason.",
q:[
 {t:"mcq", q:"I wanted to call you, ___ my phone died.", opts:["and","but","so","because"], a:1, why:"An obstacle — the opposite of the plan → but."},
 {t:"mcq", q:"She was thirsty, ___ she drank some water.", opts:["but","because","so","and"], a:2, why:"Drinking is the result → so."},
 {t:"fill", q:"We wear coats ___ it is cold.", ans:["because"], hint:"gives the reason", why:"The cold is the reason → because."},
 {t:"spot", sent:"I studied hard , because I passed the test .", wrong:4, fix:"so", why:"Passing is the result → so."},
 {t:"order", words:["I","like","tea","but","I","don't","like","coffee"], sent:"I like tea but I don't like coffee", why:"Contrast between the two likes → but."},
 {t:"mcq", q:"Which sentence is correct?", opts:["Because was raining, we stayed home.","We stayed home because it was raining.","We stayed home so because it was raining.","We stayed home because so it was raining."], a:1, why:"Because + full clause, one connector only."},
 {t:"fill", q:"He speaks English ___ Japanese.", ans:["and"], hint:"simply adding", why:"Adding a second language → and."},
 {t:"spot", sent:"The soup was hot , and I waited for it to cool .", wrong:4, fix:"so", why:"Waiting is the result of the heat → so."}
]},

{
id:"prepositions", zh:"介系詞 in / on / at", unit:"u7", n:"3.4", title:"Prepositions: In, On, At", sub:"The three little words for time and place — and how to pick the right one.",
form:{p:"at + point   ·   on + surface / day   ·   in + space / period", ex:["<b>at</b> 7:00 · <b>at</b> the door","<b>on</b> Monday · <b>on</b> the table","<b>in</b> July · <b>in</b> the box"]},
uses:[
 {t:"Time: at → on → in", d:"At for clock times, on for days and dates, in for longer periods.", ex:[
   {s:"The class starts <b>at</b> nine.", n:"at + clock time"},
   {s:"We have a quiz <b>on</b> Friday.", n:"on + days and dates"},
   {s:"She was born <b>in</b> 2012.", n:"in + months, years, seasons"}]},
 {t:"Place: point, surface, space", d:"At a point, on a surface, in an enclosed space.", ex:[
   {s:"Someone is <b>at</b> the door.", n:"at + a point"},
   {s:"Your keys are <b>on</b> the desk.", n:"on + a surface"},
   {s:"The milk is <b>in</b> the fridge.", n:"in + inside a space"}]},
 {t:"Set phrases to memorize", d:"Some combinations are fixed — learn them as chunks.", ex:[
   {s:"<b>at</b> night · <b>at</b> noon · <b>at</b> home", n:""},
