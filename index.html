   {s:"<b>on</b> the bus · <b>on</b> TV · <b>on</b> the weekend", n:""},
   {s:"<b>in</b> the morning · <b>in</b> bed · <b>in</b> line", n:""}]}
],
mistakes:[
 {no:"See you in Monday.", yes:"See you on Monday.", why:"Days take on."},
 {no:"He gets up at the morning.", yes:"He gets up in the morning.", why:"Parts of the day take in — except at night."},
 {no:"She is on home now.", yes:"She is at home now.", why:"Set phrase: at home."}
],
tip:"Zoom out: at a point (7:00, the door) → on a surface or day (Monday, the table) → in a big space or period (July, Taipei, the box).",
q:[
 {t:"mcq", q:"My birthday is ___ October.", opts:["at","on","in","to"], a:2, why:"Months take in."},
 {t:"mcq", q:"Let's meet ___ 6:30.", opts:["in","on","at","by"], a:2, why:"Clock times take at."},
 {t:"fill", q:"The cat is sleeping ___ the sofa.", ans:["on"], hint:"a surface", why:"Surfaces take on."},
 {t:"spot", sent:"We have English class in Tuesday .", wrong:4, fix:"on", why:"Days take on."},
 {t:"order", words:["The","bank","opens","at","nine","in","the","morning"], sent:"The bank opens at nine in the morning", why:"At + clock time, in + the morning."},
 {t:"mcq", q:"Which is correct?", opts:["I watched it in TV.","I watched it on TV.","I watched it at TV.","I watched it to TV."], a:1, why:"Set phrase: on TV."},
 {t:"fill", q:"He was born ___ May 5th.", ans:["on"], hint:"a full date", why:"Full dates take on."},
 {t:"spot", sent:"She studies at the library on the evening .", wrong:5, fix:"in", why:"Parts of the day take in."}
]},

/* ================= INTERMEDIATE ================= */

{
id:"past-simple", zh:"過去簡單式", unit:"u3", n:"4.1", title:"Past Simple", sub:"Finished actions at a finished time — yesterday, last week, in 2019.",
tl:{labels:[[26,"finished action"],[62,"now"]], dots:[26], now:62, cap:"One completed action, fully in the past — the moment is closed."},
form:{p:"subject + verb-ed  ·  irregular: go → went", ex:["I <b>visited</b> Tainan last month.","She <b>went</b> home early.","They <b>didn't see</b> the sign."]},
uses:[
 {t:"Completed past actions", d:"The action started and finished in the past, often with a time expression.", ex:[
   {s:"We <b>watched</b> a movie last night.", n:"regular: watch + ed"},
   {s:"He <b>bought</b> a new phone yesterday.", n:"irregular: buy → bought"},
   {s:"I <b>lived</b> in Japan for three years.", n:"a finished period"}]},
 {t:"Stories and sequences", d:"Past simple carries the main events of a story, one after another.", ex:[
   {s:"She <b>opened</b> the door, <b>saw</b> the cake and <b>smiled</b>.", n:""},
   {s:"First we <b>packed</b>, then we <b>left</b> for the airport.", n:""}]},
 {t:"Negatives and questions with did", d:"Did is the past helper — and the main verb goes back to base form.", ex:[
   {s:"I <b>didn't hear</b> the alarm.", n:"didn't + base verb"},
   {s:"<b>Did</b> you <b>enjoy</b> the concert?", n:""},
   {s:"Where <b>did</b> they <b>go</b>?", n:""}]}
],
mistakes:[
 {no:"I didn't went to the party.", yes:"I didn't go to the party.", why:"After didn't, use the base verb."},
 {no:"Did you saw the news?", yes:"Did you see the news?", why:"Did already shows past — see stays base."},
 {no:"She buyed a dress.", yes:"She bought a dress.", why:"Buy is irregular: buy → bought."}
],
tip:"Past appears once per clause: either in the verb (went) or in did — never both.",
q:[
 {t:"mcq", q:"They ___ to Hualien last weekend.", opts:["go","goes","went","gone"], a:2, why:"Last weekend → past simple; go → went."},
 {t:"mcq", q:"___ you finish your homework?", opts:["Do","Did","Does","Were"], a:1, why:"Past question → did."},
 {t:"fill", q:"She ___ (eat) breakfast at seven this morning.", ans:["ate"], hint:"Irregular verb", why:"Eat → ate."},
 {t:"fill", q:"We ___ (not / watch) TV last night.", ans:["didn't watch","did not watch"], hint:"negative helper + base verb", why:"Didn't + watch (base form)."},
 {t:"order", words:["He","bought","a","gift","for","his","mother"], sent:"He bought a gift for his mother", why:"Subject + past verb + object."},
 {t:"spot", sent:"I didn't saw the message yesterday .", wrong:2, fix:"see", why:"After didn't, the verb returns to base form."},
 {t:"spot", sent:"She teached English for ten years .", wrong:1, fix:"taught", why:"Teach is irregular: teach → taught."},
 {t:"mcq", q:"Which sentence is correct?", opts:["Where you went last night?","Where did you went last night?","Where did you go last night?","Where you did go last night?"], a:2, why:"Question: where + did + subject + base verb."}
]},

{
id:"present-perfect", zh:"現在完成式", unit:"u3", n:"4.2", title:"Present Perfect Simple", sub:"Connecting the past with now — experiences, changes and results that still matter.",
tl:{labels:[[12,"past"],[64,"now"]], spans:[[12,64]], dots:[64], now:64, cap:"An action or experience in an open period that reaches up to now."},
form:{p:"subject + have / has + past participle", ex:["I <b>have finished</b> the report.","She <b>has visited</b> Kyoto twice.","They <b>haven't arrived</b> yet."]},
uses:[
 {t:"Life experience — time not stated", d:"Use it for things you have (or haven't) done in your life, when the exact time doesn't matter.", ex:[
   {s:"I <b>have tried</b> stinky tofu once.", n:"when? not important"},
   {s:"She <b>has never flown</b> in a helicopter.", n:""},
   {s:"<b>Have</b> you ever <b>been</b> to Green Island?", n:"ever = at any time in your life"}]},
 {t:"Results that matter now", d:"A past action with a present result — the focus is on now.", ex:[
   {s:"I <b>have lost</b> my keys. (= I can't get in now)", n:""},
   {s:"He <b>has broken</b> his leg. (= it's still broken)", n:""},
   {s:"The train <b>has just left</b>. (= we missed it)", n:"just = a moment ago"}]},
 {t:"Unfinished time with for / since", d:"For a situation that started in the past and continues to now.", ex:[
   {s:"We <b>have lived</b> here <b>for</b> ten years.", n:"for + a length of time"},
   {s:"She <b>has worked</b> there <b>since</b> 2020.", n:"since + a starting point"}]}
],
mistakes:[
 {no:"I have seen that movie yesterday.", yes:"I saw that movie yesterday.", why:"A finished time (yesterday) needs past simple."},
 {no:"She has went home.", yes:"She has gone home.", why:"Use the past participle: go → gone."},
 {no:"I live here since 2019.", yes:"I have lived here since 2019.", why:"Since + continuing situation → present perfect."}
],
tip:"Ask: is the time period closed (yesterday, last year) or open (today, this week, my life so far)? Closed → past simple. Open → present perfect.",
q:[
 {t:"mcq", q:"I ___ my homework, so I can relax now.", opts:["finish","finished","have finished","am finishing"], a:2, why:"Past action with a present result → present perfect."},
 {t:"mcq", q:"She has lived in Taichung ___ 2018.", opts:["for","since","during","from"], a:1, why:"Since + a starting point in time."},
 {t:"fill", q:"Have you ever ___ (eat) sushi?", ans:["eaten"], hint:"Past participle of eat", why:"Experience question: have + ever + eaten."},
 {t:"fill", q:"He has ___ (break) his arm — it's in a cast.", ans:["broken"], hint:"Past participle of break", why:"Break → broke → broken."},
 {t:"order", words:["We","have","known","each","other","for","years"], sent:"We have known each other for years", why:"Have + participle + for + duration."},
 {t:"spot", sent:"I have visited Tokyo last summer .", wrong:2, fix:"visited (drop have)", why:"Last summer is finished time → past simple: I visited."},
 {t:"spot", sent:"She has wrote three emails today .", wrong:2, fix:"written", why:"Write → written after has."},
 {t:"mcq", q:"Which sentence is correct?", opts:["I have saw that film.","Did you ever been to Japan?","She has just arrived.","They has finished lunch."], a:2, why:"Has + just + past participle is correct."}
]},

{
id:"past-perfect", zh:"過去完成式", unit:"u3", n:"4.3", title:"Past Perfect", sub:"Had + past participle — the past before the past.",
tl:{labels:[[8,"earlier past"],[50,"past"],[92,"now"]], dots:[8,50], now:92, cap:"Two past events — the earlier one takes had + past participle."},
form:{p:"subject + had + past participle", ex:["The train <b>had left</b> when I arrived.","She <b>had never seen</b> snow before that trip.","They<b>'d finished</b> dinner by eight."]},
uses:[
 {t:"The earlier of two past actions", d:"When two things happened in the past, past perfect marks the first one.", ex:[
   {s:"When we got to the cinema, the movie <b>had</b> already <b>started</b>.", n:"it started before we arrived"},
   {s:"He couldn't pay because he <b>had lost</b> his wallet.", n:""},
   {s:"By the time she called, I <b>had gone</b> to bed.", n:"by the time is a strong signal"}]},
 {t:"Experience before a past moment", d:"Like present perfect, but measured from a point in the past.", ex:[
   {s:"Before 2020, I <b>had never used</b> a smartphone.", n:""},
   {s:"It was the best meal she <b>had ever eaten</b>.", n:""},
   {s:"They <b>had met</b> once before the party.", n:""}]},
 {t:"Background and reasons in stories", d:"Past perfect explains how things got that way.", ex:[
   {s:"The ground was wet — it <b>had rained</b> all night.", n:""},
   {s:"I recognized him because we <b>had worked</b> together.", n:""},
   {s:"She was tired; she <b>hadn't slept</b> well.", n:""}]}
],
mistakes:[
 {no:"When I arrived, the train left.", yes:"When I arrived, the train had left.", why:"If the train left first, the earlier action needs past perfect."},
 {no:"She had went home.", yes:"She had gone home.", why:"Had + past participle: go → gone."},
 {no:"I had seen him yesterday.", yes:"I saw him yesterday.", why:"One single past event → past simple is enough."}
],
tip:"Only use past perfect when two past times are in play — it marks the earlier one. Just one event? Past simple.",
q:[
 {t:"mcq", q:"The bus ___ by the time we reached the stop.", opts:["left","had left","has left","leaves"], a:1, why:"By the time → the earlier action takes past perfect."},
 {t:"fill", q:"I couldn't open the door because I ___ (forget) my keys.", ans:["had forgotten","'d forgotten"], hint:"had + past participle", why:"Forgetting happened first → had forgotten."},
 {t:"mcq", q:"She was nervous because she ___ a speech before.", opts:["never gave","has never given","had never given","never given"], a:2, why:"Experience before a past moment → had never given."},
 {t:"spot", sent:"After they had ate lunch , they went for a walk .", wrong:3, fix:"eaten", why:"Had + past participle: eat → eaten."},
 {t:"order", words:["The","movie","had","started","before","we","arrived"], sent:"The movie had started before we arrived", why:"The earlier action takes had + started."},
 {t:"mcq", q:"Which is correct?", opts:["I had visited Japan last year.","I visited Japan last year.","I had visit Japan last year.","I have visited Japan last year."], a:1, why:"One finished event with a past time → past simple."},
 {t:"fill", q:"By 10 p.m., everyone ___ (go) home.", ans:["had gone"], hint:"by + past time", why:"Finished before that past point → had gone."},
 {t:"spot", sent:"When I called , she already had finish her homework .", wrong:7, fix:"finished", why:"Had + past participle: finished."}
]},

{
id:"going-to-will", zh:"未來式 be going to / will", unit:"u4", n:"5.1", title:"Future: Going To vs Will", sub:"Two futures with different jobs — plans and evidence vs promises and snap decisions.",
tl:{labels:[[30,"now"],[74,"future"]], dots:[74], now:30, cap:"Both point forward — the difference is when you decided."},
form:{p:"be going to + verb   ·   will + verb", ex:["I<b>'m going to visit</b> my aunt on Sunday.","I<b>'ll help</b> you with those bags.","It<b>'s going to rain</b> — look at the sky."]},
uses:[
 {t:"Going to: plans and intentions", d:"You decided before speaking — the plan already exists.", ex:[
   {s:"We<b>'re going to travel</b> to Kenting in July.", n:"already planned"},
   {s:"She<b>'s going to study</b> abroad next year.", n:""}]},
 {t:"Going to: predictions from evidence", d:"You can see or feel the cause right now.", ex:[
   {s:"Look at those clouds — it<b>'s going to pour</b>.", n:"visible evidence"},
   {s:"Careful! You<b>'re going to drop</b> that.", n:""}]},
 {t:"Will: decisions, offers and promises", d:"You decide at the moment of speaking — or you promise, offer or predict from opinion.", ex:[
   {s:"The phone's ringing — I<b>'ll get</b> it.", n:"instant decision"},
   {s:"I<b>'ll always remember</b> this trip.", n:"promise"},
   {s:"I think our team <b>will win</b>.", n:"opinion, no evidence"}]}
],
mistakes:[
 {no:"I will to call you tonight.", yes:"I will call you tonight.", why:"Will is followed by the base verb — no to."},
 {no:"She going to move next month.", yes:"She is going to move next month.", why:"Don't drop be: is / am / are going to."},
 {no:"Look out! You will hit that pole!", yes:"Look out! You're going to hit that pole!", why:"Visible evidence → going to."}
],
tip:"Decided before speaking → going to. Deciding as you speak → will. Menus are the classic test: \"I'll have the pasta.\"",
q:[
 {t:"mcq", q:"A: We have no milk. B: Really? I ___ some on my way home.", opts:["am going to buy","will buy","buy","bought"], a:1, why:"A decision made right now → will."},
 {t:"mcq", q:"Look at that long queue — we ___ for ages.", opts:["will wait","are going to wait","wait","waited"], a:1, why:"Prediction from evidence you can see → going to."},
 {t:"fill", q:"Don't worry, I ___ tell anyone your secret. (negative)", ans:["won't","will not"], hint:"A promise", why:"Promises use will → won't."},
 {t:"fill", q:"They ___ going to get married in spring.", ans:["are","'re"], hint:"Don't drop be", why:"They + are going to."},
 {t:"order", words:["She","is","going","to","start","a","new","job"], sent:"She is going to start a new job", why:"Be + going to + base verb."},
 {t:"spot", sent:"I will to see the dentist tomorrow .", wrong:2, fix:"see (no to)", why:"Will + base verb, never will to."},
 {t:"mcq", q:"Which shows a plan decided earlier?", opts:["I'll answer the door.","I'm going to repaint my room this weekend.","I think it'll be fine.","I'll have the fish, please."], a:1, why:"Repainting this weekend is a pre-made plan → going to."},
 {t:"spot", sent:"He is going buy a scooter next month .", wrong:2, fix:"going to buy", why:"Going to needs to before the verb."}
]},

{
id:"future-continuous-perfect", zh:"未來進行式與未來完成式", unit:"u4", n:"5.2", title:"Future Continuous & Perfect", sub:"Will be doing and will have done — painting a more precise future.",
form:{p:"will be + V-ing   ·   will have + past participle", ex:["This time tomorrow, I <b>will be flying</b>.","By June, she <b>will have graduated</b>.","We<b>'ll be waiting</b> for you."]},
uses:[
 {t:"Future continuous: in progress at a future time", d:"The action will be happening around that moment.", ex:[
   {s:"At 8 p.m. tonight, we <b>will be having</b> dinner.", n:""},
   {s:"Don't call at noon — I<b>'ll be driving</b>.", n:""},
   {s:"This time next week, they <b>will be lying</b> on a beach.", n:""}]},
 {t:"Future perfect: finished before a future point", d:"Look back from a future deadline — the action will already be done.", ex:[
   {s:"By 2030, the city <b>will have built</b> the new MRT line.", n:"by + future time"},
   {s:"She <b>will have finished</b> the report before the meeting.", n:""},
   {s:"I <b>will have saved</b> enough by December.", n:""}]},
 {t:"Polite questions about plans", d:"Will you be doing…? sounds softer than will you do…?", ex:[
   {s:"<b>Will</b> you <b>be using</b> the printer this afternoon?", n:"just asking, not requesting"},
   {s:"<b>Will</b> he <b>be joining</b> us for lunch?", n:""},
   {s:"How long <b>will</b> you <b>have been</b> here by Friday?", n:""}]}
],
mistakes:[
 {no:"By next year, I will finish the course.", yes:"By next year, I will have finished the course.", why:"By + future point → future perfect."},
 {no:"I will be finish soon.", yes:"I will be finishing soon.", why:"Will be + V-ing."},
 {no:"She will have went home by then.", yes:"She will have gone home by then.", why:"Will have + past participle: gone."}
],
tip:"See by + a future time? That's the classic signal for will have + past participle.",
q:[
 {t:"mcq", q:"This time tomorrow, we ___ over the Pacific.", opts:["will fly","will be flying","will have flown","fly"], a:1, why:"In progress at that future moment → will be flying."},
 {t:"fill", q:"By Friday, I ___ (finish) all my exams.", ans:["will have finished","'ll have finished"], hint:"by + future time", why:"Done before Friday → will have finished."},
 {t:"mcq", q:"Don't visit at 9 — she ___ her online class.", opts:["will have","will be having","has","will having"], a:1, why:"In progress at 9 → will be having."},
 {t:"spot", sent:"By 2030 , he will have wrote three novels .", wrong:6, fix:"written", why:"Will have + past participle: written."},
 {t:"order", words:["She","will","be","working","late","tonight"], sent:"She will be working late tonight", why:"Will be + V-ing."},
 {t:"mcq", q:"Which is correct?", opts:["By June, they will have moved house.","By June, they will moving house.","By June, they will have move house.","By June, they moved house."], a:0, why:"By + future → will have + past participle."},
 {t:"fill", q:"At midnight, most people ___ (sleep).", ans:["will be sleeping"], hint:"in progress then", why:"In progress at midnight → will be sleeping."},
 {t:"spot", sent:"We will had eaten before the show starts .", wrong:2, fix:"have", why:"After will, have never changes."}
]},

{
id:"zero-conditional", zh:"零條件句", unit:"u4", n:"5.3", title:"Zero Conditional", sub:"If + present, present — facts, habits and things that are always true.",
form:{p:"If + present simple , … present simple", ex:["If you <b>heat</b> ice, it <b>melts</b>.","If I <b>drink</b> coffee at night, I <b>can't sleep</b>.","Plants <b>die</b> if they <b>get</b> no water."]},
uses:[
 {t:"Scientific and general truths", d:"Whenever the condition happens, the result always follows.", ex:[
   {s:"If you <b>mix</b> blue and yellow, you <b>get</b> green.", n:""},
   {s:"Water <b>boils</b> if it <b>reaches</b> 100°C.", n:"the if-part can come second"},
   {s:"If the power <b>goes</b> out, the fridge <b>stops</b>.", n:""}]},
 {t:"Personal habits and routines", d:"Your own always-true patterns work the same way.", ex:[
   {s:"If it <b>rains</b>, I <b>take</b> the bus.", n:""},
   {s:"If I <b>have</b> free time, I <b>read</b> manga.", n:""},
   {s:"She <b>gets</b> grumpy if she <b>skips</b> breakfast.", n:""}]},
 {t:"Instructions with imperatives", d:"If + present, then a command — very common in real life.", ex:[
   {s:"If the alarm <b>rings</b>, <b>leave</b> the building.", n:""},
   {s:"<b>Press</b> restart if the screen <b>freezes</b>.", n:""},
   {s:"If you <b>see</b> smoke, <b>call</b> 119.", n:""}]}
],
mistakes:[
 {no:"If you will heat ice, it melts.", yes:"If you heat ice, it melts.", why:"No will in the if-part."},
 {no:"If she eats seafood, she will always get a rash.", yes:"If she eats seafood, she gets a rash.", why:"Always true → present + present."},
 {no:"If you heated ice, it melts.", yes:"If you heat ice, it melts.", why:"Zero conditional stays in the present."}
],
tip:"Both halves stay in present simple. Swap if for when — if the meaning barely changes, it's a zero conditional.",
q:[
 {t:"mcq", q:"If you ___ water, it turns to steam.", opts:["boil","will boil","boiled","boils"], a:0, why:"You + present simple → boil."},
 {t:"fill", q:"If I ___ (eat) too much, I feel sleepy.", ans:["eat"], hint:"present simple", why:"General habit → present simple eat."},
 {t:"mcq", q:"Ice ___ if you leave it in the sun.", opts:["melt","melts","will melted","melting"], a:1, why:"Ice = it → melts."},
 {t:"spot", sent:"If it rain , the game stops .", wrong:2, fix:"rains", why:"It → rains."},
 {t:"order", words:["If","it","snows","the","school","closes"], sent:"If it snows the school closes", why:"If + present, present."},
 {t:"mcq", q:"Which is a zero conditional?", opts:["If you heat metal, it expands.","If it rains, we'll cancel.","If I were you, I'd rest.","If she had studied, she'd have passed."], a:0, why:"Always true, present + present → zero conditional."},
 {t:"fill", q:"If you don't water plants, they ___ (die).", ans:["die"], hint:"present simple", why:"General truth → die."},
 {t:"spot", sent:"My eyes hurts if I read in the dark .", wrong:2, fix:"hurt", why:"Eyes = they → hurt."}
]},

{
id:"first-conditional", zh:"第一條件句", unit:"u4", n:"5.4", title:"First Conditional", sub:"Real future possibilities — if this happens, that will happen.",
form:{p:"If + present simple, … will + verb", ex:["<b>If</b> it <b>rains</b>, we<b>'ll stay</b> home.","You<b>'ll miss</b> the bus <b>if</b> you <b>don't hurry</b>.","<b>If</b> she <b>calls</b>, I<b>'ll tell</b> you."]},
uses:[
 {t:"Real possibilities in the future", d:"Use it when the condition is realistic and quite possible.", ex:[
   {s:"<b>If</b> you <b>study</b> tonight, you<b>'ll pass</b> the quiz.", n:"present in the if-part, will in the result"},
   {s:"<b>If</b> the weather <b>is</b> nice, we<b>'ll have</b> a picnic.", n:""},
   {s:"I<b>'ll be</b> surprised <b>if</b> he <b>arrives</b> on time.", n:"either half can come first"}]},
 {t:"Warnings, promises and offers", d:"First conditional is the natural shape of everyday deals and warnings.", ex:[
   {s:"<b>If</b> you <b>touch</b> that pan, you<b>'ll burn</b> yourself.", n:"warning"},
   {s:"<b>If</b> you <b>help</b> me move, I<b>'ll buy</b> you dinner.", n:"deal"}]},
 {t:"Unless, and other result verbs", d:"Unless means if … not. The result can also use can, might or an imperative.", ex:[
   {s:"We<b>'ll be</b> late <b>unless</b> we <b>leave</b> now.", n:"unless = if we don't leave"},
   {s:"<b>If</b> you <b>finish</b> early, you <b>can go</b> home.", n:""},
   {s:"<b>If</b> anyone <b>asks</b>, <b>say</b> nothing.", n:"imperative result"}]}
],
mistakes:[
 {no:"If it will rain, we'll cancel.", yes:"If it rains, we'll cancel.", why:"No will in the if-clause — present simple only."},
 {no:"If you'll study, you pass.", yes:"If you study, you'll pass.", why:"Will belongs in the result clause."},
 {no:"Unless you don't hurry, we'll be late.", yes:"Unless you hurry, we'll be late.", why:"Unless already contains the negative."}
],
tip:"The if-clause describes the condition in plain present; the will lives only in the result. Swapping the halves is fine — just add a comma when if comes first.",
q:[
 {t:"mcq", q:"If she ___ hard, she'll get the scholarship.", opts:["will work","works","worked","working"], a:1, why:"If-clause takes present simple."},
 {t:"mcq", q:"If you heat ice, it ___.", opts:["will melts","melts will","will melt","melted"], a:2, why:"Result clause → will + base verb."},
 {t:"fill", q:"You'll feel better if you ___ some rest. (get)", ans:["get"], hint:"If-clause: present simple", why:"If + present simple: get."},
 {t:"fill", q:"If we miss the train, we ___ a taxi. (take)", ans:["will take","'ll take"], hint:"Result → will", why:"Result clause: will take."},
 {t:"order", words:["If","it","rains","we","will","cancel","the","picnic"], sent:"If it rains we will cancel the picnic", why:"If + present, will + base verb."},
 {t:"spot", sent:"If he will call , I'll let you know .", wrong:2, fix:"calls", why:"No will inside the if-clause."},
 {t:"mcq", q:"___ you water this plant, it will die.", opts:["If","When","Unless","Because"], a:2, why:"Unless = if you don't water it."},
 {t:"spot", sent:"If you study hard , you pass the exam .", wrong:5, fix:"will pass", why:"The result of a first conditional needs will."}
]},

{
id:"comparatives-superlatives", zh:"比較級與最高級", unit:"u8", n:"6.1", title:"Comparatives & Superlatives", sub:"Taller, more expensive, the best — comparing two things or picking the extreme.",
form:{p:"adj-er + than   ·   the + adj-est   ·   more / the most + long adj", ex:["Taipei 101 is <b>taller than</b> our building.","It's <b>the tallest</b> building in Taiwan.","This phone is <b>more expensive</b>."]},
uses:[
 {t:"Comparing two things", d:"Short adjectives add -er; long ones (2+ syllables) take more. Don't forget than.", ex:[
   {s:"My bag is <b>lighter than</b> yours.", n:"short adj + er"},
   {s:"The test was <b>more difficult than</b> I expected.", n:"long adj → more"},
   {s:"Winter here is <b>drier than</b> summer.", n:"y → ier"}]},
 {t:"Superlatives: the extreme of a group", d:"Use the + -est or the most when comparing three or more.", ex:[
   {s:"She is <b>the fastest</b> runner on the team.", n:""},
   {s:"That was <b>the most interesting</b> talk of the day.", n:""},
   {s:"It's <b>the best</b> beef noodle soup in the city.", n:"good → the best"}]},
 {t:"Irregulars and equality", d:"A few adjectives change completely; use as … as to say two things are equal.", ex:[
   {s:"good → <b>better</b> → <b>the best</b> · bad → <b>worse</b> → <b>the worst</b>", n:""},
   {s:"far → <b>farther / further</b> → <b>the farthest</b>", n:""},
   {s:"This café is <b>as good as</b> the famous one.", n:"as + adj + as"}]}
],
mistakes:[
 {no:"This one is more cheaper.", yes:"This one is cheaper.", why:"Never combine more with -er."},
 {no:"She is taller then me.", yes:"She is taller than me.", why:"Comparisons use than, not then."},
 {no:"It's the goodest option.", yes:"It's the best option.", why:"Good is irregular: good → better → best."}
],
tip:"One syllable → -er / -est. Three or more → more / most. Two syllables? If it ends in -y (happy), use -ier; otherwise usually more.",
q:[
 {t:"mcq", q:"This road is ___ than the highway.", opts:["narrow","narrower","more narrow","narrowest"], a:1, why:"Short adjective + er + than."},
 {t:"mcq", q:"It was ___ movie I've ever seen.", opts:["the most boring","the boringest","more boring","most boring"], a:0, why:"Superlative of a long adjective → the most."},
 {t:"fill", q:"My grades are ___ (good) than last semester.", ans:["better"], hint:"Irregular", why:"Good → better."},
 {t:"fill", q:"August is the ___ (hot) month of the year.", ans:["hottest"], hint:"Double the final consonant", why:"Hot → hottest (double t)."},
 {t:"order", words:["She","is","the","smartest","student","in","our","class"], sent:"She is the smartest student in our class", why:"The + superlative + group."},
 {t:"spot", sent:"This restaurant is more better than that one .", wrong:3, fix:"better", why:"Better is already comparative — no more."},
 {t:"spot", sent:"He is older then his cousin .", wrong:3, fix:"than", why:"Comparatives take than."},
 {t:"mcq", q:"Which sentence is correct?", opts:["She is as tall than me.","She is so tall as me.","She is as tall as me.","She is tall as me."], a:2, why:"Equality: as + adjective + as."}
]},

{
id:"some-any", zh:"數量詞 some / any", unit:"u8", n:"6.2", title:"Quantifiers: Some & Any", sub:"Some for positives and offers, any for negatives and most questions.",
form:{p:"some + positive / offers   ·   any + negatives / questions", ex:["We have <b>some</b> rice.","We don't have <b>any</b> eggs.","Do you have <b>any</b> questions?"]},
uses:[
 {t:"Some: positive sentences", d:"Use some with plural and uncountable nouns when the amount isn't exact.", ex:[
   {s:"I bought <b>some</b> oranges.", n:"plural"},
   {s:"There's <b>some</b> juice in the fridge.", n:"uncountable"}]},
 {t:"Any: negatives and questions", d:"Any replaces some when the sentence is negative or asks a real question.", ex:[
   {s:"We don't have <b>any</b> homework today.", n:""},
   {s:"Are there <b>any</b> tickets left?", n:""},
   {s:"She never buys <b>any</b> snacks.", n:"never counts as negative"}]},
 {t:"Some in questions: offers and requests", d:"When you expect yes — offering or asking politely — keep some.", ex:[
   {s:"Would you like <b>some</b> tea?", n:"offer"},
   {s:"Could I have <b>some</b> water, please?", n:"request"}]}
],
mistakes:[
 {no:"I don't have some money.", yes:"I don't have any money.", why:"Negatives take any."},
 {no:"Do you have some brothers?", yes:"Do you have any brothers?", why:"Real questions take any."},
 {no:"There aren't any milk.", yes:"There isn't any milk.", why:"Milk is uncountable → isn't."}
],
tip:"Offering or requesting and expecting a yes? Use some, even in a question: \"Would you like some more?\"",
q:[
 {t:"mcq", q:"Is there ___ bread left?", opts:["some","any","a","many"], a:1, why:"A real question → any."},
 {t:"mcq", q:"Would you like ___ coffee?", opts:["any","a","some","an"], a:2, why:"An offer expecting yes → some."},
 {t:"fill", q:"Sorry, we don't have ___ tables free right now.", ans:["any"], hint:"Negative sentence", why:"Negative → any."},
 {t:"fill", q:"I need to buy ___ new shoes.", ans:["some"], hint:"Positive sentence", why:"Positive statement → some."},
 {t:"order", words:["There","isn't","any","sugar","in","my","tea"], sent:"There isn't any sugar in my tea", why:"Negative + any + uncountable."},
 {t:"spot", sent:"She didn't bring some snacks to share .", wrong:3, fix:"any", why:"Negative sentence → any."},
 {t:"mcq", q:"Which sentence is correct?", opts:["Could I have any water?","Could I have some water?","Could I have a water anys?","Could I have waters?"], a:1, why:"Polite request → some."},
 {t:"spot", sent:"Do you have some questions for me ?", wrong:3, fix:"any", why:"Real question → any."}
]},

{
id:"linking-words", zh:"連接詞與過渡語", unit:"u8", n:"6.3", title:"Linking Words", sub:"However, although, therefore — making your ideas flow logically.",
form:{p:"Although + clause , clause   ·   Clause . However , clause", ex:["<b>Although</b> it rained, we went out.","It rained. <b>However</b>, we went out.","He trained hard; <b>therefore</b>, he won."]},
uses:[
 {t:"Contrast: although, even though, however", d:"Although joins two clauses in one sentence; however starts a new one.", ex:[
   {s:"<b>Although</b> the food was cheap, it tasted great.", n:"one sentence"},
   {s:"The hotel was small. <b>However</b>, it was very clean.", n:"new sentence + comma"},
   {s:"<b>Even though</b> she was tired, she kept working.", n:"stronger than although"}]},
 {t:"Result: therefore, as a result", d:"Formal cousins of so — great for writing.", ex:[
   {s:"Prices rose; <b>therefore</b>, sales fell.", n:"semicolon or full stop before it"},
   {s:"He missed the bus. <b>As a result</b>, he was late.", n:""},
   {s:"The evidence was weak; <b>therefore</b>, the case was dropped.", n:""}]},
 {t:"Adding and giving examples", d:"Moreover, in addition and for example organize longer writing.", ex:[
   {s:"The plan is cheap. <b>Moreover</b>, it is fast.", n:""},
   {s:"Many night markets are famous — <b>for example</b>, Raohe and Shilin.", n:""},
   {s:"She speaks three languages. <b>In addition</b>, she codes.", n:""}]}
],
mistakes:[
 {no:"Although it was late, but we kept talking.", yes:"Although it was late, we kept talking.", why:"Although and but — pick one, not both."},
 {no:"However he was tired, he finished.", yes:"Although he was tired, he finished.", why:"However can't join two clauses inside one sentence the way although can."},
 {no:"It was expensive, however, I bought it.", yes:"It was expensive. However, I bought it.", why:"However needs a full stop or semicolon before it."}
],
tip:"Although lives inside one sentence; however and therefore start a new one — with a comma right after them.",
q:[
 {t:"mcq", q:"___ the test was hard, most students passed.", opts:["However","Although","Therefore","Moreover"], a:1, why:"Joining two clauses in one sentence → although."},
 {t:"mcq", q:"It was freezing. ___, we still went hiking.", opts:["Although","Because","However","So that"], a:2, why:"Contrast starting a new sentence → however."},
 {t:"fill", q:"He forgot his lines. ___, the show went well.", ans:["However","Nevertheless"], hint:"contrast, new sentence", why:"New-sentence contrast → however."},
 {t:"spot", sent:"She studied hard , however she failed the exam .", wrong:4, fix:"but", why:"Inside one sentence, use but — or rewrite with although."},
 {t:"order", words:["Although","it","was","raining","we","played","outside"], sent:"Although it was raining we played outside", why:"Although + clause, then the main clause."},
 {t:"mcq", q:"Prices increased; ___, demand dropped.", opts:["moreover","for example","therefore","although"], a:2, why:"The drop is a result → therefore."},
 {t:"fill", q:"The room is big. ___, it has a great view.", ans:["Moreover","In addition","Furthermore"], hint:"adding a second good point", why:"Adding → moreover / in addition."},
 {t:"spot", sent:"She loves seafood . Therefore , she never eats fish .", wrong:4, fix:"However", why:"The second idea contrasts — however, not therefore."}
]},

/* ================= ADVANCED ================= */

{
id:"passive", zh:"被動語態", unit:"u5", n:"7.1", title:"The Passive Voice", sub:"When the action matters more than who did it — rice is grown, the law was passed.",
form:{p:"subject + be + past participle (+ by …)", ex:["This temple <b>was built</b> in 1738.","English <b>is spoken</b> here.","The results <b>will be announced</b> soon."]},
uses:[
 {t:"When the doer is unknown or unimportant", d:"The receiver of the action becomes the subject.", ex:[
   {s:"My scooter <b>was stolen</b> last night.", n:"we don't know who"},
   {s:"These chips <b>are made</b> in Hsinchu.", n:"the maker is obvious / unimportant"},
   {s:"The road <b>is being repaired</b>.", n:"passive continuous"}]},
 {t:"Formal and academic writing", d:"Passives put the topic first and keep the tone objective — common in reports and papers.", ex:[
   {s:"The samples <b>were analyzed</b> using AntConc.", n:""},
   {s:"Participants <b>were asked</b> to complete a survey.", n:""}]},
 {t:"Adding the doer with by", d:"Mention the agent only when it adds real information.", ex:[
   {s:"This novel <b>was written by</b> a local author.", n:""},
   {s:"The winning photo <b>was taken by</b> a student.", n:""}]}
],
mistakes:[
 {no:"The window was break by the wind.", yes:"The window was broken by the wind.", why:"Passive needs the past participle: broken."},
 {no:"The cake eaten by the kids.", yes:"The cake was eaten by the kids.", why:"Never drop be — it carries the tense."},
 {no:"He was gave a prize.", yes:"He was given a prize.", why:"Give → given after be."}
],
tip:"The tense lives in be, the meaning lives in the participle: is made → was made → has been made → will be made.",
q:[
 {t:"mcq", q:"This bridge ___ over a century ago.", opts:["built","was built","is building","has built"], a:1, why:"Past passive: was + built."},
 {t:"mcq", q:"Bubble tea ___ all over the world now.", opts:["is enjoyed","enjoys","is enjoying","enjoyed"], a:0, why:"Present passive: is + past participle."},
 {t:"fill", q:"The email ___ (send) yesterday afternoon.", ans:["was sent"], hint:"be (past) + participle", why:"Was sent — past passive."},
 {t:"fill", q:"These photos ___ (take) by my grandfather.", ans:["were taken"], hint:"Plural subject, past", why:"Were taken — plural past passive."},
 {t:"order", words:["The","report","was","written","by","the","new","intern"], sent:"The report was written by the new intern", why:"Subject + was + participle + by + agent."},
 {t:"spot", sent:"The package was deliver this morning .", wrong:3, fix:"delivered", why:"Passive needs the participle: delivered."},
 {t:"spot", sent:"Rice is grew in the south of Taiwan .", wrong:2, fix:"grown", why:"Grow → grown in the passive."},
 {t:"mcq", q:"Which sentence is passive?", opts:["The chef cooked a great meal.","Someone has taken my seat.","My wallet has been found.","She is cooking dinner."], a:2, why:"Has been found = have + been + participle."}
]},

{
id:"relative-clauses", zh:"關係子句", unit:"u5", n:"7.2", title:"Relative Clauses", sub:"Who, which, that, whose, where — folding two sentences into one.",
form:{p:"noun + who / which / that + clause", ex:["The woman <b>who called</b> is my boss.","The book <b>that you lent me</b> was great.","That's the café <b>where we met</b>."]},
uses:[
 {t:"Choosing the right pronoun", d:"Who for people, which for things, that for both (informal), whose for possession, where for places.", ex:[
   {s:"The student <b>who</b> won the prize is in my class.", n:"person → who"},
   {s:"I lost the umbrella <b>which / that</b> you gave me.", n:"thing → which / that"},
   {s:"That's the author <b>whose</b> book we're reading.", n:"possession → whose"}]},
 {t:"Defining clauses: essential information", d:"The clause tells us which one — no commas.", ex:[
   {s:"The train <b>that leaves at six</b> is always crowded.", n:"identifies which train"},
   {s:"People <b>who exercise regularly</b> sleep better.", n:""}]},
 {t:"Non-defining clauses: extra information", d:"The clause just adds detail — use commas, and never that.", ex:[
   {s:"My sister, <b>who lives in Tainan</b>, is visiting us.", n:"I have one sister; the clause is a bonus"},
   {s:"Taipei 101, <b>which opened in 2004</b>, has 101 floors.", n:"comma + which, never comma + that"}]}
],
mistakes:[
 {no:"The man which fixed my car was kind.", yes:"The man who fixed my car was kind.", why:"People take who (or that), not which."},
 {no:"The phone what I bought is fast.", yes:"The phone that I bought is fast.", why:"What is not a relative pronoun here."},
 {no:"My mother, that is a nurse, works nights.", yes:"My mother, who is a nurse, works nights.", why:"After a comma, use who / which — never that."}
],
tip:"If you can delete the clause and still know exactly which thing you mean, it's non-defining: add commas and ban that.",
q:[
 {t:"mcq", q:"The doctor ___ treated me was very patient.", opts:["which","who","whose","where"], a:1, why:"A person → who."},
 {t:"mcq", q:"This is the park ___ we used to play.", opts:["which","that","where","who"], a:2, why:"A place where something happens → where."},
 {t:"fill", q:"The artist ___ paintings sold out is only nineteen.", ans:["whose"], hint:"Possession", why:"Whose shows the paintings belong to the artist."},
 {t:"fill", q:"I liked the gift ___ you chose. (thing; informal, one word)", ans:["that","which"], hint:"Thing → ?", why:"Things take that or which."},
 {t:"order", words:["The","movie","that","we","watched","was","too","long"], sent:"The movie that we watched was too long", why:"Noun + that + clause + main verb."},
 {t:"spot", sent:"The girl which sits next to me is from Korea .", wrong:2, fix:"who", why:"A person → who."},
 {t:"mcq", q:"Which sentence is correct?", opts:["Taipei, that is huge, never sleeps.","Taipei, which is huge, never sleeps.","Taipei which is huge never sleeps.","Taipei, who is huge, never sleeps."], a:1, why:"Non-defining clause → comma + which."},
 {t:"spot", sent:"He is the man who's car was stolen .", wrong:4, fix:"whose", why:"Possession uses whose; who's = who is."}
]},

{
id:"participle-clauses", zh:"分詞構句", unit:"u5", n:"7.3", title:"Participle Clauses", sub:"Feeling tired, she left early — trimming sentences with -ing and -ed.",
form:{p:"V-ing / p.p. + phrase , + main clause", ex:["<b>Feeling</b> sick, he went home.","<b>Built</b> in 1908, the station is historic.","She sat there, <b>reading</b> quietly."]},
uses:[
 {t:"-ing for active meaning", d:"The subject of the main clause is doing the -ing action.", ex:[
   {s:"<b>Hearing</b> the alarm, we ran outside.", n:"= when we heard"},
   {s:"<b>Not knowing</b> the answer, I stayed silent.", n:"negative: not + V-ing"},
   {s:"He hurt his knee <b>playing</b> football.", n:""}]},
 {t:"-ed (past participle) for passive meaning", d:"The subject receives the action instead of doing it.", ex:[
   {s:"<b>Written</b> in 1600, the play is still performed.", n:"= which was written"},
   {s:"<b>Surprised</b> by the news, she sat down.", n:""},
   {s:"The cake, <b>baked</b> that morning, smelled amazing.", n:""}]},
 {t:"Reasons, results and earlier actions", d:"Having + past participle marks an action that happened first.", ex:[
   {s:"<b>Having missed</b> the bus, we took a taxi.", n:"missing came first"},
   {s:"The typhoon hit at night, <b>causing</b> major delays.", n:"result at the end"},
   {s:"<b>Having lived</b> in Tainan, she knows the food scene.", n:""}]}
],
mistakes:[
 {no:"Walking down the street, the trees looked beautiful.", yes:"Walking down the street, I saw beautiful trees.", why:"The -ing subject must match the main subject — trees don't walk. (A dangling participle!)"},
 {no:"Been tired, she went to bed.", yes:"Being tired, she went to bed.", why:"Active state → being."},
 {no:"Having finish the work, he relaxed.", yes:"Having finished the work, he relaxed.", why:"Having + past participle."}
],
tip:"Ask: who is doing the -ing action? It must be the subject of the main clause — otherwise the sentence dangles.",
q:[
 {t:"mcq", q:"___ the door, she noticed a letter.", opts:["Opened","Opening","Opens","To opening"], a:1, why:"She actively opened it → opening."},
 {t:"mcq", q:"___ in Japan, the camera is high quality.", opts:["Making","Made","Make","To make"], a:1, why:"The camera was made → past participle."},
 {t:"fill", q:"___ (finish) his homework, he went out to play.", ans:["Having finished","Finishing"], hint:"the homework came first", why:"Earlier action → having finished."},
 {t:"spot", sent:"Wrote in a hurry , the essay had many mistakes .", wrong:0, fix:"Written", why:"The essay was written → past participle."},
 {t:"order", words:["Feeling","hungry","we","stopped","for","noodles"], sent:"Feeling hungry we stopped for noodles", why:"V-ing phrase first, main clause after."},
 {t:"mcq", q:"Which sentence dangles (is wrong)?", opts:["Running to class, my bag broke.","Running to class, I dropped my bag.","Tired from work, she napped.","Built last year, the bridge is new."], a:0, why:"The bag wasn't running — the -ing subject must match."},
 {t:"fill", q:"___ (not want) to be late, we left early.", ans:["Not wanting"], hint:"negative -ing", why:"Negative participle → not wanting."},
 {t:"spot", sent:"Having saw the movie twice , I skipped it .", wrong:1, fix:"seen", why:"Having + past participle: seen."}
]},

{
id:"reported-speech", zh:"間接引述句", unit:"u5", n:"7.4", title:"Reported Speech", sub:"Telling someone what another person said — and shifting the tense back.",
form:{p:"said (that) + clause, one tense back", ex:["\"I <b>am</b> tired\" → She said she <b>was</b> tired.","\"I <b>will</b> call\" → He said he <b>would</b> call.","\"We <b>have finished</b>\" → They said they <b>had finished</b>."]},
uses:[
 {t:"The backshift", d:"When the reporting verb is past (said, told), the original tense usually moves one step back.", ex:[
   {s:"present simple → past: \"I <b>like</b> it\" → She said she <b>liked</b> it.", n:""},
   {s:"past simple → past perfect: \"I <b>saw</b> him\" → She said she <b>had seen</b> him.", n:""},
   {s:"will → would, can → could, must → had to", n:"modals shift too"}]},
 {t:"Say vs tell", d:"Tell needs a person; say doesn't.", ex:[
   {s:"She <b>said</b> (that) she was busy.", n:"say + clause"},
   {s:"She <b>told me</b> (that) she was busy.", n:"tell + person + clause"}]},
 {t:"Reporting questions and requests", d:"Questions lose their question order; requests use asked + to.", ex:[
   {s:"\"Where do you live?\" → He asked <b>where I lived</b>.", n:"statement order, no do"},
   {s:"\"Are you okay?\" → She asked <b>if I was</b> okay.", n:"yes/no → if / whether"},
   {s:"\"Please wait.\" → They asked us <b>to wait</b>.", n:"request → to + verb"}]}
],
mistakes:[
 {no:"She said me she was leaving.", yes:"She told me she was leaving.", why:"Say never takes a person directly — that's tell's job."},
 {no:"He asked where did I work.", yes:"He asked where I worked.", why:"Reported questions use statement order."},
 {no:"They said they will come.", yes:"They said they would come.", why:"After said, will shifts to would."}
],
tip:"Pronouns and time words shift with the tense: my → her, today → that day, tomorrow → the next day, here → there.",
q:[
 {t:"mcq", q:"\"I am hungry,\" he said. → He said he ___ hungry.", opts:["is","was","were","has been"], a:1, why:"Am shifts back to was."},
 {t:"mcq", q:"She ___ me that the meeting was cancelled.", opts:["said","told","said to","spoke"], a:1, why:"Tell + person: told me."},
 {t:"fill", q:"\"I will help you.\" → She said she ___ help me.", ans:["would"], hint:"Will shifts back", why:"Will → would."},
 {t:"fill", q:"\"Do you like jazz?\" → He asked ___ I liked jazz.", ans:["if","whether"], hint:"Yes/no question", why:"Yes/no questions report with if or whether."},
 {t:"order", words:["He","asked","me","where","I","had","parked"], sent:"He asked me where I had parked", why:"Reported question → statement order, tense back."},
 {t:"spot", sent:"She said me that she felt sick .", wrong:1, fix:"told", why:"Said + person is wrong — use told me."},
 {t:"spot", sent:"He asked what time did the show start .", wrong:4, fix:"the show started (statement order)", why:"No did in reported questions."},
 {t:"mcq", q:"\"We saw the movie.\" → They said they ___ the movie.", opts:["saw","have seen","had seen","see"], a:2, why:"Past simple shifts to past perfect."}
]},

{
id:"second-conditional", zh:"第二條件句", unit:"u6", n:"8.1", title:"Second Conditional", sub:"Unreal or unlikely present and future — if I had a million dollars…",
form:{p:"If + past simple, … would + verb", ex:["<b>If</b> I <b>had</b> more time, I<b>'d learn</b> the violin.","<b>If</b> she <b>lived</b> closer, we<b>'d meet</b> more often.","What <b>would</b> you <b>do if</b> you <b>won</b>?"]},
uses:[
 {t:"Imagined present or future", d:"The past tense here doesn't mean past time — it signals this isn't real.", ex:[
   {s:"<b>If</b> I <b>were</b> taller, I<b>'d play</b> basketball.", n:"I'm not taller — imagination"},
   {s:"<b>If</b> we <b>didn't have</b> exams, we<b>'d travel</b> this week.", n:""},
   {s:"She<b>'d be</b> happier <b>if</b> she <b>changed</b> jobs.", n:"result can come first"}]},
 {t:"Advice with If I were you", d:"The classic advice formula — were is used for all persons in careful English.", ex:[
   {s:"<b>If I were you</b>, I<b>'d apologize</b> first.", n:""},
   {s:"<b>If I were</b> him, I <b>wouldn't sign</b> that contract.", n:""}]},
 {t:"First vs second: real vs unreal", d:"Choose by how likely you feel the condition is.", ex:[
   {s:"If I <b>have</b> time tomorrow, I<b>'ll help</b>. (real chance)", n:"first conditional"},
   {s:"If I <b>had</b> time, I<b>'d help</b>. (but I don't)", n:"second conditional"}]}
],
mistakes:[
 {no:"If I would have money, I'd travel.", yes:"If I had money, I'd travel.", why:"No would inside the if-clause."},
 {no:"If she was you, she'd wait.", yes:"If she were you, she'd wait.", why:"Hypothetical be prefers were for all persons."},
 {no:"If I won, I will quit my job.", yes:"If I won, I would quit my job.", why:"Unreal condition pairs with would, not will."}
],
tip:"Hear the pairing as a chord: past + would. If either half slips into present + will, you've changed the meaning to a real possibility.",
q:[
 {t:"mcq", q:"If I ___ the lottery, I'd buy my parents a house.", opts:["win","won","will win","would win"], a:1, why:"Second conditional if-clause → past simple."},
 {t:"mcq", q:"If he spoke less, people ___ to him more.", opts:["will listen","listen","would listen","listened"], a:2, why:"Result clause → would + base verb."},
 {t:"fill", q:"If I ___ you, I'd take the offer. (be)", ans:["were","was"], hint:"Advice formula", why:"If I were you — hypothetical were."},
 {t:"fill", q:"She ___ travel more if she had longer holidays.", ans:["would","'d"], hint:"Result of an unreal condition", why:"Unreal result → would."},
 {t:"order", words:["If","I","had","wings","I","would","fly","home"], sent:"If I had wings I would fly home", why:"If + past, would + verb."},
 {t:"spot", sent:"If I would know the answer , I'd tell you .", wrong:2, fix:"knew", why:"No would in the if-clause — use past simple."},
 {t:"mcq", q:"Which is a second conditional?", opts:["If it rains, we'll cancel.","If you heat ice, it melts.","If I were rich, I'd donate more.","If she calls, tell me."], a:2, why:"Were + would = unreal present."},
 {t:"spot", sent:"If we lived by the sea , we will swim daily .", wrong:7, fix:"would", why:"Unreal condition → would, not will."}
]},

{
id:"third-conditional", zh:"第三條件句", unit:"u6", n:"8.2", title:"Third Conditional", sub:"Rewriting the past that never happened — regrets, relief and lessons learned.",
form:{p:"If + past perfect, … would have + participle", ex:["<b>If</b> I <b>had studied</b>, I <b>would have passed</b>.","She <b>wouldn't have missed</b> it <b>if</b> she<b>'d left</b> earlier.","<b>If</b> we<b>'d known</b>, we <b>would have come</b>."]},
uses:[
 {t:"Imagining a different past", d:"Both halves are 100% unreal — the past can't be changed.", ex:[
   {s:"<b>If</b> you <b>had told</b> me, I <b>would have helped</b>.", n:"you didn't tell me, so I didn't help"},
   {s:"<b>If</b> the traffic <b>hadn't been</b> so bad, we <b>would have arrived</b> on time.", n:""},
   {s:"I <b>would have taken</b> the job <b>if</b> they<b>'d offered</b> more.", n:""}]},
 {t:"Regret and relief", d:"Third conditionals carry strong feeling — what we wish had (not) happened.", ex:[
   {s:"<b>If</b> I<b>'d saved</b> money in my twenties, I <b>would have bought</b> a flat.", n:"regret"},
   {s:"<b>If</b> we<b>'d taken</b> that flight, we <b>would have been</b> stuck in the storm.", n:"relief"}]},
 {t:"Softer results: could have, might have", d:"Swap would for could or might when the result was possible, not certain.", ex:[
   {s:"<b>If</b> she<b>'d asked</b>, I <b>could have lent</b> her mine.", n:"ability"},
   {s:"<b>If</b> we<b>'d left</b> earlier, we <b>might have caught</b> the sunset.", n:"possibility"}]}
],
mistakes:[
 {no:"If I would have known, I'd have called.", yes:"If I had known, I'd have called.", why:"The if-clause takes past perfect, never would have."},
 {no:"If she had asked, I would helped.", yes:"If she had asked, I would have helped.", why:"The result needs would have + participle."},
 {no:"If we didn't miss the bus, we would have been early.", yes:"If we hadn't missed the bus, we would have been early.", why:"Unreal past condition → past perfect."}
],
tip:"Both clauses point at the same closed past: had + participle sets the scene, would have + participle imagines the outcome.",
q:[
 {t:"mcq", q:"If you ___ me, I would have picked you up.", opts:["called","had called","would call","call"], a:1, why:"If-clause → past perfect: had called."},
 {t:"mcq", q:"She ___ the deadline if her laptop hadn't crashed.", opts:["would meet","met","would have met","had met"], a:2, why:"Result → would have + participle."},
 {t:"fill", q:"If I had seen the sign, I ___ have parked there. (negative)", ans:["wouldn't","would not"], hint:"Unreal past result, negative", why:"Wouldn't have parked."},
 {t:"fill", q:"If they ___ (leave) earlier, they would have caught the train.", ans:["had left"], hint:"Past perfect", why:"If + had left."},
 {t:"order", words:["If","I","had","known","I","would","have","waited"], sent:"If I had known I would have waited", why:"Had + participle, would have + participle."},
 {t:"spot", sent:"If I would have studied , I'd have passed .", wrong:2, fix:"had", why:"If-clause: had studied, never would have."},
 {t:"spot", sent:"If she had asked , I would helped her .", wrong:6, fix:"have helped", why:"Result needs would have + participle."},
 {t:"mcq", q:"\"If we'd booked earlier, we might have gotten seats.\" What really happened?", opts:["They booked early and got seats.","They didn't book early and didn't get seats.","They will book early.","They got seats anyway."], a:1, why:"Third conditional describes an unreal past — the opposite happened."}
]},

{
id:"noun-clauses", zh:"名詞子句與假設語氣", unit:"u6", n:"8.3", title:"Noun Clauses & the Subjunctive", sub:"That she left, whether it works — clauses that act like nouns, plus the demand-verb pattern.",
form:{p:"verb + that / whether / if + clause   ·   suggest that + subject + base verb", ex:["I know <b>that she is right</b>.","I wonder <b>whether it will rain</b>.","They insisted <b>that he be on time</b>."]},
uses:[
 {t:"That-clauses as objects", d:"A whole clause can be the thing you know, say or believe.", ex:[
   {s:"Everyone believes <b>that the plan will work</b>.", n:""},
   {s:"She said <b>(that) she was busy</b>.", n:"that is often dropped in speech"},
   {s:"The problem is <b>that we have no budget</b>.", n:"after be, too"}]},
 {t:"Whether / if for yes-no uncertainty", d:"When the inner question is a yes-no question, use whether or if.", ex:[
   {s:"I don't know <b>whether he got the message</b>.", n:""},
   {s:"Ask her <b>if she needs help</b>.", n:""},
   {s:"<b>Whether we win or lose</b>, we tried our best.", n:"whether can start a sentence; if can't here"}]},
 {t:"The subjunctive after demand verbs", d:"Suggest, insist, demand, recommend, require + that → base verb.", ex:[
   {s:"The doctor suggested <b>that he rest</b>.", n:"rest, not rests"},
   {s:"We recommend <b>that she apply</b> early.", n:""},
   {s:"It is essential <b>that every student bring</b> ID.", n:"also after essential, important, vital"}]}
],
mistakes:[
 {no:"I suggested that he goes home.", yes:"I suggested that he go home.", why:"After suggest that, the verb stays in base form."},
 {no:"I don't know that he will come or not.", yes:"I don't know whether he will come or not.", why:"Or not pairs with whether."},
 {no:"It is important that she is on time.", yes:"It is important that she be on time.", why:"The demand pattern uses the base verb be."}
],
tip:"Demand-type verbs (suggest, insist, recommend, demand, require) + that → base verb, even for he / she / it.",
q:[
 {t:"mcq", q:"The teacher insisted that every student ___ the meeting.", opts:["attends","attend","attended","attending"], a:1, why:"Insist that → base verb attend."},
 {t:"mcq", q:"I'm not sure ___ the store is open today.", opts:["that","what","whether","which"], a:2, why:"A yes-no question inside → whether."},
 {t:"fill", q:"She suggested that he ___ (see) a doctor.", ans:["see"], hint:"base form", why:"Suggest that → base verb see."},
 {t:"spot", sent:"We demanded that the company refunds our money .", wrong:5, fix:"refund", why:"Demand that → base verb refund."},
 {t:"order", words:["I","wonder","whether","she","got","my","message"], sent:"I wonder whether she got my message", why:"Wonder + whether-clause."},
 {t:"mcq", q:"Which is correct?", opts:["It is vital that he is here by nine.","It is vital that he be here by nine.","It is vital that he being here by nine.","It is vital that he to be here by nine."], a:1, why:"Vital that → base verb be."},
 {t:"fill", q:"He told me ___ he had already eaten.", ans:["that"], hint:"introduces the statement", why:"A statement clause → that."},
 {t:"spot", sent:"I asked her that she was free on Sunday .", wrong:3, fix:"whether", why:"A yes-no question inside → whether or if."}
]},

{
id:"gerunds-infinitives", zh:"動名詞與不定詞", unit:"u9", n:"9.1", title:"Gerunds & Infinitives", sub:"Enjoy swimming but decide to swim — which verb takes which form?",
form:{p:"verb + -ing (gerund)   ·   verb + to + base (infinitive)", ex:["I enjoy <b>reading</b>.","She decided <b>to leave</b>.","He stopped <b>smoking</b>."]},
uses:[
 {t:"Verbs followed by a gerund", d:"Enjoy, finish, avoid, keep, mind, suggest, practice — these take -ing.", ex:[
   {s:"He finished <b>writing</b> the report.", n:""},
   {s:"I don't mind <b>waiting</b>.", n:""},
   {s:"She suggested <b>taking</b> the early train.", n:""}]},
 {t:"Verbs followed by an infinitive", d:"Want, decide, hope, plan, promise, offer, learn, need — these take to + verb.", ex:[
   {s:"We plan <b>to visit</b> Alishan in autumn.", n:""},
   {s:"He promised <b>to call</b> back.", n:""},
   {s:"She's learning <b>to drive</b>.", n:""}]},
 {t:"Verbs that take both — with a twist", d:"Some verbs change meaning: remember, stop, try, forget.", ex:[
   {s:"I stopped <b>drinking</b> coffee. (= quit the habit)", n:""},
   {s:"I stopped <b>to drink</b> some water. (= paused in order to drink)", n:""},
   {s:"Remember <b>to lock</b> the door. (a task ahead) · I remember <b>locking</b> it. (a memory)", n:""}]}
],
mistakes:[
 {no:"I enjoy to swim.", yes:"I enjoy swimming.", why:"Enjoy always takes the gerund."},
 {no:"She wants going home.", yes:"She wants to go home.", why:"Want always takes the infinitive."},
 {no:"He avoided to answer.", yes:"He avoided answering.", why:"Avoid takes the gerund."}
],
tip:"A rough compass: gerunds often look back or describe habits (enjoy, finish, avoid); infinitives often look forward (want, plan, hope, decide).",
q:[
 {t:"mcq", q:"She avoided ___ my question.", opts:["to answer","answering","answer","answered"], a:1, why:"Avoid + gerund."},
 {t:"mcq", q:"They decided ___ a new apartment.", opts:["renting","rent","to rent","rented"], a:2, why:"Decide + infinitive."},
 {t:"fill", q:"I really enjoy ___ (cook) on weekends.", ans:["cooking"], hint:"Enjoy + ?", why:"Enjoy takes the gerund."},
 {t:"fill", q:"He hopes ___ (pass) the IELTS next month.", ans:["to pass"], hint:"Hope + ?", why:"Hope takes the infinitive."},
 {t:"order", words:["She","suggested","going","to","the","museum","instead"], sent:"She suggested going to the museum instead", why:"Suggest + gerund."},
 {t:"spot", sent:"I finished to read the novel last night .", wrong:2, fix:"reading", why:"Finish + gerund."},
 {t:"mcq", q:"\"I stopped to buy milk\" means…", opts:["I quit buying milk.","I paused my journey in order to buy milk.","I never buy milk.","I forgot the milk."], a:1, why:"Stop + infinitive = pause in order to do something."},
 {t:"spot", sent:"Remember locking the door before you leave tonight .", wrong:1, fix:"to lock", why:"A task ahead → remember + infinitive."}
]},

{
id:"phrasal-verbs", zh:"片語動詞", unit:"u9", n:"9.2", title:"Phrasal Verbs", sub:"Take off, put up with, run into — small words, big meaning changes.",
form:{p:"verb + particle ( + object )", ex:["The plane <b>took off</b>.","She <b>turned down</b> the offer.","I <b>ran into</b> an old friend."]},
uses:[
 {t:"Separable: the object can split them", d:"Noun objects can go in the middle or after; pronouns MUST go in the middle.", ex:[
   {s:"Please <b>turn off</b> the light. / Please <b>turn</b> the light <b>off</b>.", n:"both fine"},
   {s:"She <b>picked</b> it <b>up</b>.", n:"pronoun → always in the middle"},
   {s:"<b>Write down</b> the address before you forget.", n:""}]},
 {t:"Inseparable: they stay together", d:"Some phrasal verbs never split — the object always follows.", ex:[
   {s:"I <b>ran into</b> Mrs. Chen at the market.", n:"= met by chance"},
   {s:"We need to <b>look after</b> the neighbor's cat.", n:"= take care of"},
   {s:"He never <b>got over</b> the loss.", n:"= recovered from"}]},
 {t:"Three-part phrasal verbs", d:"Verb + two particles — these never split either.", ex:[
   {s:"I can't <b>put up with</b> the noise anymore.", n:"= tolerate"},
   {s:"She <b>looks up to</b> her grandmother.", n:"= admires"},
   {s:"We've <b>run out of</b> rice.", n:"= have none left"}]}
],
mistakes:[
 {no:"She picked up it.", yes:"She picked it up.", why:"Pronoun objects go between the verb and the particle."},
 {no:"He looks after very well his dog.", yes:"He looks after his dog very well.", why:"Don't split inseparable phrasal verbs."},
 {no:"I will put up the noise with.", yes:"I will put up with the noise.", why:"Three-part phrasal verbs never split."}
],

const STORE_KEY = "grammarpath_v1";
const store = {
  data: {xp:0, completed:{}, streak:{count:0,last:null}, best:{}, mistakes:{}},
  load(){ try{ const raw = localStorage.getItem(STORE_KEY); if(raw) this.data = Object.assign(this.data, JSON.parse(raw)); }catch(e){} },
  save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }catch(e){} },
  addXP(n){ this.data.xp += n; this.save(); paintHeader(); toast("+" + n + " XP"); },
  complete(id){ if(!this.data.completed[id]){ this.data.completed[id]=true; this.save(); } },
  touchStreak(){
    const today = new Date(); today.setHours(0,0,0,0);
    const t = today.getTime(), s = this.data.streak;
    if(s.last === t) return;
    const oneDay = 86400000;
    s.count = (s.last === t - oneDay) ? s.count + 1 : 1;
    s.last = t; this.save(); paintHeader();
    if(s.count > 1) toast("🔥 " + s.count + "-day streak!");
  },
  streakCount(){
    const s = this.data.streak; if(!s.last) return 0;
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = today.getTime() - s.last;
    return diff <= 86400000 ? s.count : 0;
  },
  setBest(key,score){ if(!this.data.best[key] || score > this.data.best[key]){ this.data.best[key]=score; this.save(); return true; } return false; }
};
store.load();

/* ---- Text-to-speech (Web Speech API) ---- */
const tts = {
  ok: ("speechSynthesis" in window),
  voice: null,
  _q: [], _cancel: false,
  /* Rank every English voice and keep the most natural one the device offers.
     The big quality jump on modern devices comes from the neural voices:
     Windows/Edge "… Online (Natural)", Apple "(Enhanced)/(Premium)", Google. */
  pick(){ if(!this.ok) return;
    const all = speechSynthesis.getVoices().filter(v=>v.lang && /^en/i.test(v.lang));
    if(!all.length) return;
    const score = v => {
      const n = (v.name||"").toLowerCase(); let s = 0;
      if(/natural|neural/.test(n))    s += 70;   // Microsoft neural voices
      if(/enhanced|premium/.test(n))  s += 65;   // Apple downloaded high-quality voices
      if(/online/.test(n))            s += 35;   // MS online = cloud neural
      if(/google/.test(n))            s += 45;   // Google voices: clearly better than legacy
      if(/\b(aria|jenny|ava|zoe|allison|samantha|serena|nova|emma|libby|sonia|michelle|evan)\b/.test(n)) s += 22;
      if(v.lang==="en-US")            s += 12;
      else if(v.lang==="en-GB")       s += 8;
      else                            s += 3;
      if(/female/i.test(v.name))      s += 4;
      if(/espeak|pico|compact|eloquence/.test(n)) s -= 60;               // known robotic engines
      if(/microsoft (david|mark|zira|hazel|george|susan|catherine|james|linda|richard)\b/.test(n) && !/online|natural/.test(n)) s -= 12; // legacy SAPI
      return s;
    };
    this.voice = all.slice().sort((a,b)=>score(b)-score(a))[0] || null; },
  stop(){ if(typeof rdStopAudio==="function") rdStopAudio();
    if(this.ok){ this._cancel = true; this._q = []; speechSynthesis.cancel(); } },
  _one(text, rate, pitch, onend){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (this.voice && this.voice.lang) || "en-US";
    u.rate = rate || 0.95; u.pitch = (pitch==null?1.0:pitch);
    if(this.voice) u.voice = this.voice;
    u.onend = onend; u.onerror = onend;
    try{ speechSynthesis.resume(); }catch(e){}
    speechSynthesis.speak(u); },
  /* Speak sentence by sentence with a short gap. Two wins over one long utterance:
     a more human rhythm, and no more mid-read cut-off on long texts in Chrome. */
  speak(text, rate, pitch){ if(!this.ok || !text) return;
    this.stop(); this._cancel = false;
    const parts = String(text).replace(/\s+/g," ").match(/[^.!?…]+[.!?…]*["”')]*|\S+$/g) || [text];
    this._q = parts.map(s=>s.trim()).filter(Boolean);
    const next = () => {
      if(this._cancel || !this._q.length) return;
      const s = this._q.shift();
      this._one(s, rate, pitch, () => {
        if(this._cancel || !this._q.length) return;
        setTimeout(next, this._q.length ? 170 : 0);   // brief breath between sentences
      });
    };
    next(); }
};

}

/* =====================================================
   Views — Level
   ===================================================== */
function renderLevel(lvl){
  const lv = levelById(lvl), p = pctDone(lvl);
  const units = DATA.units.filter(u=>u.level===lvl).map(u=>{
    const rows = DATA.lessons.filter(l=>l.unit===u.id).map(l=>{
      const done = !!store.data.completed[l.id];
      return `<button class="lesson-row" onclick="location.hash='#/lesson/${l.id}'">
        <span class="lr-check ${done?"lr-done":"lr-todo"}">${done?"✓":""}</span>
        <span><span class="lr-title">${l.title}</span><span class="zh-term">${l.zh}</span><br><span class="lr-sub">${l.sub}</span></span>
        <span class="lr-go">›</span></button>`;
    }).join("");
    const ur = (typeof UNIT_READS!=="undefined" && UNIT_READS[u.id])
      ? `<button class="ur-entry" onclick="location.hash='#/unitread/${u.id}'">📖 題組閱讀 Unit Reading ─ ${UNIT_READS[u.id].genre}：${UNIT_READS[u.id].zh}</button>` : "";
    return `<div class="unit"><div class="unit-h"><span class="u-eyebrow">${u.n}</span><h2 class="section" style="margin:0">${u.name}</h2></div><div class="card">${rows}</div>${ur}</div>`;
  }).join("");
  app.innerHTML = `<div class="view">
    <div class="crumb"><a href="#/home">Home</a> › ${lv.name}</div>
    <div class="eyebrow">${lv.name} level</div>
    <h1 class="display">${lv.name} Grammar<span class="zh-term-lg">${lv.zh}文法</span></h1>
    <p class="lede" style="margin-bottom:10px">${lv.desc}</p>
    <div class="prog-row" style="max-width:340px;margin-bottom:30px"><div class="prog-bar"><div class="prog-fill" style="width:${p.pct}%"></div></div><span class="prog-num">${p.done} of ${p.total} complete</span></div>
    <div class="cat-hero">${catSVG(74, CAT_OF[lvl])}<div class="cat-bubble"><span class="cb-name">${CAT_NAME[lvl]}</span>${CAT_MSG[lvl]}</div></div>
    ${units}
  </div>`;
}

/* =====================================================
   Views — Lesson
   ===================================================== */
function timelineHTML(tl){
  if(!tl) return "";
  const spans = (tl.spans||[]).map(s=>`<div class="tl-span" style="left:${s[0]}%;width:${s[1]-s[0]}%"></div>`).join("");
  const dots = (tl.dots||[]).map(x=>`<div class="tl-dot" style="left:${x}%"></div>`).join("");
  const labs = (tl.labels||[]).map(l=>`<div class="tl-lab" style="left:${l[0]+1}%">${l[1]}</div>`).join("");
  return `<div class="timeline-card"><div class="tc-l">On the timeline</div>
    <div class="tl"><div class="tl-line"></div>${spans}${dots}${labs}</div>
    <div style="font:400 12.5px var(--sans);color:#CBAD93;margin-top:10px">${tl.cap||""}</div></div>`;
}
function renderLesson(id){
  const l = lessonById(id), u = unitOf(l), lv = levelById(u.level);
  const siblings = DATA.lessons.filter(x=>x.unit===u.id);
  const sideItems = siblings.map(x=>{
    const done = !!store.data.completed[x.id];
    const cur = x.id===id;
    return `<button class="lsb-item ${cur?"current":""}" onclick="location.hash='#/lesson/${x.id}'">
      <span class="lsb-dot ${done?"done":cur?"open":"todo"}">${done?"✓":""}</span><span>${x.title}<br><span style="font:400 11.5px var(--sans);color:var(--teal)">${x.zh}</span></span></button>`;
  }).join("");
  const uDone = siblings.filter(x=>store.data.completed[x.id]).length;
  const uses = l.uses.map(us=>`<div class="use"><h3>${us.t}</h3><div class="u-desc">${us.d}</div>
    <div class="ex-list">${us.ex.map(e=>`<div class="ex">${e.s}${e.n?`<span class="ex-note">${e.n}</span>`:""}</div>`).join("")}</div></div>`).join("");
  const mk = l.mistakes.map(m=>`<div class="mk"><div class="no">✗ ${m.no}</div><div class="yes">✓ ${m.yes}</div><div class="mk-why">${m.why}</div></div>`).join("");
  const idxAll = DATA.lessons.indexOf(l);
  const prev = DATA.lessons[idxAll-1], next = DATA.lessons[idxAll+1];
  app.innerHTML = `<div class="view">
    <div class="crumb"><a href="#/home">Home</a> › <a href="#/level/${lv.id}">${lv.name}</a> › ${l.title}</div>
    <div class="lesson-shell">
      <aside class="lsb">
        <div class="lsb-h">${u.n} · ${u.name}</div>
        ${sideItems}
        <div class="lsb-prog"><div style="font:600 12px var(--sans);color:var(--body);margin-bottom:8px">Unit progress</div>
          <div class="prog-bar"><div class="prog-fill" style="width:${Math.round(uDone/siblings.length*100)}%"></div></div>
          <div style="font:400 11.5px var(--sans);color:var(--muted);margin-top:6px">${uDone} of ${siblings.length} lessons complete</div></div>
        ${(()=>{ const gi = DATA.lessons.findIndex(x=>x.id===l.id), b = BREEDS[gi % BREEDS.length], met = !!store.data.completed[l.id];
          return `<div class="lsb-cat"><img src="${b.img}" alt="" class="${met?"":"sil"}">
            <div><div class="lc-t">Lesson cat 課程貓咪</div>
            <div class="lc-n">${met? b.en+"｜"+b.zh : "??? 完成練習就能認識牠"}</div></div></div>`; })()}
      </aside>
      <div class="lmain">
        <div class="eyebrow">${lv.name} · Lesson ${l.n}</div>
        <h1 class="display" style="font-size:32px">${l.title}<span class="zh-term-lg">${l.zh}</span></h1>
        <p class="lede" style="margin-bottom:24px">${l.sub}</p>
        <div class="formbox"><div class="fb-l">Form</div><div class="fb-p">${l.form.p}</div>
          <div class="fb-ex">${l.form.ex.map(e=>`<span>${e}</span>`).join("")}</div></div>
        ${timelineHTML(l.tl)}
        <h2 class="section">How to use it</h2>
        ${uses}
        <h2 class="section">Common mistakes</h2>
        <div class="mistakes">${mk}</div>
        <div class="tipbox cat-tip"><span>${catSVG(34, CAT_OF[unitOf(l).level])}</span><span><b>Cat tip 🐾</b> &nbsp;${l.tip}</span></div>
        <div class="lesson-foot">
          <div>
            ${prev?`<button class="btn btn-ghost" onclick="location.hash='#/lesson/${prev.id}'">← ${prev.title}</button>`:""}
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="location.hash='#/practice/${l.id}'">Practice this lesson →</button>
            <button class="btn btn-ghost" onclick="location.hash='#/worksheet/${l.id}'">🖨 Worksheet 學習單</button>
            ${next?`<button class="btn btn-ghost" onclick="location.hash='#/lesson/${next.id}'">${next.title} →</button>`:""}
          </div>
        </div>
      </div>
    </div>
    <div class="practice-sticky">
      <span class="ps-txt">${l.q.length} questions · ~3 min</span>
      <button class="btn btn-primary" onclick="location.hash='#/practice/${l.id}'">Practice →</button>
    </div>
  </div>`;
}

  c:{cefr:"C1–C2", zh:"高級", w:302,
   title:"Two Minutes of Darkness, Twenty-Seven Years in the Waiting",
   text:[
    "Total solar eclipses are, in strictly astronomical terms, unremarkable: somewhere on Earth, the Moon slides across the face of the Sun roughly every eighteen months. What makes the eclipse of 12 August 2026 significant is not the mechanics but the geography. For the first time since 1999, the Moon's darkest shadow will fall on mainland Europe.",
    "The path is an unusual one. Rather than sweeping conventionally from west to east, this shadow arcs up over the Arctic before descending through Greenland, western Iceland and the North Atlantic, finally reaching the Iberian Peninsula as the Sun approaches the horizon. Nowhere along that track will totality exceed roughly two and a half minutes; in Spain it will arrive in the last golden minutes before sunset, low enough that a poorly chosen hillside or an inconveniently placed building could erase the spectacle entirely.",
    "That fragility is precisely what draws people. Eclipse chasers speak of totality as categorically different from a partial eclipse — the common assumption that a 90 percent eclipse delivers 90 percent of the experience is, they insist, simply wrong. Only when the Sun's disc is fully covered does the corona, its faint outer atmosphere, become visible to the naked eye, and only then may that eye be safely uncovered.",
    "For researchers, those seconds remain scientifically valuable, offering a rare natural view of a region of the Sun that instruments otherwise struggle to isolate. For everyone else, the appeal is harder to quantify. Millions are expected to travel; hotels along the Spanish path were reportedly booked out months in advance. What they are paying for, in the end, is a couple of minutes in which the ordinary machinery of the sky briefly, and visibly, does something else."],

   q:[

     why:"第一段就直說：What makes the eclipse… significant is not the mechanics but the geography. 選項 A、C 都被文章明確反駁。"},
    {t:"推論 Inference", q:"Why does the writer open by calling total eclipses \u201cunremarkable\u201d?",
     opts:["To argue that nobody should bother watching","To set up a contrast that makes the real reason for interest clearer","To criticise astronomers","To suggest the 2026 eclipse may not happen"], a:1,
     why:"這是修辭策略：先降低「稀有」這個理由的份量（每 18 個月就有一次），再凸顯真正的重點是「這次落在歐洲本土」。是鋪陳對比，不是唱衰。"},

  b:{cefr:"B1–B2", zh:"中級", w:218,

   text:[
    "On 12 June, shares in SpaceX were sold to the public for the first time, in what became the largest initial public offering, or IPO, ever completed. The company raised roughly 75 billion dollars — far more than the previous record of about 29 billion, set by the oil company Saudi Aramco in 2019.",

  c:{cefr:"C1–C2", zh:"高級", w:305,
   title:"Pricing the Future: What a Record IPO Actually Measures",
   text:[
    "When SpaceX shares began trading on 12 June, the numbers did what record-breaking numbers usually do: they crowded out the more interesting question. Some 75 billion dollars was raised, comfortably eclipsing the 29 billion that Saudi Aramco had secured in 2019; the stock closed its first session 19 percent above its offer price; and Elon Musk, by virtue of his holdings in SpaceX and Tesla, was declared the world's first trillionaire. What none of these figures establishes is whether the valuation is sound.",
    "The case for caution is not difficult to assemble. A company founded in 2002 has, by its own account, accumulated losses exceeding 41 billion dollars, and only Starlink — the satellite internet arm — reliably generates profit. At roughly 94 times annual revenue, the valuation implies growth of an order that few firms in any sector have delivered. Compared with the multiples at which mature technology companies trade, the figure looks less like a measurement than an aspiration.",
    "The counter-argument, however, is not merely wishful. Investors in genuinely novel industries have rarely been pricing current earnings; they are pricing optionality — the possibility that a dominant launch provider becomes the infrastructure on which an entire orbital economy is eventually built. Whether that argument is prescient or self-serving cannot be settled by the share price on any given afternoon.",
    "What the debut does demonstrate, unambiguously, is appetite. Whatever their private reservations, enough investors were willing to commit capital at that price to make the offering the largest ever completed. Markets, in this sense, are not verdicts on the future; they are collections of bets on it. The distinction is easy to lose when the headline number is large enough — and this one was very large indeed."],

  c:{cefr:"C1–C2", zh:"高級", w:298,

   text:[

function rgGuessPOS(w){
  const s = w.toLowerCase();
  if(/ly$/.test(s)) return "adv";
  if(/(tion|ment|ity|ness|ance|ence|ship|hood)$/.test(s)) return "noun";
  if(/(ful|ive|ous|al|ic|able|ible)$/.test(s)) return "adj";
  if(/(ed|ing|ize|ise|fy)$/.test(s)) return "verb";
  return "noun";
}
function rgMatchCase(sample, word){
  if(/^[A-Z]/.test(sample) && !/^[A-Z]+$/.test(sample)) return word[0].toUpperCase()+word.slice(1);
  if(/^[A-Z]+$/.test(sample) && sample.length>1) return word.toUpperCase();
  return word;
}
function rgDistractor(word, used){
  const key = word.toLowerCase().replace(/[^a-z'-]/g,"");
  let cand = RG_BANK[key];
  if(cand && cand.includes(":")) cand = cand.split(":")[0];
  if(!cand){
    const pool = RG_POOL[rgGuessPOS(key)];
    const opts = pool.filter(p=>p!==key && !used.has(p));
    cand = opts.length ? opts[Math.floor(Math.random()*opts.length)] : pool[0];
  }
  used.add(cand.toLowerCase());
  return rgMatchCase(word, cand);
}

const RG_NUMWORD = new Set(("one two three four five six seven eight nine ten eleven twelve thirteen "+
 "fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty "+

function rgIsNumOrDate(lw){
  if(RG_NUMWORD.has(lw)) return true;
  const parts = lw.split("-");
  return parts.length>1 && parts.every(p=>RG_NUMWORD.has(p));
}
// 自動挑生難字：排除虛字/專有名詞/數字與日期，依長度與難度排序，依等級決定題數
function rgPickWords(paragraphs, level, proper, seed){
  const rand = rgSeeded(seed);
  const seen = new Map(); // lower -> first original-case token
  const re = /[A-Za-z][A-Za-z'-]*/g;
  paragraphs.forEach(p=>{
    let m; while((m = re.exec(p))){
      const w = m[0], lw = w.toLowerCase();
      if(!seen.has(lw)) seen.set(lw, w);
    }
  });
  const properLower = new Set((proper||[]).map(x=>x.toLowerCase()));
  const minLen = {a:5, b:5, c:6}[level] || 5;
  // 篩選條件：非虛字、非專有名詞、非數字/日期、長度達標
  let cands = [...seen.entries()].filter(([lw,w])=>
    lw.length>=minLen && !RG_STOP.has(lw) && !properLower.has(lw) && !rgIsNumOrDate(lw));
  // 難度分數：越長、越少見（不在 RG_BANK 代表較常見的簡單延伸詞也可，但優先挑有干擾字庫的字，品質較穩）
  cands.sort((a,b)=>{
    const score = ([lw]) => (RG_BANK[lw]?3:0) + lw.length;
    return score(b)-score(a) || (rand()-0.5);
  });
  const n = {a:4, b:6, c:8}[level] || 5;
  // 加一點隨機性：從前 n*2 名裡隨機取 n 個，避免每次都一模一樣又不失品質
  const topPool = cands.slice(0, Math.max(n*2, n));
  const picked = [];
  const idxs = topPool.map((_,i)=>i);
  while(picked.length < Math.min(n, topPool.length)){
    const j = Math.floor(rand()*idxs.length);
    picked.push(topPool[idxs[j]]);
    idxs.splice(j,1);
  }
  return picked.map(([lw,w])=>w);
}
function rgSeeded(seed){
  let s = seed>>>0 || 1;
  return function(){ s ^= s<<13; s ^= s>>>17; s ^= s<<5; s >>>= 0; return (s%100000)/100000; };
}
function rgEscapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
// 建立每段落的 segments（文字／干擾字），確保每個目標字只出現一次
function rgBuildParas(paragraphs, pairs){
  let remaining = pairs.slice();
  return paragraphs.map((p,pi)=>{
    const spans = [];
    remaining = remaining.filter(pair=>{
      const re = new RegExp("\\b"+rgEscapeRe(pair.correct)+"\\b","i");
      const m = re.exec(p);
      if(m){ spans.push({start:m.index, end:m.index+m[0].length, correct:pair.correct, wrong:pair.wrong, id:"rg"+pi+"-"+m.index}); return false; }
      return true;
    });
    spans.sort((a,b)=>a.start-b.start);
    const segs = []; let last = 0;
    spans.forEach(sp=>{
      if(sp.start>last) segs.push({type:"text", content:p.slice(last, sp.start)});
      segs.push({type:"wrong", content:sp.wrong, correct:sp.correct, id:sp.id});
      last = sp.end;
    });
    if(last<p.length) segs.push({type:"text", content:p.slice(last)});
    return segs;
  });
}
