const ISLAND_KINDS = ["black","cow","orange","gray","cream","choco","white","calico"];
function renderIsland(){
  const done = store.data.completed, streak = store.streakCount();
  const total = DATA.lessons.length, met = DATA.lessons.filter(l=>done[l.id]).length;
  const love = streak>=3;
  const secs = DATA.levels.map(lv=>{
    const ls = lessonsOf(lv.id), d = ls.filter(l=>done[l.id]).length;
    const tiles = ls.map(l=>{
      const gi = DATA.lessons.findIndex(x=>x.id===l.id);
      const b = BREEDS[gi % BREEDS.length];
      const un = !!done[l.id];
      return `<button class="cat-tile ${un?"unlocked":"locked"}${un&&love?" love":""}" title="${un? b.en+"｜"+b.zh+" · " : ""}${l.title}｜${l.zh}${un?"":"（完成這一課就能認識牠）"}" onclick="location.hash='#/lesson/${l.id}'">
        ${un? "" : '<span class="mystery">?</span>'}<img class="ct-img" src="${b.img}" alt="" loading="lazy">
        <span class="ct-breed">${un? b.en : "???"}</span><span class="ct-n">${l.n}</span></button>`;
    }).join("");
    return `<div class="isl-sec"><div class="isl-sec-h"><span>${lv.name} · ${lv.zh}</span><span>${d}/${ls.length}</span></div><div class="cat-grid">${tiles}</div></div>`;
  }).join("");
  app.innerHTML = `<div class="view">
    <div class="eyebrow">My cat island · 我的貓島</div>
    <h1 class="display">You've met ${met} of ${total} cats${met===total?" 🎉":""}</h1>
    <p class="lede">每完成一課（練習達 70 分），就會有一隻貓咪願意親近你。${love? `連續學習 ${streak} 天 — 貓咪們正在對你撒嬌！❤` : "連續學習 3 天以上，貓咪們會開始對你撒嬌喔。"}</p>
    <div class="isl-stats"><span class="isl-chip">◆ ${store.data.xp} XP</span><span class="isl-chip">🔥 ${streak}-day streak</span><span class="isl-chip">📒 ${Object.keys(store.data.mistakes||{}).length} to review</span></div>
    <div class="isl-board">${secs}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-primary" onclick="location.hash='#/game/review/all'">📒 Review mistakes 錯題複習</button>
      <button class="btn btn-ghost" onclick="location.hash='#/cheatsheet'">📋 Grammar cheatsheet 速查表</button>
      <button class="btn btn-ghost" onclick="location.hash='#/worksheets'">🖨 Worksheets 學習單</button>
    </div>
    <div class="card" style="padding:18px 22px;margin-top:18px">
      <div style="font:600 14px var(--sans);color:var(--navy);margin-bottom:10px">Progress backup · 進度備份</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportProgress()">⬇ Export 匯出</button>
        <label class="btn btn-ghost" style="cursor:pointer">⬆ Import 匯入<input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(event)"></label>
        <button class="btn btn-ghost" style="color:var(--bad)" onclick="resetProgress()">Reset 重置</button>
      </div>
      <p style="font:400 12.5px var(--sans);color:var(--muted);margin-top:10px">進度儲存在這台裝置的瀏覽器中。換裝置前先「匯出」存檔，再到新裝置「匯入」即可接續。</p>
    </div>

function exportProgress(){
  const blob = new Blob([JSON.stringify(store.data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "grammarpath-progress.json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("進度已匯出 ⬇");
}
function importProgress(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(typeof d!=="object" || d===null || typeof d.xp!=="number" || typeof d.completed!=="object") throw 0;
      store.data = Object.assign({xp:0, completed:{}, streak:{count:0,last:null}, best:{}, mistakes:{}}, d);
      store.save(); toast("進度匯入成功 🐾"); route();
    }catch(err){ toast("匯入失敗 — 檔案格式不正確"); }
  };
  r.readAsText(f);
}
function resetProgress(){
  if(!confirm("確定要清除所有進度嗎？此動作無法復原。\nReset ALL progress? This cannot be undone.")) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
}

function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay()||7));
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - y0)/86400000)+1)/7);
}
/* +1 偏移：使 2026 第 29 週（7/13–7/19）對到世界盃決賽，之後每週依序輪替 */
function weekArticle(){ return READINGS[(isoWeek(new Date())+1) % READINGS.length]; }
function rdById(id){ return READINGS.find(r=>r.id===id) || weekArticle(); }

let RG = null; // {id, lvl, pairs, paras, fixed:{}, selIdx:null, shakeId:null, flashIdx:null, rewarded:Set}
function rgBuild(id, lvl, reseed){
  const r = rdById(id); lvl = r.levels[lvl] ? lvl : "a";
  const seed = reseed || (Date.now() & 0xffff);
  const words = rgPickWords(r.levels[lvl].text, lvl, r.proper, seed);
  const used = new Set(words.map(w=>w.toLowerCase()));
  const pairs = words.map(w=>({correct:w, wrong:rgDistractor(w, used)}));
  const paras = rgBuildParas(r.levels[lvl].text, pairs);
  RG = {id, lvl, pairs, paras, seed, fixed:{}, selIdx:null, shakeId:null, flashIdx:null, rewarded:new Set()};
}
function rgShuffle(){ rgBuild(RG.id, RG.lvl, (Date.now()&0xffff)); renderReadGame(RG.id, RG.lvl); }
function rgSetLevel(lvl){ rgBuild(RG.id, lvl); renderReadGame(RG.id, lvl); }
function rgPlay(){
  if(!RG) return;
  tts.stop();                                   // also stops any playing mp3
  const r = rdById(RG.id), lvl = RG.lvl, lv = r.levels[lvl];
  const fallback = () => tts.speak(lv.text.join(" "), 0.88);
  const src = RD_AUDIO[r.id] && RD_AUDIO[r.id][lvl];
  if(src){
    const a = new Audio(src); rdAudioEl = a;
    a.onended = () => { if(rdAudioEl===a) rdAudioEl=null; };
    a.play().catch(() => { if(rdAudioEl===a){ rdAudioEl=null; fallback(); } });
    return;
  }
  fallback();
}
function rgSelectChip(i){
  if(RG.pairs[i].used) return;
  RG.selIdx = (RG.selIdx===i) ? null : i;
  renderReadGame(RG.id, RG.lvl, true);
}
function rgTryFix(segId, correct){
  if(RG.fixed[segId]) return;
  if(RG.selIdx===null){ toast("先在下面選一個單字 🔍"); return; }
  const chip = RG.pairs[RG.selIdx];
  if(chip.correct.toLowerCase() === correct.toLowerCase()){
    RG.fixed[segId] = chip.correct;
    chip.used = true;
    RG.selIdx = null;
    if(!RG.rewarded.has(segId)){ RG.rewarded.add(segId); store.addXP(1); }
    const total = RG.pairs.length, done = Object.keys(RG.fixed).length;
    if(done===total){ setTimeout(()=>{ store.addXP(3); toast("🎉 全部更正完畢！+3 XP"); }, 300); }
  } else {
    RG.shakeId = segId; RG.flashIdx = RG.selIdx;
    setTimeout(()=>{ RG.shakeId=null; RG.flashIdx=null; renderReadGame(RG.id, RG.lvl, true); }, 450);
  }
  renderReadGame(RG.id, RG.lvl, true);
}
function renderReadGame(id, lvl, keepScroll){
  const y = keepScroll ? window.scrollY : 0;
  if(!RG || RG.id!==id || (lvl && RG.lvl!==lvl)) rgBuild(id, lvl || RD_LEVEL || "a");
  const r = rdById(RG.id);
  const LET = "abcdefgh";
  const tabs = [["a","A1–A2"],["b","B1–B2"],["c","C1–C2"]]
    .map(t=>`<button class="rd-lv-tab ${RG.lvl===t[0]?"active":""}" onclick="rgSetLevel('${t[0]}')">${t[1]}</button>`).join("");
  const parasHTML = RG.paras.map(segs=>`<p class="rd-p" style="padding-left:0">${segs.map(seg=>{
    if(seg.type==="text") return esc(seg.content);
    const fixed = RG.fixed[seg.id];
    const shaking = RG.shakeId===seg.id;
    return `<span class="rg-blank ${fixed?"fixed pop":""} ${shaking?"shake":""}" onclick="rgTryFix('${seg.id}','${seg.correct.replace(/'/g,"\\'")}')">${fixed || esc(seg.content)}</span>`;
  }).join("")}</p>`).join("");
  const bank = RG.pairs.map((p,i)=>{
    const sel = RG.selIdx===i, used = !!p.used, flash = RG.flashIdx===i;
    return `<button class="rg-chip ${sel?"sel":""} ${used?"used":""} ${flash?"flash":""}" onclick="rgSelectChip(${i})">
      <span class="rg-let">${LET[i]}</span>${esc(p.correct)}</button>`;
  }).join("");
  const total = RG.pairs.length, done = Object.keys(RG.fixed).length;
  const speakBtn = `<button class="rg-playbtn" onclick="rgPlay()">🔊 播放全文</button><button class="btn btn-ghost" onclick="tts.stop()">⏹</button>`;

function rdStopAudio(){ if(rdAudioEl){ try{ rdAudioEl.pause(); }catch(e){} rdAudioEl.onended=null; try{ rdAudioEl.removeAttribute("src"); rdAudioEl.load(); }catch(e){} rdAudioEl=null; } }
function rdSpeak(id, li){
  tts.stop();                                   // also stops any playing mp3 (see tts.stop)
  const r = rdById(id), lv = r.levels[li];
  const fallback = () => tts.speak(lv.title + ". " + lv.text.join(" "), 0.92);
  const src = RD_AUDIO[id] && RD_AUDIO[id][li];
  if(src){
    const a = new Audio(src); rdAudioEl = a;
    a.onended = () => { if(rdAudioEl===a) rdAudioEl=null; };
    a.play().catch(() => { if(rdAudioEl===a){ rdAudioEl=null; fallback(); } });  // e.g. file missing
    return;
  }
  fallback();                                   // no mp3 yet → improved browser voice
}
/* Printable worksheet: opens a clean, self-contained page (article + glossary +
   MCQs + discussion) with a student/teacher toggle, then the browser print dialog. */
const rdEsc   = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const rdPlain = s => rdEsc(String(s==null?"":s).replace(/<[^>]*>/g,""));   // drop <b> etc, then escape
const RD_LET  = ["A","B","C","D","E","F"];
/* One printable worksheet block (a single article at a single level). */
function rdSheetHTML(r, lv){
  const paras   = lv.text.map(p=>`<p>${rdEsc(p)}</p>`).join("");
  const gloss   = (lv.gloss||[]).map(g=>`<span class="g"><b>${rdEsc(g[0])}</b> <i>${rdEsc(g[1])}</i> ${rdEsc(g[2])}</span>`).join("");
  const qs = (lv.q||[]).map((q,i)=>{
    const opts = (q.opts||[]).map((o,oi)=>`<div class="opt">(${RD_LET[oi]}) ${rdPlain(o)}</div>`).join("");
    return `<div class="q"><div class="qh"><span class="qn">${i+1}.</span> ${rdPlain(q.q)}<span class="qtag">${rdEsc(q.t)}</span></div><div class="opts">${opts}</div></div>`;
  }).join("");
  const answers = (lv.q||[]).map((q,i)=>`<div class="ak"><b>${i+1}. (${RD_LET[q.a]})</b> ${rdPlain(q.why)}</div>`).join("");
  const discuss = (r.discuss||[]).map(d=>`<li>${rdEsc(d)}</li>`).join("");
  return `<section class="sheet">
  <div class="name-row"><span>Name 姓名: ____________</span><span>Class 班級: ________</span><span>Date 日期: ________</span><span>Score 分數: ______</span></div>
  <h1>${rdPlain(lv.title)}</h1>
  <div class="meta"><span class="cefr">${rdEsc(lv.cefr)}</span>${rdEsc(r.topic)} · ${rdEsc(r.zh)} · 改寫自 ${rdEsc(r.src)}</div>
  <div class="article">${paras}</div>
  ${gloss?`<h2>Words 單字</h2><div class="gloss">${gloss}</div>`:""}
  <h2>Comprehension Questions 閱讀測驗</h2>
  ${qs}
  ${discuss?`<h2>Discussion 討論與延伸</h2><ol class="disc">${discuss}</ol>`:""}
  <div class="src-note">📰 Source 資料來源：改寫自 ${rdEsc(r.src)} 等媒體之公開報導（${rdEsc(r.date)}）。本文為依據事實重新撰寫的分級英文教學稿，非原文轉載，著作權歸原報導媒體所有。</div>

</section>`;
}

/* guideline geometry — balanced primary grid: the dashed x-height line sits

const ABC_G = { W:220, H:252, top:36, mid:108, base:180, desc:226 };
/* The strokes were authored on an older grid (30/75/185/229). Remap every y in a
   path 'd' onto the new grid so letters stay aligned to the lines. */
function abcMapY(y, upper){
  // Uppercase spans the full cap zone → map 30..185 linearly to top..base (keeps
  // round caps like C/O undistorted). Lowercase uses a piecewise map so x-height
  // features land exactly on the centred dashed midline.
  if(upper) return ABC_G.top + (y-30)*(ABC_G.base-ABC_G.top)/(185-30);
  const o = [30,75,185,229], n = [ABC_G.top, ABC_G.mid, ABC_G.base, ABC_G.desc];
  if(y <= o[0]) return n[0] + (y-o[0])*(n[1]-n[0])/(o[1]-o[0]);
  for(let i=0;i<o.length-1;i++){ if(y <= o[i+1]) return n[i] + (y-o[i])*(n[i+1]-n[i])/(o[i+1]-o[i]); }
  const k = o.length-1; return n[k] + (y-o[k])*(n[k]-n[k-1])/(o[k]-o[k-1]);
}
function abcRemapD(d, upper){
  return d.replace(/([MLC])([^MLC]*)/g, (m, cmd, args)=>{
    const nums = args.trim().split(/[ ,]+/).filter(s=>s!=="").map(Number);
    for(let i=1;i<nums.length;i+=2) nums[i] = +abcMapY(nums[i], upper).toFixed(1);
    return cmd + nums.join(" ");

}

  const vb = `${(bb.x1-pad).toFixed(1)} ${(bb.y1-pad).toFixed(1)} ${(bb.x2-bb.x1+pad*2).toFixed(1)} ${(bb.y2-bb.y1+pad*2).toFixed(1)}`;
  return `<svg viewBox="${vb}" height="${px||30}" style="vertical-align:-6px"><path d="${p.toPathData(2)}" fill="var(--navy)"/></svg>`;

function abcPathData(char){
  const f = abcFont, G = ABC_G;

  const size = (G.base - G.top) * upe / capH;         // caps span top→base
  let p = f.getPath(char, 0, G.base, size);
  const bb = p.getBoundingBox();

/* place numbered badges + start arrows from each stroke's start point & tangent */
function abcBuildMarks(canvas){
  const inks = [...canvas.querySelectorAll(".abc-ink")];
  const g = canvas.querySelector(".abc-marks");
  if(!g || g.dataset.built) return; g.dataset.built = "1";
  inks.forEach((p,i)=>{
    const L = p.getTotalLength(); if(!L) return;
    const p0 = p.getPointAtLength(0), p1 = p.getPointAtLength(Math.min(14,L));
    let dx = p1.x-p0.x, dy = p1.y-p0.y; const m = Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const nx = p0.x - dx*17 - dy*3, ny = p0.y - dy*17 + dx*3;   // badge sits behind the start
    g.insertAdjacentHTML("beforeend",                            // animation: number only, no arrow (pen shows direction)
      `<g class="abc-onum" data-i="${i}">`+
      `<circle class="abc-numbg" cx="${nx}" cy="${ny}" r="11"/>`+
      `<text class="abc-numtx" x="${nx}" y="${ny+4}" text-anchor="middle">${i+1}</text></g>`);
  });
}
/* Draw exactly ONE stroke (index) of a canvas, at a calm speed. */
function abcAnimOne(canvas, idx){
  const inks = [...canvas.querySelectorAll(".abc-ink")];
  const nums = [...canvas.querySelectorAll(".abc-onum")];
  const pen = canvas.querySelector(".abc-pen");
  if(idx>=inks.length) return;
  const p = inks[idx], L = p.getTotalLength();
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  if(nums[idx]) nums[idx].style.opacity = 1;
  const dur = Math.min(2400, Math.max(900, L*6));   // slower, calmer
  let t0 = null;
  const step = (t)=>{
    if(t0===null) t0 = t;
    const pr = Math.min(1,(t-t0)/dur);
    p.style.strokeDashoffset = L*(1-pr);
    if(pen){ const pt = p.getPointAtLength(L*pr); pen.setAttribute("cx",pt.x); pen.setAttribute("cy",pt.y); pen.style.opacity = pr<1?1:0; }
    if(pr<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function abcUpdateSlotBtn(which){

function abcResetSlot(which){
  const c = abcSlotCanvas(which); if(!c) return;
  c.querySelectorAll(".abc-ink").forEach(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; });
  c.querySelectorAll(".abc-onum").forEach(n=> n.style.opacity=0);
  const pen = c.querySelector(".abc-pen"); if(pen) pen.style.opacity=0;
  c.dataset.step = "0"; abcUpdateSlotBtn(which);

function abcStepSlot(which){
  const c = abcSlotCanvas(which); if(!c) return;
  const max = abcSlotMax(which); let step = +(c.dataset.step||0);
  if(step>=max){ abcResetSlot(which); return; }     // finished → reset for another look
  abcAnimOne(c, step); c.dataset.step = String(step+1); abcUpdateSlotBtn(which);

function abcPlaySlot(which){
  abcResetSlot(which);
  const run = ()=>{ const c = abcSlotCanvas(which); if(!c) return; if(+(c.dataset.step||0) >= abcSlotMax(which)) return; abcStepSlot(which); setTimeout(run, 1100); };
  run();

/* ---- printable trace worksheet (original layout) ---- */
/* --- static geometry helpers (parse the stroke 'd' strings; no DOM needed) --- */
function abcStrokeStart(d){ const m = d.match(/M\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/); return m ? [+m[1], +m[2]] : [110,110]; }
function abcStrokeDir(d){
  const n = (d.match(/-?[\d.]+/g)||[110,110,111,110]).map(Number);
  let dx = (n[2]??n[0]+1) - n[0], dy = (n[3]??n[1]) - n[1];
  const m = Math.hypot(dx,dy)||1; return [dx/m, dy/m];
}
/* Direction arrow at a stroke's start: straight for L strokes, curved for C strokes.
   Shaft starts a little past the start point so the red start-dot doesn't hide it. */
function abcArrowMarkup(d, color){
  color = color || "#E0533A";
  const m = d.match(/M\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*([CL])\s*([-\d.,\s]+)/);
  if(!m) return "";
  const p0 = [+m[1], +m[2]], cmd = m[3], r = (m[4].match(/-?[\d.]+/g)||[]).map(Number);
  const P = (t)=>{
    if(cmd==="C" && r.length>=6){ const mt=1-t, c1=[r[0],r[1]], c2=[r[2],r[3]], p1=[r[4],r[5]];
      return [mt*mt*mt*p0[0]+3*mt*mt*t*c1[0]+3*mt*t*t*c2[0]+t*t*t*p1[0],
              mt*mt*mt*p0[1]+3*mt*mt*t*c1[1]+3*mt*t*t*c2[1]+t*t*t*p1[1]]; }
    const p1=[r[0]??p0[0]+1, r[1]??p0[1]]; return [p0[0]+(p1[0]-p0[0])*t, p0[1]+(p1[1]-p0[1])*t];
  };
  const end = P(1), total = Math.hypot(end[0]-p0[0], end[1]-p0[1]) || 1;
  const t0 = Math.min(0.5, 15/total);                    // start past the dot
  const t1 = Math.min(0.95, t0 + Math.max(0.34, 46/total));
  const a = P(t0), tip = P(t1), pre = P(Math.max(t0, t1-0.1));
  let hx = tip[0]-pre[0], hy = tip[1]-pre[1]; const hl = Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
  const hln = 12, hw = 6.5;
  const base = [tip[0]-hx*hln, tip[1]-hy*hln];
  const tri = `${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${(base[0]-hy*hw).toFixed(1)},${(base[1]+hx*hw).toFixed(1)} ${(base[0]+hy*hw).toFixed(1)},${(base[1]-hx*hw).toFixed(1)}`;
  const shaft = (cmd==="C")
    ? (()=>{ const mid=P((t0+t1)/2); return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)} Q ${mid[0].toFixed(1)} ${mid[1].toFixed(1)} ${base[0].toFixed(1)} ${base[1].toFixed(1)}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`; })()
    : `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${base[0].toFixed(1)}" y2="${base[1].toFixed(1)}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`;
  return shaft + `<polygon points="${tri}" fill="${color}"/>`;
}
/* one glyph drawn from centreline strokes, in the ABC_G grid; options: dotted / marks / color */
function abcGlyphMarkup(char, o){
  o = o || {};
  const strokes = (LETTER_STROKES[char] || []).map(d=>abcRemapD(d, /[A-Z]/.test(char)));
  const dash = o.dotted ? ' stroke-dasharray="1 15"' : '';
  const paths = strokes.map(d=>`<path d="${d}" fill="none" stroke="${o.color||'#CFCFCF'}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"${dash}/>`).join("");
  let marks = "";
  if(o.marks){
    strokes.forEach((d,i)=>{
      const [x,y] = abcStrokeStart(d), [dx,dy] = abcStrokeDir(d);
      const nx = x - dx*18 - dy*3, ny = y - dy*18 + dx*3;
      marks += abcArrowMarkup(d)                                   // direction arrow (curved for C strokes)
            +  `<circle cx="${x}" cy="${y}" r="6" fill="#E0533A"/>`
            +  `<circle cx="${nx}" cy="${ny}" r="10" fill="#E0533A"/>`
            +  `<text x="${nx}" y="${ny+4}" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="12" font-weight="700">${i+1}</text>`;
    });
  } else if(o.dots){                                              // red start dot at each stroke (per trace letter)
    strokes.forEach(d=>{ const [x,y] = abcStrokeStart(d); marks += `<circle cx="${x}" cy="${y}" r="5" fill="#E0533A"/>`; });
  }
  return paths + marks;
}
/* a full trace+write ruled row for one character (model → dotted traces → blank write) */
function abcTraceRow(char){
  const G = ABC_G, W = 1180, H = 240, step = 150, cx0 = 80;
  const rule = `<line class="g s" x1="0" y1="${G.top}" x2="${W}" y2="${G.top}"/>`
    + `<line class="g d" x1="0" y1="${G.mid}" x2="${W}" y2="${G.mid}"/>`
    + `<line class="g b" x1="0" y1="${G.base}" x2="${W}" y2="${G.base}"/>`
    + `<line class="g d" x1="0" y1="${G.desc}" x2="${W}" y2="${G.desc}"/>`;
  const start = abcRemapD((LETTER_STROKES[char]||["M110 110"])[0], /[A-Z]/.test(char));
  const [sx, sy] = abcStrokeStart(start);
  let x = cx0, cells = "";
  cells += `<g transform="translate(${x-110},0)">${abcGlyphMarkup(char,{color:'#5A4232'})}</g>`; x += step;           // solid model
  for(let i=0;i<4;i++){ cells += `<g transform="translate(${x-110},0)">${abcGlyphMarkup(char, i===0?{dotted:true,marks:true}:{dotted:true,dots:true})}</g>`; x += step; }  // 1st numbered, rest with red start dots
  for(let i=0;i<2;i++){ cells += `<circle cx="${x-110+sx}" cy="${sy}" r="6" fill="#E0533A"/>`; x += step; }            // write: start dots only
  return `<svg class="trow" viewBox="0 38 ${W} 178">${rule}${cells}</svg>`;
}
/* letter-recognition grid: target (both cases) hidden among confusable distractors */
function abcCircleGrid(ch){
  const lo = ch.toLowerCase();
  const distract = "abdeghknopqABDEGHKNOPQ".split("").filter(c=> c!==ch && c!==lo);
  const pool = [];
  for(let i=0;i<6;i++) pool.push(Math.random()<0.5 ? ch : lo);
  while(pool.length<21) pool.push(distract[Math.floor(Math.random()*distract.length)]);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return `<div class="cgrid andika">${pool.map(c=>`<span>${c}</span>`).join("")}</div>`;
}
/* pencil-control warm-up patterns (dotted, to trace) — larger area */
function abcPatternRow(kind){
  const W=1000, H=150; let d="";
  if(kind==="zig"){ d="M20 126"; for(let x=20;x<=980;x+=64) d+=` L ${x+32} 22 L ${x+64} 126`; }
  else if(kind==="wave"){ d="M20 82"; for(let x=20;x<980;x+=72) d+=` Q ${x+36} 14 ${x+72} 82`; }
  else if(kind==="hump"){ d="M20 122"; for(let x=20;x<956;x+=80) d+=` C ${x+18} 20 ${x+62} 20 ${x+80} 122`; }
  else { d="M24 74"; for(let x=24;x<952;x+=72) d+=` C ${x+18} 118 ${x+54} 30 ${x+72} 74`; }   // loops
  return `<svg class="prow" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="#CBB89C" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 14"/></svg>`;
}
/* single word to trace on a ruled line */
function abcWordLine(word, dotted){
  const G = ABC_G, W = 1000;
  const rule = `<line class="g s" x1="0" y1="${G.top}" x2="${W}" y2="${G.top}"/>`
    + `<line class="g d" x1="0" y1="${G.mid}" x2="${W}" y2="${G.mid}"/>`
    + `<line class="g b" x1="0" y1="${G.base}" x2="${W}" y2="${G.base}"/>`
    + `<line class="g d" x1="0" y1="${G.desc}" x2="${W}" y2="${G.desc}"/>`;
  const txt = `<text x="30" y="${G.base}" font-family="AndikaPrint,'Comic Sans MS',sans-serif" font-size="98" letter-spacing="6" fill="${dotted?'#CFCFCF':'#5A4232'}">${word}</text>`;
  return `<svg class="trow" viewBox="0 52 ${W} 142">${rule}${txt}</svg>`;
}
function abcOrderStrip(ch){
  const i = ABC.indexOf(ch);
  const start = Math.max(0, Math.min(i-4, 17));         // 9-letter window, current near centre
  const seq = Array.from({length:9}, (_,k)=> ABC[start+k]);
  const cell = c => `<b class="${c===ch?'cur':''}">${c}</b>`;
  const dash = `<i>–</i>`;
  let rows = "";
  for(let r=0;r<3;r++){
    const row = seq.slice(r*3, r*3+3);
    rows += `<div class="orow">${(r>0?dash:"") + row.map(cell).join(dash) + (r<2?dash:"")}</div>`;
  }

}

/* ================= 會考聽力模擬 Listening Exam ================= */
let LX = null;
function speakSeq(list, rate){
  if(!tts.ok) return;
  speechSynthesis.cancel();
  list.forEach(item=>{
    const u = new SpeechSynthesisUtterance(item.t);
    u.lang = "en-US"; u.rate = rate || 0.92;
    u.pitch = item.v === 1 ? 1.35 : 1.0;
    if(tts.voice) u.voice = tts.voice;
    speechSynthesis.speak(u);
  });
}
function lxShuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function startListenExam(){
  const pick = (arr,n)=> lxShuffle(arr).slice(0,n);
  LX = { items:[
      ...pick(LX_DATA.p1,3).map(x=>({...x, part:1})),
      ...pick(LX_DATA.p2,3).map(x=>({...x, part:2})),
      ...pick(LX_DATA.p3,3).map(x=>({...x, part:3}))],
    i:0, right:0, picked:null, shown:false };
  renderListenQ();
}
function lxPlay(){
  const it = LX.items && LX.items[LX.i];
  if(!it) return;
  if(it.part===3) speakSeq(it.seq.concat(it.q?[{t:"Question: "+it.q, v:0}]:[]));
  else tts.speak(it.audio, 0.92);
}
function lxPick(oi){ if(LX.shown) return; LX.picked = oi; renderListenQ(); }
function lxConfirm(){
  const it = LX.items[LX.i];
  LX.shown = true;
  if(LX.picked === it.a){ LX.right++; store.data.xp += 2; store.save(); paintHeader(); }
  renderListenQ();
}
function lxNext(){
  LX.i++; LX.picked = null; LX.shown = false;
  if(LX.i >= LX.items.length){ renderListenDone(); } else renderListenQ();
}
const LX_PART = {1:["Part 1 辨識句意","聽句子，選出符合的圖片","🖼️"],2:["Part 2 基本問答","聽問句，選出最合適的回應","💬"],3:["Part 3 言談理解","聽對話或廣播，回答問題","🎧"]};
function renderListenQ(){
  if(!LX.items || LX.i >= LX.items.length){ renderListenDone(); return; }
  const it = LX.items[LX.i], P = LX_PART[it.part], LET = "ABC";
  const opts = it.opts.map((o,oi)=>{
    let cls = it.part===1 ? "lx-pic" : "rd-opt";
    if(LX.shown){ if(oi===it.a) cls+=" right"; else if(LX.picked===oi) cls+=" wrong"; }
    else if(LX.picked===oi) cls+=" picked";
    const inner = it.part===1 ? `<span class="lx-emoji">${o.replace(/\n/g,"<br>")}</span><span class="lx-let">${LET[oi]}</span>`
                              : `<span class="rd-let">${LET[oi]}</span>${o}`;
    return `<button class="${cls}" onclick="lxPick(${oi})">${inner}</button>`;
  }).join("");
  const fb = LX.shown ? `<div class="rd-why ${LX.picked===it.a?"ok":"no"}">${LX.picked===it.a?"✓ 答對了！+2 XP":"✗ 正確答案："+LET[it.a]}　${it.zh}${it.part!==1?`<div class="lx-script">📜 ${it.audio || it.seq.map(s=>s.t).join(" / ")}</div>`:""}</div>` : "";
  const cta = LX.shown
    ? `<button class="btn btn-primary" onclick="lxNext()">${LX.i+1>=LX.items.length?"看成績 →":"下一題 →"}</button>`
    : `<button class="btn btn-primary" ${LX.picked===null?"disabled":""} onclick="lxConfirm()">確定</button>`;
  app.innerHTML = `<div class="view lx-view">
    <div class="crumb"><a href="#/games">Games</a> › 會考聽力模擬</div>
    <div class="lx-part">${P[2]} ${P[0]}<span>${P[1]}</span></div>
    <div class="lx-prog">第 ${LX.i+1} / ${LX.items.length} 題</div>
    <div class="lx-playbox">
      <button class="lx-playbtn" onclick="lxPlay()">🔊 播放</button>
      <button class="btn btn-ghost" onclick="tts.stop();speechSynthesis.cancel()">⏹</button>
      <span class="lx-hint">可重複播放</span>
    </div>
    ${it.part===3 && it.q ? `<div class="rd-q-text" style="margin-bottom:8px">${it.q}</div>`:""}
    <div class="${it.part===1?"lx-pics":"rd-opts"}">${opts}</div>
    ${fb}
    <div class="rd-cta">${cta}</div>
  </div>`;
  setTimeout(lxPlay, 350);
}
function renderListenDone(){
  const total = LX.items.length, pct = Math.round(LX.right/total*100);
  const prev = store.data.best["listenexam"];
  if(!prev || parseInt(prev) < LX.right){ store.data.best["listenexam"] = LX.right + "/" + total; store.save(); }
  const msg = pct===100?"太完美了！滿分！🏆":pct>=70?"很棒！繼續保持 🎉":pct>=40?"不錯的開始，多聽幾次會更好 💪":"沒關係，聽力靠累積，再來一次吧 🐾";
  app.innerHTML = `<div class="view" style="text-align:center;padding-top:40px">
    ${catSVG(90,"orange")}
    <h1 class="display">聽力測驗結束</h1>
    <div class="rd-score" style="display:inline-block;font-size:22px;margin:12px 0">答對 ${LX.right} / ${total}　${pct}%</div>
    <p class="lede" style="max-width:420px;margin:8px auto">${msg}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-primary" onclick="startListenExam()">再測一回 ↻</button>
      <button class="btn btn-ghost" onclick="location.hash='#/games'">回遊戲區</button>
    </div></div>`;
}

/* ================= 口說跟讀 Speaking ================= */
const sr = {
  ok: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  rec:null, busy:false,
  start(onResult, onEnd){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR(); this.rec = r; this.busy = true;
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 5;
    r.onresult = e => { const alts = [...e.results[0]].map(a=>a.transcript); onResult(alts); };
    r.onerror = e => { this.busy = false; onEnd(e.error); };
    r.onend = () => { this.busy = false; onEnd(); };
    try{ r.start(); }catch(err){ this.busy = false; onEnd("start-failed"); }
  },
  stop(){ if(this.rec) try{ this.rec.stop(); }catch(e){} }
};
const srNorm = s => s.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
let SPK = { mode:"word", si:0, item:null, state:"idle", heard:null, ok:null, tries:0 };
function spkPickWord(){
  const g = PHONICS[Math.floor(Math.random()*PHONICS.length)];
  const it = g.items[Math.floor(Math.random()*g.items.length)];
  const w = it.words[Math.floor(Math.random()*it.words.length)];
  SPK.item = { text:w, sym:it.sym, tip:it.tip, gi:PHONICS.indexOf(g), ii:g.items.indexOf(it) };
}
function spkPickSent(){
  for(let t=0; t<24; t++){
    const l = DATA.lessons[Math.floor(Math.random()*DATA.lessons.length)];
    const u = l.uses[Math.floor(Math.random()*l.uses.length)];
    if(!u || !u.ex || !u.ex.length) continue;
    let s = u.ex[Math.floor(Math.random()*u.ex.length)];
    if(Array.isArray(s)) s = s[0];
    if(s && typeof s === "object" && typeof s.en === "string") s = s.en;
    if(typeof s !== "string") continue;
    s = s.replace(/<[^>]*>/g,"").trim();
    if(s.length < 4) continue;
    SPK.item = { text:s, lesson:l.title };
    return;
  }
  SPK.item = { text:"The cat is sleeping on the sofa.", lesson:"Practice" };
}
function spkNew(mode){
  SPK.mode = mode || SPK.mode;
  SPK.state = "idle"; SPK.heard = null; SPK.ok = null; SPK.tries = 0;
  if(SPK.mode === "word") spkPickWord(); else spkPickSent();
  rerenderSpeaking();
}
function spkListen(){ speak(SPK.item.text, SPK.mode==="word"?0.8:0.9); }
function spkRecord(){
  if(!sr.ok || sr.busy) return;
  SPK.state = "listening"; rerenderSpeaking();
  sr.start(alts => {
    SPK.heard = alts[0] || "";
    const target = srNorm(SPK.item.text);
    if(SPK.mode === "word"){
      SPK.ok = alts.some(a => srNorm(a) === target || srNorm(a).split(" ").includes(target));
    } else {
      const heard = srNorm(alts[0]||"").split(" ");
      const tw = target.split(" ");
      SPK.wordHits = tw.map(w => heard.includes(w));
      const hit = SPK.wordHits.filter(Boolean).length;
      SPK.ok = hit / tw.length >= 0.8;
      SPK.hitRate = Math.round(hit / tw.length * 100);
    }
    SPK.tries++;
    if(SPK.ok && SPK.tries === 1){ store.data.xp += 2; store.save(); paintHeader(); toast("+2 XP 🎤"); }
    SPK.state = "done"; rerenderSpeaking();
  }, err => {
    if(SPK.state === "listening"){ SPK.state = err ? "error" : "done"; SPK.err = err; rerenderSpeaking(); }
  });
}
function rerenderSpeaking(){ renderResources('speaking'); }
function spkHTML(){
  if(!SPK.item){ if(SPK.mode==="word") spkPickWord(); else spkPickSent(); }
  const tabs = `<div class="res-tabs" style="margin-top:4px">
    <button class="res-tab ${SPK.mode==="word"?"active":""}" onclick="spkNew('word')">🔤 單字跟讀</button>
    <button class="res-tab ${SPK.mode==="sent"?"active":""}" onclick="spkNew('sent')">📝 句子跟讀</button></div>`;
  let result = "";
  if(SPK.state === "listening") result = `<div class="spk-listening">🎙️ 請開始說… (對著麥克風念出上面的${SPK.mode==="word"?"單字":"句子"})</div>`;
  else if(SPK.state === "error") result = `<div class="rd-why no">⚠ 沒有收到聲音（${SPK.err||"error"}）。請確認已允許麥克風權限，再按一次 🎤。</div>`;
  else if(SPK.state === "done"){
    if(SPK.mode === "word"){
      result = `<div class="rd-why ${SPK.ok?"ok":"no"}">${SPK.ok?"✓ 發音正確！":"✗ 再試一次"}　辨識結果：「${SPK.heard||"(聽不清楚)"}」${!SPK.ok?"　💡 "+(SPK.item.tip||"對照口型動畫再念一次"):""}</div>`;
    } else {
      const words = srNorm(SPK.item.text).split(" ").map((w,i)=>`<span class="spk-w ${SPK.wordHits&&SPK.wordHits[i]?"hit":"miss"}">${w}</span>`).join(" ");
      result = `<div class="rd-why ${SPK.ok?"ok":"no"}">${SPK.ok?`✓ 很棒！命中率 ${SPK.hitRate}%`:`✗ 命中率 ${SPK.hitRate}%，綠色是有念對的字`}<div class="spk-words">${words}</div>辨識結果：「${SPK.heard||"(聽不清楚)"}」</div>`;
    }
  }
  const mouthLink = SPK.mode==="word" && SPK.item.sym ? `<a class="spk-mouth-link" href="#/resources/phonics" onclick="PH_FILTER='all';PH_OPEN='${SPK.item.gi}-${SPK.item.ii}'">👄 看「${SPK.item.sym}」的口型動畫 →</a>` : "";
  return `<div class="spk-box">
    ${tabs}
    <p class="lede" style="margin:10px 0 6px">先按 🔊 聽示範，再按 🎤 跟著念。${sr.ok?"":"<b>⚠ 此瀏覽器不支援語音辨識，請改用 Chrome 或 Safari。</b>"}</p>
    <div class="spk-card">
      <div class="spk-target">${SPK.item.text}</div>
      ${SPK.mode==="word"?`<div class="spk-sub">${SPK.item.sym||""}</div>`:`<div class="spk-sub">出自：${SPK.item.lesson||""}</div>`}
      <div class="spk-btns">
        <button class="btn btn-ghost" onclick="spkListen()">🔊 聽示範</button>
        <button class="spk-mic ${SPK.state==="listening"?"live":""}" ${sr.ok?"":"disabled"} onclick="spkRecord()">🎤</button>
        <button class="btn btn-ghost" onclick="spkNew()">換一題 ↻</button>
      </div>
      ${mouthLink}
    </div>
    ${result}
  </div>`;
}

function mouthGeo(m){
  return {
    rx: Math.max(3.5, 10 + m.s*12 - m.r*4 + m.o*4),
    ry: Math.max(2.5, 2 + m.o*16)
  };
}
// 正面口型：嘴唇圈 + 開口 + 牙齒；用 CSS keyframes 動畫（尊重 reduced-motion）
function mouthSVG(uid, m, m2){
  const rest = {rx:11, ry:3};
  const a = mouthGeo(m), b = m2 ? mouthGeo(m2) : null;
  const kf = (pre, pad) => {
    const f = g => `rx:${(g.rx+pad).toFixed(1)}px;ry:${(g.ry+pad).toFixed(1)}px`;
    return b
      ? `@keyframes ${pre}${uid}{0%,10%{${f(rest)}}35%,45%{${f(a)}}65%,80%{${f(b)}}95%,100%{${f(rest)}}}`
      : `@keyframes ${pre}${uid}{0%,12%{${f(rest)}}40%,72%{${f(a)}}95%,100%{${f(rest)}}}`;
  };
  const dur = b ? "3.2s" : "2.6s";
  const css = `${kf("mo",0)}${kf("ml",4)}
    .mo${uid}{animation:mo${uid} ${dur} ease-in-out infinite}
    .ml${uid}{animation:ml${uid} ${dur} ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){
      .mo${uid}{animation:none;rx:${a.rx.toFixed(1)}px;ry:${a.ry.toFixed(1)}px}
      .ml${uid}{animation:none;rx:${(a.rx+4).toFixed(1)}px;ry:${(a.ry+4).toFixed(1)}px}}`;
  const tongueTip = (m.sp==="tongue-out")
    ? `<ellipse cx="60" cy="47" rx="8" ry="3.2" fill="#E48A96" stroke="#D07A86" stroke-width=".7"/>` : "";
  const lipTeeth = (m.sp==="lip-teeth")
    ? `<rect x="47" y="41" width="26" height="5" rx="1.5" fill="#FFFDF9" stroke="#E6D8C4" stroke-width=".6"/>` : "";

function wsFixSpot(q){
  const t = q.sent.split(" "), f = t.slice(); f[q.wrong] = q.fix;
  const clean = a => a.join(" ").replace(/\s+([.,!?])/g, "$1");
  return {s: clean(t), fix: clean(f)};
}
function wsData(l){
  const w = WORKSHEETS[l.id] || {};
  const dedupe = (arr, key) => { const seen = new Set(); return arr.filter(x=>{
    const k = key(x).toLowerCase().replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
    if(seen.has(k)) return false; seen.add(k); return true; }); };
  const mcq = dedupe([...(w.mcq||[]), ...l.q.filter(q=>q.t==="mcq").map(q=>({q:q.q, opts:q.opts, a:q.a}))], x=>x.q).slice(0,9);
  const fill = dedupe([...(w.fill||[]), ...l.q.filter(q=>q.t==="fill").map(q=>({q:q.q, ans:q.ans[0]}))], x=>x.q).slice(0,9);
  const err = dedupe([...(w.err||[]), ...l.q.filter(q=>q.t==="spot").map(wsFixSpot)], x=>x.s).slice(0,9);
  const scr = l.q.filter(q=>q.t==="order").map(q=>({words:q.words.slice().sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:1), sent:q.sent}));
  const tr = (w.tr||[]);
  return {mcq, fill, err, scr, tr, extra:(w.extra||[])};
}
function wsSec(letter, en, zh, instr, inner){
  return `<div class="ws-sec"><div class="ws-sec-h"><span class="ws-let">${letter}</span> ${en} <span class="ws-sec-zh">${zh}</span></div>
    <div class="ws-instr">${instr}</div>${inner}</div>`;
}

let gameLevel = "all";
function renderGames(){
  const chips = [{id:"all",name:"All levels"}].concat(DATA.levels).map(lv=>
    `<button class="chip ${gameLevel===lv.id?"active":""}" onclick="gameLevel='${lv.id}';renderGames()">${lv.name}</button>`).join("");
  const cards = GAME_TYPES.map(g=>{
    const best = store.data.best[g.id+"-"+gameLevel];
    return `<button class="card game-card" onclick="location.hash='#/game/${g.id}/${gameLevel}'">
      <div class="gc-icon" style="background:${g.bg}">${g.icon}</div>
      <h3>${g.name}</h3><p>${g.d}</p>
      <span class="gc-best">${best?("Best: "+best):"Not played yet"}</span></button>`;
  }).join("");
  const lxCard = `<button class="card game-card" onclick="location.hash='#/listenexam'">
      <div class="gc-icon" style="background:#E4F1EE">🎧</div>
      <h3>會考聽力模擬 Listening Exam</h3><p>三大題型：辨識句意（看圖選答）、基本問答、言談理解。每回 9 題，兩位說話者的對話用不同音高播放。</p>
      <span class="gc-best">${store.data.best["listenexam"]?("Best: "+store.data.best["listenexam"]):"Not played yet"}</span></button>`;
  const mc = Object.keys(store.data.mistakes||{}).length;
  const reviewCard = `<button class="card game-card" onclick="location.hash='#/game/review/all'">
      <div class="gc-icon" style="background:#F4E7EE">📒</div>
      <h3>Review mistakes 錯題複習</h3><p>Questions you missed come back until you beat them — answer right to clear them.</p>
      <span class="gc-best">${mc? mc+" question"+(mc>1?"s":"")+" waiting":"Notebook empty — nice! 🐾"}</span></button>`;
  app.innerHTML = `<div class="view">
    <div class="eyebrow">Practice games</div>
    <h1 class="display">Play your way to fluency</h1>
    <p class="lede">Every game pulls questions from the lessons — pick a level, pick a game, and earn XP for each correct answer.</p>
    <div class="picker">${chips}</div>
    <div class="games-grid">${cards}${lxCard}${reviewCard}</div>
  </div>`;
}

/* =====================================================
   Question engine (shared by practice + games)
   ===================================================== */
function poolFor(level, type){
  let ls = level==="all" ? DATA.lessons : lessonsOf(level);
  let qs = [];
  ls.forEach(l=> l.q.forEach((q,qi)=> qs.push(Object.assign({lesson:l.title+(l.zh?"｜"+l.zh:""), ref:l.id+":"+qi}, q))));
  if(type==="listen") qs = qs.filter(q=>q.t==="fill"||q.t==="order");
  else if(type && type!=="timed") qs = qs.filter(q=>q.t===type);
  if(type==="timed") qs = qs.filter(q=>q.t!=="order");
  return shuffle(qs);
}

const S = {}; // current session
function startPractice(id){
  const l = lessonById(id);
  Object.assign(S, {mode:"practice", lessonId:id, qs:shuffle(l.q.map((q,qi)=>Object.assign({ref:id+":"+qi}, q))), i:0, right:0, results:[], listen:false, title:"Practice · "+l.title+"｜"+l.zh, timed:false});
  renderQuestion();
}
function refQ(ref){
  const parts = ref.split(":"), l = lessonById(parts[0]), qi = +parts[1];
  if(!l || !l.q[qi]) return null;
  return Object.assign({lesson:l.title+"｜"+l.zh, ref}, l.q[qi]);
}
function startReview(){
  const refs = Object.keys(store.data.mistakes||{});
  const qs = shuffle(refs.map(refQ).filter(Boolean)).slice(0,10);
  if(!qs.length){ toast("錯題本是空的 — 太棒了喵！🐾"); location.hash = "#/games"; return; }
  Object.assign(S, {mode:"game", type:"review", level:"all", listen:false, qs, i:0, right:0, results:[],
    title:"Review 錯題複習", timed:false});
  renderQuestion();
}
function replayMissed(){
  const missed = S.qs.filter((q,ix)=>S.results[ix]===false);
  if(!missed.length) return;
  Object.assign(S, {mode:"game", type:"review", level:"all", listen:false, qs:shuffle(missed), i:0, right:0, results:[],
    title:"Missed questions ↻", timed:false});
  renderQuestion();
}
function startGame(type, level){
  if(type==="review"){ startReview(); return; }
  if(type==="timed"){
    Object.assign(S, {mode:"timed", type, level, qs:poolFor(level,"timed"), i:0, right:0, results:[], listen:false, score:0, combo:0,
      title:"Timed challenge · "+(level==="all"?"All levels":levelById(level).name), timed:true, timeLeft:60});
    renderQuestion(); startTimer();
  } else {
    const qs = poolFor(level, type).slice(0,10);
    const gname = GAME_TYPES.find(g=>g.id===type).name;
    Object.assign(S, {mode:"game", type, level, qs, i:0, right:0, results:[],
      listen:(type==="listen"), title:gname+" · "+(level==="all"?"All levels":levelById(level).name), timed:false});
    renderQuestion();
  }
}
function startTimer(){
  clearInterval(S.timer);
  S.timer = setInterval(()=>{
    S.timeLeft--;
    const f = $("#timerFill"), n = $("#timerNum");
    if(f){ f.style.width = (S.timeLeft/60*100)+"%"; f.classList.toggle("low", S.timeLeft<=10); }
    if(n) n.textContent = S.timeLeft+"s";
    if(S.timeLeft<=0){ clearInterval(S.timer); finishSession(); }
  },1000);
}

/* =====================================================
   Question rendering
   ===================================================== */
const TYPE_LABEL = {mcq:"Multiple choice", fill:"Fill in the blank", order:"Sentence builder", spot:"Find the mistake"};
function qHead(){
  const dots = S.qs.slice(0, S.timed? Math.min(S.qs.length, 0) : S.qs.length).map((q,ix)=>{
    const r = S.results[ix];
    return `<span class="qdot ${ix===S.i?"cur":r===true?"ok":r===false?"bad":""}"></span>`;
  }).join("");
  const timer = S.timed ? `<div class="timer-wrap"><span class="combo" id="comboPill">×${1+Math.min(S.combo,4)*0.5} combo</span>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:${S.timeLeft/60*100}%"></div></div>
    <span class="timer-num" id="timerNum">${S.timeLeft}s</span></div>` : `<div class="qdots">${dots}</div>`;
  return `<div class="play-head"><span class="ph-title">${S.title}${S.timed? " · Score "+S.score : ""}</span>${timer}</div>`;
}
function renderQuestion(){
  tts.stop();
  if(S.i >= S.qs.length){ finishSession(); return; }
  const q = S.qs[S.i];
  let body = "";
  if(q.t==="mcq"){
    const prompt = esc(q.q).replace(/___/g,'<span class="blank">&nbsp;</span>');
    body = `<div class="qprompt">${prompt}</div><div class="opts">${q.opts.map((o,ix)=>
      `<button class="opt" data-ix="${ix}" onclick="answerMCQ(${ix})"><span class="key">${"ABCD"[ix]}</span>${esc(o)}</button>`).join("")}</div>`;
  }
  else if(q.t==="fill"){
    const prompt = esc(q.q).replace(/___/g,'<span class="blank">&nbsp;</span>');
    body = `<div class="qprompt">${prompt}</div>
      <div class="fill-row"><input class="fill-input" id="fillInput" autocomplete="off" autocapitalize="off" placeholder="Type the missing word(s)…" onkeydown="if(event.key==='Enter')answerFill()">
      <button class="btn btn-primary" id="fillBtn" onclick="answerFill()">Check</button></div>
      ${q.hint?`<div class="hint">Hint: ${esc(q.hint)}</div>`:""}`;
  }
  else if(q.t==="order"){
    S.built = [];
    S.bank = shuffle(q.words.map((w,ix)=>({w,ix})));
    body = `<div class="qprompt" style="font-size:16px;font-family:var(--sans);color:var(--body)">${S.listen? "🎧 Listen, then tap the words to build the sentence you heard:" : "Tap the words to build the sentence:"}</div>
      <div class="built" id="builtRow"></div><div class="bank" id="bankRow"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-ghost" onclick="undoWord()">↩ Undo</button>
        <button class="btn btn-primary" onclick="answerOrder()">Check sentence</button></div>`;
  }
  else if(q.t==="spot"){
    const words = q.sent.split(" ");
    body = `<div class="qprompt" style="font-size:16px;font-family:var(--sans);color:var(--body)">One word is wrong — tap it:</div>
      <div class="spot-sent">${words.map((w,ix)=>`<button class="spot-w" data-ix="${ix}" onclick="answerSpot(${ix})">${esc(w)}</button>`).join("")}</div>`;
  }
  const listenNote = q.t==="fill" ? "Hear the full sentence, then type the missing word."
                   : q.t==="order" ? "Hear the sentence, then build it."
                   : q.t==="spot" ? "Hear the sentence read aloud." : "Hear the question read aloud.";
  const listenRow = tts.ok ? `<div class="listen-row">
      <button class="btn-listen" onclick="playQ()">🔊 Listen</button>
      <button class="btn-listen" onclick="playQ(0.62)">🐢 Slow</button>
      <span class="listen-note">${listenNote}</span></div>` : "";
  app.innerHTML = `<div class="view play">${qHead()}
    <div class="card qcard"><div class="qtype">${S.listen?"🎧 ":""}${TYPE_LABEL[q.t]}${q.lesson?` · ${q.lesson}`:""}</div>${body}
    ${listenRow}
    <div id="fbSlot"></div></div>
    <div class="play-foot">
      <button class="btn btn-ghost" onclick="quitSession()">Quit</button>
      <span id="nextSlot"></span>
    </div></div>`;
  if(q.t==="order") paintOrder();
  if(q.t==="fill") setTimeout(()=>{const el=$("#fillInput"); if(el) el.focus();},50);
  if(S.listen) setTimeout(()=>playQ(), 400);
}
function paintOrder(){
  $("#builtRow").innerHTML = S.built.map((b,ix)=>`<button class="word" onclick="removeWord(${ix})">${esc(b.w)}</button>`).join("") || `<span style="color:var(--muted);font-size:13px;align-self:center">Your sentence appears here…</span>`;
  $("#bankRow").innerHTML = S.bank.map((b,ix)=> b.used? `<button class="word" disabled>${esc(b.w)}</button>` : `<button class="word" onclick="pickWord(${ix})">${esc(b.w)}</button>`).join("");
}
function pickWord(ix){ const b=S.bank[ix]; if(b.used) return; b.used=true; S.built.push(b); paintOrder(); }
function removeWord(ix){ const b=S.built.splice(ix,1)[0]; b.used=false; paintOrder(); }
function undoWord(){ if(S.built.length){ removeWord(S.built.length-1); } }

/* ---------- answers ---------- */
function settle(ok, feedbackHTML, disable){
  const q = S.qs[S.i];
  S.results[S.i] = ok;
  if(ok){ S.right++; }
  if(q.ref){
    store.data.mistakes = store.data.mistakes || {};
    if(!ok) store.data.mistakes[q.ref] = (store.data.mistakes[q.ref]||0)+1;
    else if(store.data.mistakes[q.ref]) delete store.data.mistakes[q.ref];
    store.save();
  }
  if(S.timed){
    if(ok){ S.combo++; const mult = 1+Math.min(S.combo-1,8)*0.5; S.score += Math.round(10*mult); }
    else S.combo = 0;
    const cp = $("#comboPill"); if(cp) cp.textContent = "×"+(1+Math.min(S.combo,8)*0.5)+" combo";
  }
  if(disable) disable();
  const cat = !!catLevelNow();
  const okMsg = cat? CAT_PRAISE[Math.floor(Math.random()*CAT_PRAISE.length)] : "Correct!";
  const badMsg = cat? CAT_OOPS[Math.floor(Math.random()*CAT_OOPS.length)] : "Not quite.";
  $("#fbSlot").innerHTML = `<div class="feedback ${ok?"good":"bad"}"><span>${ok?"✓":"✗"}</span><span><b>${ok?okMsg:badMsg}</b> ${q.why||""}</span></div>`;
  if(S.timed){
    setTimeout(nextQ, ok? 650 : 1400);
  } else {
    $("#nextSlot").innerHTML = `<button class="btn btn-primary" id="nextBtn" onclick="nextQ()">${S.i+1>=S.qs.length? "See results":"Next"} →</button>`;
    $("#nextBtn").focus();
  }
}
function nextQ(){ S.i++; renderQuestion(); }
function answerMCQ(ix){
  const q = S.qs[S.i];
  settle(ix===q.a, null, ()=>{
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled = true;
      const bix = +b.dataset.ix;
      if(bix===q.a) b.classList.add("correct");
      else if(bix===ix) b.classList.add("wrong");
    });
  });
}
function answerFill(){
  const q = S.qs[S.i], el = $("#fillInput");
  if(!el || el.disabled) return;
  const v = norm(el.value);
  if(!v){ el.focus(); return; }
  const ok = q.ans.some(a=> norm(a)===v);
  settle(ok, null, ()=>{
    el.disabled = true; $("#fillBtn").disabled = true;
    el.classList.add(ok?"ok":"bad");
    if(!ok) el.value = el.value + "   →  " + q.ans[0];
  });
}
function answerOrder(){
  const q = S.qs[S.i];
  const attempt = S.built.map(b=>b.w).join(" ");
  const ok = norm(attempt) === norm(q.sent);
  settle(ok, null, ()=>{
    document.querySelectorAll("#builtRow .word, #bankRow .word").forEach(b=>b.disabled=true);
    if(!ok) $("#builtRow").insertAdjacentHTML("afterend", `<div class="hint" style="margin:6px 0 10px">Correct order: <b style="color:var(--navy)">${esc(q.sent)}</b></div>`);
  });
}
function answerSpot(ix){
  const q = S.qs[S.i];
  const ok = ix===q.wrong;
  settle(ok, null, ()=>{
    document.querySelectorAll(".spot-w").forEach(b=>{
      const bix = +b.dataset.ix;
      b.disabled = true;
      if(bix===q.wrong) b.classList.add(ok?"ok":"bad");
      if(!ok && bix===ix) b.classList.add("bad");
    });
    $("#fbSlot").insertAdjacentHTML("beforebegin", `<div class="hint">Fix: <b style="color:var(--good)">${esc(q.fix)}</b></div>`);
  });
}
function quitSession(){ clearInterval(S.timer);
  location.hash = S.mode==="practice" ? "#/lesson/"+S.lessonId : "#/games"; }

/* =====================================================
   Results
   ===================================================== */
function finishSession(){
  clearInterval(S.timer);
  store.touchStreak();
  const answered = S.results.filter(r=>r!==undefined).length;
  const pct = answered? Math.round(S.right/answered*100) : 0;
  let xp = 0, headline = "", sub = "", bestNote = "";
  if(S.mode==="timed"){
    xp = Math.round(S.score/2);
    headline = "Time's up!";
    sub = `You answered ${answered} questions and scored <b>${S.score}</b> points.`;
    if(store.setBest("timed-"+S.level, S.score)) bestNote = "🏆 New personal best!";
  } else {
    xp = S.right*5 + (pct===100? 15:0);
    if(catLevelNow()) headline = pct===100? "Purr-fect round! 🐱" : pct>=70? "Paw-some work! 🐾" : "Keep going — meow! 😺";
    else headline = pct===100? "Perfect round!" : pct>=70? "Nice work!" : "Keep practicing!";
    sub = `You got <b>${S.right} of ${answered}</b> correct.`;
    if(S.mode==="game" && store.setBest(S.type+"-"+S.level, pct)) bestNote = "🏆 New personal best!";
    if(S.mode==="practice" && pct>=70){
      S.newCat = !store.data.completed[S.lessonId];
      store.complete(S.lessonId); sub += " Lesson marked complete ✓";
    }
  }
  if(xp>0) store.addXP(xp);
  const R = 56, C = 2*Math.PI*R;
  const back = S.mode==="practice" ? `<button class="btn btn-ghost" onclick="location.hash='#/lesson/${S.lessonId}'">Back to lesson</button>`
                                   : `<button class="btn btn-ghost" onclick="location.hash='#/games'">All games</button>`;
  const again = S.mode==="practice" ? `<button class="btn btn-primary" onclick="startPractice('${S.lessonId}')">Try again</button>`
             : S.mode==="timed" ? `<button class="btn btn-primary" onclick="startGame('timed','${S.level}')">Play again</button>`
                                : `<button class="btn btn-primary" onclick="startGame('${S.type}','${S.level}')">Play again</button>`;
  const missedN = S.results.filter(r=>r===false).length;
  const missedBtn = (missedN>0 && S.mode!=="timed") ? `<button class="btn btn-navy" onclick="replayMissed()">Practice missed (${missedN}) ↻</button>` : "";
  let nextLesson = "";
  if(S.mode==="practice" && pct>=70){
    const idx = DATA.lessons.findIndex(l=>l.id===S.lessonId);
    const nl = DATA.lessons[idx+1];
    if(nl) nextLesson = `<button class="btn btn-navy" onclick="location.hash='#/lesson/${nl.id}'">Next: ${nl.title} →</button>`;
  }
  let unlockCard = "";
  if(S.newCat){
    const gi = DATA.lessons.findIndex(l=>l.id===S.lessonId), b = BREEDS[gi % BREEDS.length];
    unlockCard = `<div class="unlock-card"><img src="${b.img}" alt="${b.en}">
      <div><b>New cat friend! 認識新貓咪 🎉</b><br><span>${b.en}｜${b.zh}</span>
      <br><a href="#/island" style="font:600 12px var(--sans);color:var(--teal)">View your island →</a></div></div>`;
    S.newCat = false;
  }
  app.innerHTML = `<div class="view"><div class="card results">
    <div class="eyebrow">${S.title}</div>
    <h1 class="display" style="font-size:30px">${headline}</h1>
    <div class="res-ring"><svg width="132" height="132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="11"/>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--teal2)" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:stroke-dashoffset 1s ease"/></svg>
      <div class="pct">${S.mode==="timed"? S.score : pct+"%"}</div></div>
    <p style="font-size:15px">${sub}</p>
    ${bestNote? `<p style="font:600 14px var(--sans);color:var(--amber);margin-top:6px">${bestNote}</p>`:""}
    <div class="res-stats">
      <div><div class="n">+${xp}</div><div class="l">XP earned</div></div>
      <div><div class="n">${S.right}</div><div class="l">Correct</div></div>
      <div><div class="n">${answered-S.right}</div><div class="l">Missed</div></div>
    </div>
    ${unlockCard}<div class="res-cta">${back}${missedBtn}${again}${nextLesson}</div>
  </div></div>`;
  paintHeader();
}

route();
</script>
</body>
</html>
