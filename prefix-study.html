<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背字首字尾 Swipe Study</title>
<style>
  :root{
    --teal:#2C6E72; --teal-d:#235559; --gold:#C6892F; --cream:#FBF7EF;
    --ink:#2A2A28; --soft:#6b6b63; --paper:#ffffff; --line:#ece4d6;
    --green:#3f9d5a; --amber:#d08a2c; --red:#c6504f;
    --serif:"Georgia","Noto Serif TC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
  /* header */
  header{padding:12px 16px 6px;display:flex;flex-direction:column;gap:8px}
  .titlerow{display:flex;align-items:center;gap:8px}
  .titlerow a.back{font-size:13px;color:var(--teal);text-decoration:none;border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;background:#fff}
  h1{font:700 19px/1.1 var(--serif);margin:0;color:var(--teal)}
  h1 small{font:400 12px var(--sans);color:var(--soft);display:block;margin-top:2px}
  .scope{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .scope button{flex:1;border:0;background:transparent;font:600 13px var(--sans);color:var(--soft);
    padding:7px 4px;border-radius:999px;cursor:pointer}
  .scope button.on{background:var(--teal);color:#fff}
  .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--soft)}
  .bar{flex:1;height:7px;background:#eadfcd;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .35s}
  /* stage */
  .stage{flex:1;position:relative;margin:4px 14px 0;display:flex;align-items:center;justify-content:center}
  .card{position:absolute;width:min(90vw,360px);height:min(68vh,500px);background:var(--paper);
    border-radius:22px;box-shadow:0 10px 30px rgba(44,110,114,.18),0 2px 8px rgba(0,0,0,.08);
    border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
    touch-action:pan-y;user-select:none;cursor:grab;will-change:transform}
  .card.dragging{cursor:grabbing;transition:none}
  .card.leave{transition:transform .32s ease, opacity .32s ease}
  /* front */
  .c-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 18px 6px;min-height:0}
  .c-img{flex:1;min-height:0;max-width:86%;object-fit:contain}
  .c-suf{font:700 clamp(40px,13vw,72px)/1 var(--serif);color:var(--teal)}
  .c-term{font:700 clamp(22px,6vw,30px)/1.1 var(--serif);color:var(--teal);text-align:center}
  .c-tag{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.04em}
  .c-ask{font-size:13px;color:var(--soft);padding-bottom:12px;text-align:center}
  /* answer */
  .c-ans{display:none;flex-direction:column;gap:9px;padding:16px 18px;overflow:auto;flex:1}
  .card.revealed .c-top{display:none}
  .card.revealed .c-ans{display:flex}
  .a-term{font:700 22px var(--serif);color:var(--teal);text-align:center}
  .a-zh{font-size:16px;color:var(--ink);text-align:center;border-bottom:1px solid var(--line);padding-bottom:9px}
  .a-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .a-ex li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;line-height:1.3}
  .a-ex .w{font-size:18px}
  .a-ex .w b{color:var(--gold)}
  .a-ex .g{font-size:13px;color:var(--soft);white-space:nowrap}
  .a-note{font-size:12px;color:var(--red);line-height:1.4;background:#fdf0f0;border-radius:8px;padding:7px 9px}
  /* swipe overlays */
  .stamp{position:absolute;top:18px;font:800 20px var(--sans);padding:6px 12px;border-radius:10px;
    border:3px solid;opacity:0;transition:opacity .1s;pointer-events:none}
  .stamp.know{right:16px;color:var(--green);border-color:var(--green);transform:rotate(12deg)}
  .stamp.see{left:16px;color:var(--amber);border-color:var(--amber);transform:rotate(-12deg)}
  /* controls */
  .controls{display:flex;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .controls button{flex:1;border:0;border-radius:14px;padding:15px 8px;font:700 16px var(--sans);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
  .controls button small{font-weight:500;font-size:11px;opacity:.85}
  .btn-see{background:#fbeccb;color:#7a5410}
  .btn-know{background:var(--teal);color:#fff}
  .btn-again{background:#f3e7d3;color:#6b5324}
  .btn-got{background:var(--green);color:#fff}
  .hint{text-align:center;font-size:11.5px;color:var(--soft);padding:0 16px 6px}
  /* done screen */
  .done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;padding:24px}
  .done.show{display:flex}
  .done .big{font:700 24px var(--serif);color:var(--teal)}
  .done p{margin:0;color:var(--soft);font-size:14px;line-height:1.5}
  .done .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:6px}
  .done .acts button{border:0;border-radius:12px;padding:13px;font:700 15px var(--sans);cursor:pointer}
  .a-primary{background:var(--teal);color:#fff}
  .a-second{background:#fff;border:1px solid var(--line)!important;color:var(--ink)}
  .a-reset{background:transparent;color:var(--red);font-weight:600!important;font-size:13px!important}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--cream:#141716;--paper:#1e2220;--ink:#ecebe6;--soft:#9a9a90;
      --line:#2e332f;--teal:#5bb3b0;--teal-d:#3d8a88;--gold:#d7a24a}
    :root:not([data-theme="light"]) .btn-see{background:#3a3220;color:#e7c57e}
    :root:not([data-theme="light"]) .a-note{background:#2c1f1f}
    :root:not([data-theme="light"]) .titlerow a.back,:root:not([data-theme="light"]) .scope,
    :root:not([data-theme="light"]) .card{background:var(--paper)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titlerow">
      <a class="back" href="index.html#/prefixcards">← 翻卡</a>
      <h1>背字首字尾<small>Swipe Study · 右滑會了，左滑看答案</small></h1>
    </div>
    <div class="scope" id="scope">
      <button data-s="prefix" class="on">字首 Prefixes</button>
      <button data-s="suffix">字尾 Suffixes</button>
      <button data-s="all">全部 All</button>
    </div>
    <div class="prog"><span id="progTxt">—</span><span class="bar"><i id="progBar"></i></span></div>
  </header>

  <div class="stage" id="stage">
    <div class="done" id="done">
      <div class="big" id="doneBig">🎉</div>
      <p id="doneMsg"></p>
      <div class="acts" id="doneActs"></div>
    </div>
  </div>

  <div class="hint" id="hint">用手指左右滑卡片，或按下面的按鈕。鍵盤 ← → 也可以。</div>
  <div class="controls" id="controls">
    <button class="btn-see" id="btnLeft"></button>
    <button class="btn-know" id="btnRight"></button>
  </div>
</div>

<script>
/* ---------- data: 41 prefixes (with teacher's drawn pictures) ---------- */
const PREFIX_CARDS = [
 {p:"en- / em-", zh:"打造成～、在～裡面", ex:[["<b>en</b>able","使能夠"],["<b>en</b>large","使變大"],["<b>em</b>power","賦予力量"]]},
 {p:"in- / im-", zh:"在～裡面", ex:[["<b>in</b>clude","包含"],["<b>im</b>port","進口"],["<b>in</b>put","輸入"]]},
 {p:"ob-", zh:"朝向～、前往～", ex:[["<b>ob</b>ject","反對；物體"],["<b>ob</b>serve","觀察"],["<b>ob</b>stacle","障礙"]]},
 {p:"a-", zh:"朝向～、往～裡面", ex:[["<b>a</b>rise","升起"],["<b>a</b>side","在一旁"],["<b>a</b>shore","上岸"]]},
 {p:"ad-", zh:"朝向～、對著～", ex:[["<b>ad</b>vance","前進"],["<b>ad</b>apt","適應"],["<b>ad</b>just","調整"]]},
 {p:"counter-", zh:"相反地", ex:[["<b>counter</b>attack","反擊"],["<b>counter</b>act","抵消"],["<b>counter</b>clockwise","逆時針"]]},
 {p:"un-", zh:"不是～、相反動作", ex:[["<b>un</b>happy","不快樂"],["<b>un</b>lock","解開；打開"],["<b>un</b>fair","不公平"]]},
 {p:"dis-", zh:"不做～、不是～、離開", ex:[["<b>dis</b>like","不喜歡"],["<b>dis</b>agree","不同意"],["<b>dis</b>appear","消失"]]},
 {p:"de-", zh:"往下、離開、完全地", ex:[["<b>de</b>crease","減少"],["<b>de</b>scend","下降"],["<b>de</b>stroy","摧毀"]]},
 {p:"ab-", zh:"從～（離開）、不做～", ex:[["<b>ab</b>sent","缺席"],["<b>ab</b>normal","不正常的"],["<b>ab</b>sorb","吸收"]]},
 {p:"pre- / pro-", zh:"在～之前", ex:[["<b>pre</b>view","預覽"],["<b>pre</b>dict","預測"],["<b>pro</b>gress","前進；進步"]]},
 {p:"inter-", zh:"～之間、互相", ex:[["<b>inter</b>national","國際的"],["<b>inter</b>act","互動"],["<b>inter</b>view","面談"]]},
 {p:"ex- / e-", zh:"向外", ex:[["<b>ex</b>it","出口"],["<b>ex</b>port","輸出"],["<b>e</b>ject","彈出；逐出"]]},
 {p:"syn- / sym-", zh:"一起、同時、一樣地", ex:[["<b>sym</b>pathy","同情"],["<b>sym</b>bol","象徵"],["<b>syn</b>onym","同義字"]]},
 {p:"con- / com- / co-", zh:"一起、徹底地", ex:[["<b>con</b>nect","連接"],["<b>com</b>bine","結合"],["<b>co</b>operate","合作"]]},
 {p:"sur-", zh:"在上方、超越", ex:[["<b>sur</b>face","表面"],["<b>sur</b>pass","超越"],["<b>sur</b>round","包圍"]]},
 {p:"super-", zh:"在上方、超越", ex:[["<b>super</b>man","超人"],["<b>super</b>market","超級市場"],["<b>super</b>ior","較優秀的"]]},
 {p:"sub-", zh:"在～下方、其次", ex:[["<b>sub</b>marine","潛水艇"],["<b>sub</b>way","地鐵"],["<b>sub</b>title","字幕"]]},
 {p:"re-", zh:"再度、在後面、返回", ex:[["<b>re</b>turn","返回"],["<b>re</b>peat","重複"],["<b>re</b>view","複習"]]},
 {p:"for(e)-", zh:"在～之前", ex:[["<b>fore</b>cast","預報"],["<b>fore</b>see","預見"],["<b>fore</b>head","前額"]]},
 {p:"dou- / du-", zh:"二", ex:[["<b>dou</b>ble","兩倍的"],["<b>du</b>al","雙重的"],["<b>du</b>et","二重唱"]]},
 {p:"in- / im-", zh:"不是～（否定）", note:"與「在裡面」的 in- 同形不同義，看字義判斷。", ex:[["<b>in</b>correct","不正確的"],["<b>im</b>possible","不可能的"],["<b>in</b>visible","隱形的"]]},
 {p:"mis-", zh:"弄錯、弄壞", ex:[["<b>mis</b>take","錯誤"],["<b>mis</b>understand","誤解"],["<b>mis</b>spell","拼錯"]]},
 {p:"a-", zh:"沒有～、不是～（否定）", note:"與「朝向」的 a- 同形不同義。", ex:[["<b>a</b>typical","非典型的"],["<b>a</b>symmetry","不對稱"],["<b>a</b>pathy","冷漠；無感"]]},
 {p:"trans-", zh:"超越、橫越", ex:[["<b>trans</b>port","運輸"],["<b>trans</b>late","翻譯"],["<b>trans</b>form","轉變"]]},
 {p:"tri-", zh:"三", ex:[["<b>tri</b>angle","三角形"],["<b>tri</b>cycle","三輪車"],["<b>tri</b>ple","三倍的"]]},
 {p:"uni-", zh:"一個", ex:[["<b>uni</b>corn","獨角獸"],["<b>uni</b>form","制服"],["<b>uni</b>te","團結；聯合"]]},
 {p:"mal-", zh:"壞的", ex:[["<b>mal</b>function","故障"],["<b>mal</b>ware","惡意軟體"],["<b>mal</b>nutrition","營養不良"]]},
 {p:"up-", zh:"在上方、向上", ex:[["<b>up</b>load","上傳"],["<b>up</b>grade","升級"],["<b>up</b>stairs","樓上"]]},
 {p:"per-", zh:"透過～、徹底地", ex:[["<b>per</b>fect","完美的"],["<b>per</b>form","表演；執行"],["<b>per</b>manent","永久的"]]},
 {p:"semi- / hemi-", zh:"一半", ex:[["<b>semi</b>circle","半圓"],["<b>semi</b>final","準決賽"],["<b>hemi</b>sphere","半球"]]},
 {p:"mono-", zh:"一、單一", ex:[["<b>mono</b>rail","單軌電車"],["<b>mono</b>logue","獨白"],["<b>mono</b>poly","獨佔；壟斷"]]},
 {p:"micro-", zh:"小的、微量的", ex:[["<b>micro</b>scope","顯微鏡"],["<b>micro</b>phone","麥克風"],["<b>micro</b>wave","微波爐"]]},
 {p:"down-", zh:"在下方、向下", ex:[["<b>down</b>load","下載"],["<b>down</b>stairs","樓下"],["<b>down</b>town","市中心"]]},
 {p:"out-", zh:"向外、更～、超過", ex:[["<b>out</b>side","外面"],["<b>out</b>put","產出"],["<b>out</b>standing","傑出的"]]},
 {p:"cent-", zh:"百", ex:[["<b>cent</b>ury","世紀"],["<b>cent</b>imeter","公分"],["<b>cent</b>ipede","蜈蚣"]]},
 {p:"bi-", zh:"二", ex:[["<b>bi</b>cycle","腳踏車"],["<b>bi</b>lingual","雙語的"],["<b>bi</b>weekly","雙週的"]]},
 {p:"multi-", zh:"多數的", ex:[["<b>multi</b>ply","相乘；增加"],["<b>multi</b>media","多媒體"],["<b>multi</b>ple","多重的"]]},
 {p:"over-", zh:"超過、跨越、太過～", ex:[["<b>over</b>come","克服"],["<b>over</b>sleep","睡過頭"],["<b>over</b>flow","溢出"]]},
 {p:"under- / infra-", zh:"在～下方", ex:[["<b>under</b>ground","地下的"],["<b>under</b>line","畫底線"],["<b>infra</b>red","紅外線"]]},
 {p:"mil-", zh:"千", ex:[["<b>mil</b>lion","百萬"],["<b>mil</b>limeter","公釐"],["<b>mil</b>lennium","千年；千禧年"]]}
];
const PFC_IMG = ["en","in-inside","ob","a-toward","ad","counter","un","dis","de","ab","pre","inter","ex","syn","con","sur","super","sub","re","fore","dou","in-not","mis","a-not","trans","tri","uni","mal","up","per","semi","mono","micro","down","out","cent","bi","multi","over","under","mil"];

/* ---------- data: 22 common suffixes (text cards) ---------- */
const SUFFIX_CARDS = [
 {p:"-tion / -sion", pos:"名詞字尾", zh:"動作或狀態", ex:[["ac<b>tion</b>","行動"],["deci<b>sion</b>","決定"],["educa<b>tion</b>","教育"]]},
 {p:"-ment", pos:"名詞字尾", zh:"結果或狀態", ex:[["move<b>ment</b>","動作"],["agree<b>ment</b>","協議"],["develop<b>ment</b>","發展"]]},
 {p:"-ness", pos:"名詞字尾", zh:"性質、狀態", ex:[["happi<b>ness</b>","快樂"],["kind<b>ness</b>","仁慈"],["dark<b>ness</b>","黑暗"]]},
 {p:"-ity / -ty", pos:"名詞字尾", zh:"性質", ex:[["abil<b>ity</b>","能力"],["real<b>ity</b>","現實"],["safe<b>ty</b>","安全"]]},
 {p:"-er / -or", pos:"名詞字尾", zh:"做…的人或物", ex:[["teach<b>er</b>","老師"],["act<b>or</b>","演員"],["visit<b>or</b>","訪客"]]},
 {p:"-ist", pos:"名詞字尾", zh:"專家、從事者", ex:[["art<b>ist</b>","藝術家"],["scient<b>ist</b>","科學家"],["pian<b>ist</b>","鋼琴家"]]},
 {p:"-ship", pos:"名詞字尾", zh:"身分、關係", ex:[["friend<b>ship</b>","友誼"],["leader<b>ship</b>","領導"],["member<b>ship</b>","會員身分"]]},
 {p:"-hood", pos:"名詞字尾", zh:"時期、身分", ex:[["child<b>hood</b>","童年"],["neighbor<b>hood</b>","鄰里"],["brother<b>hood</b>","手足情"]]},
 {p:"-ance / -ence", pos:"名詞字尾", zh:"狀態、性質", ex:[["import<b>ance</b>","重要"],["differ<b>ence</b>","差異"],["pati<b>ence</b>","耐心"]]},
 {p:"-ism", pos:"名詞字尾", zh:"主義、制度", ex:[["tour<b>ism</b>","旅遊業"],["hero<b>ism</b>","英雄氣概"],["real<b>ism</b>","寫實主義"]]},
 {p:"-ful", pos:"形容詞字尾", zh:"充滿…的", ex:[["help<b>ful</b>","有幫助的"],["beauti<b>ful</b>","美麗的"],["care<b>ful</b>","小心的"]]},
 {p:"-less", pos:"形容詞字尾", zh:"沒有…的", ex:[["hope<b>less</b>","無望的"],["care<b>less</b>","粗心的"],["home<b>less</b>","無家的"]]},
 {p:"-ous", pos:"形容詞字尾", zh:"充滿…的", ex:[["fam<b>ous</b>","有名的"],["danger<b>ous</b>","危險的"],["nerv<b>ous</b>","緊張的"]]},
 {p:"-al", pos:"形容詞字尾", zh:"…的、關於…的", ex:[["natur<b>al</b>","自然的"],["music<b>al</b>","音樂的"],["nation<b>al</b>","國家的"]]},
 {p:"-ive", pos:"形容詞字尾", zh:"有…性質的", ex:[["act<b>ive</b>","主動的"],["creat<b>ive</b>","有創意的"],["attract<b>ive</b>","吸引人的"]]},
 {p:"-able / -ible", pos:"形容詞字尾", zh:"可…的、能…的", ex:[["comfort<b>able</b>","舒適的"],["poss<b>ible</b>","可能的"],["enjoy<b>able</b>","愉快的"]]},
 {p:"-y", pos:"形容詞字尾", zh:"充滿…的", ex:[["rain<b>y</b>","多雨的"],["sunn<b>y</b>","晴朗的"],["dirt<b>y</b>","髒的"]]},
 {p:"-ish", pos:"形容詞字尾", zh:"帶…性質的", ex:[["child<b>ish</b>","幼稚的"],["self<b>ish</b>","自私的"],["fool<b>ish</b>","愚蠢的"]]},
 {p:"-ize / -ise", pos:"動詞字尾", zh:"使成為、使…化", ex:[["real<b>ize</b>","領悟"],["organ<b>ize</b>","組織"],["memor<b>ize</b>","記住"]]},
 {p:"-ify", pos:"動詞字尾", zh:"使…化", ex:[["simpl<b>ify</b>","簡化"],["clar<b>ify</b>","釐清"],["beaut<b>ify</b>","美化"]]},
 {p:"-en", pos:"動詞字尾", zh:"使變得…", ex:[["wid<b>en</b>","加寬"],["strength<b>en</b>","加強"],["short<b>en</b>","縮短"]]},
 {p:"-ly", pos:"副詞字尾", zh:"以…的方式（…地）", ex:[["quick<b>ly</b>","快速地"],["happi<b>ly</b>","快樂地"],["careful<b>ly</b>","小心地"]]}
];

/* ---------- build decks ---------- */
const prefixDeck = PREFIX_CARDS.map((c,i)=>({type:"prefix", id:PFC_IMG[i], img:"art/prefix-cards/"+PFC_IMG[i]+".png", p:c.p, zh:c.zh, ex:c.ex, note:c.note}));
const suffixDeck = SUFFIX_CARDS.map(c=>({type:"suffix", id:c.p, p:c.p, zh:c.zh, pos:c.pos, ex:c.ex}));
const DECKS={prefix:prefixDeck, suffix:suffixDeck, all:prefixDeck.concat(suffixDeck)};
const SCOPE_TOTAL={prefix:prefixDeck.length, suffix:suffixDeck.length, all:prefixDeck.length+suffixDeck.length};

/* ---------- persistence ---------- */
const LS_KEY="eci_swipe_known_v1";
function loadKnown(){
  let raw={prefix:[],suffix:[]};
  try{ const s=localStorage.getItem(LS_KEY); if(s) raw=JSON.parse(s); }catch(e){}
  return {prefix:new Set(raw.prefix||[]), suffix:new Set(raw.suffix||[])};
}
function saveKnown(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({prefix:[...known.prefix], suffix:[...known.suffix]})); }catch(e){}
}
let known=loadKnown();

/* ---------- state ---------- */
let scope="prefix";
let active=[];     // cards this round (queue)
let revealed=false;
let busy=false;    // during leave animation

const stage=document.getElementById("stage");
const doneEl=document.getElementById("done");
const btnLeft=document.getElementById("btnLeft");
const btnRight=document.getElementById("btnRight");

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function knownCount(sc){ if(sc==="all") return known.prefix.size+known.suffix.size; return known[sc].size; }
function updateProgress(){
  const kc=knownCount(scope), tot=SCOPE_TOTAL[scope];
  document.getElementById("progTxt").textContent="已學會 "+kc+" / "+tot+"　（本輪剩 "+active.length+"）";
  document.getElementById("progBar").style.width=(tot? (kc/tot*100):0)+"%";
}

function cardFrontHTML(c){
  if(c.type==="prefix"){
    return '<div class="c-top"><img class="c-img" src="'+c.img+'" alt="'+c.p+'"><div class="c-term">'+c.p+'</div>'
         + '<div class="c-ask">這個字首是什麼意思？</div></div>';
  }
  return '<div class="c-top"><div class="c-tag">'+c.pos+'</div><div class="c-suf">'+c.p+'</div>'
       + '<div class="c-ask">這個字尾是什麼意思？</div></div>';
}
function cardAnsHTML(c){
  const ex=c.ex.map(e=>'<li><span class="w">'+e[0]+'</span><span class="g">'+e[1]+'</span></li>').join("");
  return '<div class="c-ans"><div class="a-term">'+c.p+'</div><div class="a-zh">'+c.zh+'</div>'
       + '<ul class="a-ex">'+ex+'</ul>'+(c.note?'<div class="a-note">⚠ '+c.note+'</div>':'')+'</div>';
}

let cardEl=null;
function renderTop(){
  // remove old card
  if(cardEl){ cardEl.remove(); cardEl=null; }
  revealed=false; setButtons();
  if(active.length===0){ showDone(); updateProgress(); return; }
  doneEl.classList.remove("show");
  const c=active[0];
  const el=document.createElement("div");
  el.className="card";
  el.innerHTML=cardFrontHTML(c)+cardAnsHTML(c)
    +'<div class="stamp know">會了 ✓</div><div class="stamp see">看答案 ?</div>';
  stage.appendChild(el);
  cardEl=el;
  attachDrag(el);
  updateProgress();
}
function setButtons(){
  if(revealed){
    btnLeft.className="btn-again"; btnLeft.innerHTML="↻ 再複習<small>還不熟，等等再來</small>";
    btnRight.className="btn-got"; btnRight.innerHTML="✓ 記起來了<small>這張學會了</small>";
  }else{
    btnLeft.className="btn-see"; btnLeft.innerHTML="👀 看答案<small>（左滑）</small>";
    btnRight.className="btn-know"; btnRight.innerHTML="✓ 會了<small>（右滑）</small>";
  }
}

/* actions */
function doReveal(){ if(!cardEl||revealed)return; revealed=true; cardEl.classList.add("revealed"); setButtons(); }
function markKnown(){
  if(!cardEl||busy)return;
  const c=active[0]; known[c.type].add(c.id); saveKnown();
  flyOut(1);
}
function requeue(){
  if(!cardEl||busy)return;
  const c=active.shift(); active.push(c);
  flyOut(-1, true);
}
function flyOut(dir, keep){
  busy=true;
  const el=cardEl; el.classList.add("leave"); el.classList.remove("dragging");
  el.style.transform="translateX("+(dir*140)+"%) rotate("+(dir*18)+"deg)";
  el.style.opacity="0";
  const done=()=>{ el.removeEventListener("transitionend",done); if(!keep) active.shift(); busy=false; renderTop(); };
  el.addEventListener("transitionend",done);
  setTimeout(()=>{ if(busy){ done(); } },400); // fallback
}
function leftAction(){ if(busy)return; if(!revealed) doReveal(); else requeue(); }
function rightAction(){ if(busy)return; markKnown(); }

/* drag */
function attachDrag(el){
  let sx=0, dx=0, drag=false, moved=false;
  const stampKnow=el.querySelector(".stamp.know"), stampSee=el.querySelector(".stamp.see");
  el.addEventListener("pointerdown",e=>{
    if(busy)return; drag=true; moved=false; sx=e.clientX; dx=0;
    el.classList.add("dragging"); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove",e=>{
    if(!drag)return; dx=e.clientX-sx; if(Math.abs(dx)>6)moved=true;
    el.style.transform="translateX("+dx+"px) rotate("+(dx/18)+"deg)";
    stampKnow.style.opacity=dx>0?Math.min(1,dx/90):0;
    stampSee.style.opacity=dx<0?Math.min(1,-dx/90):0;
  });
  const end=e=>{
    if(!drag)return; drag=false; el.classList.remove("dragging");
    stampKnow.style.opacity=0; stampSee.style.opacity=0;
    const TH=90;
    if(dx>TH){ rightAction(); }
    else if(dx<-TH){ leftAction(); if(!busy){ el.style.transform=""; } }
    else{
      if(!moved){ /* tap: reveal if not revealed */ if(!revealed) doReveal(); }
      el.style.transform="";
    }
  };
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

/* done screen */
function showDone(){
  const acts=document.getElementById("doneActs");
  const kc=knownCount(scope), tot=SCOPE_TOTAL[scope];
  const allKnown=kc>=tot;
  document.getElementById("doneBig").textContent=allKnown?"🏆":"🎉";
  document.getElementById("doneMsg").innerHTML= allKnown
    ? "太厲害了！這個範圍的 <b>"+tot+"</b> 個字首字尾你全部學會了。"
    : "這一輪完成！已學會 <b>"+kc+" / "+tot+"</b>。還有 "+(tot-kc)+" 個可以繼續練。";
  let html="";
  if(!allKnown) html+='<button class="a-primary" id="actAgain">繼續背還不會的 →</button>';
  html+='<button class="a-second" id="actAll">整組再背一輪（含學會的）</button>';
  html+='<button class="a-reset" id="actReset">重設這個範圍的進度</button>';
  acts.innerHTML=html;
  doneEl.classList.add("show");
  const again=document.getElementById("actAgain"); if(again) again.onclick=()=>startRound(scope,true);
  document.getElementById("actAll").onclick=()=>startRound(scope,false);
  document.getElementById("actReset").onclick=()=>{
    if(scope==="all"){ known.prefix.clear(); known.suffix.clear(); } else { known[scope].clear(); }
    saveKnown(); startRound(scope,false);
  };
}

/* round control */
function startRound(sc, onlyUnknown){
  scope=sc; busy=false; revealed=false;
  doneEl.classList.remove("show");
  let deck=DECKS[sc].slice();
  if(onlyUnknown) deck=deck.filter(c=>!known[c.type].has(c.id));
  active=shuffle(deck);
  renderTop();
}

/* scope buttons */
document.getElementById("scope").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));
  startRound(b.dataset.s, true);
});
btnLeft.onclick=leftAction;
btnRight.onclick=rightAction;
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") rightAction();
  else if(e.key==="ArrowLeft") leftAction();
  else if(e.key===" "||e.key==="Enter"){ if(!revealed){ doReveal(); e.preventDefault(); } }
});

startRound("prefix", true);
</script>
</body>
</html>
